<body>
<h1>💰 接金币</h1>
<div class="stats"><span>💰 <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="520"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=520;
let player={x:W/2-25,y:H-60,w:50,h:50},items=[],score=0,lives=3,best=0,speed=1,frame=0,gameover=false,particles=[];
try{best=parseInt(localStorage.getItem('catch_best'))||0;document.getElementById('best').textContent=best}catch(e){}

const TYPES=[
  {emoji:'🪙',color:'#ffd700',pts:10,r:14,good:true},
  {emoji:'💎',color:'#00ffff',pts:50,r:16,good:true,rare:true},
  {emoji:'⭐',color:'#ffdd59',pts:30,r:15,good:true},
  {emoji:'💣',color:'#ff4757',pts:-99,r:16,good:false},
  {emoji:'💩',color:'#8B4513',pts:-50,r:15,good:false},
  {emoji:'💖',color:'#ff6b81',pts:1,r:15,good:true,extraLife:true},
];
function spawn(){
  const tIdx=Math.random()<0.05?1:Math.random()<0.08?3:Math.random()<0.08?4:Math.random()<0.04?5:0;
  const t=TYPES[tIdx];
  items.push({x:20+Math.random()*(W-40),y:-30,type:t,speed:1.5+Math.random()*speed})
}
function update(){
  if(gameover)return;frame++;speed=1+score/200;
  if(frame%Math.max(10,30-score*0.2)===0)spawn();
  for(let i=items.length-1;i>=0;i--){
    items[i].y+=items[i].speed;
    if(items[i].y>H+40){items.splice(i,1);if(items[i]?.type?.good&&items[i]?.y>H+40){lives--;document.getElementById('lives').textContent=lives;if(lives<=0)endGame()}}
  }
  for(let i=particles.length-1;i>=0;i--){particles[i].life--;particles[i].y-=2;if(particles[i].life<=0)particles.splice(i,1)}
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.x+it.type.r>player.x&&it.x-it.type.r<player.x+player.w&&it.y+it.type.r>player.y&&it.y<player.y+player.h){
      if(it.type.good){
        score+=it.type.pts;document.getElementById('score').textContent=score;
        if(it.type.extraLife){lives=Math.min(5,lives+1);document.getElementById('lives').textContent=lives}
        if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('catch_best',best)}catch(e){}}
      }else{lives--;document.getElementById('lives').textContent=lives;if(lives<=0)endGame()}
      for(let p=0;p<8;p++)particles.push({x:it.x,y:it.y,vx:(Math.random()-0.5)*4,vy:-3,life:15,color:it.type.good?'#ffd700':'#ff4757'});
      items.splice(i,1);
    }
  }
}
function endGame(){
  gameover=true;ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-15);ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重新开始`,W/2,H/2+20);
}
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ctx.fillStyle=`rgba(255,255,255,${0.1+Math.random()*0.15})`;ctx.fillRect(Math.random()*W,(frame+i*17)%H,1.5,2)}
  items.forEach(it=>{ctx.font=`${it.type.r*1.5}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.type.emoji,it.x,it.y)});
  particles.forEach(p=>{ctx.fillStyle=`rgba(${p.color=== '#ffd700'?'255,215,0':'255,71,87'},${p.life/15})`;ctx.beginPath();ctx.arc(p.x,p.y,2+Math.random()*2,0,Math.PI*2);ctx.fill()});
  ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h-10,8);ctx.fill();
  ctx.fillStyle='#e67e22';ctx.fillRect(player.x+12,player.y+player.h-10,player.w-24,10);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('🧺',player.x+player.w/2,player.y+20);
}
c.addEventListener('mousemove',e=>{const x=e.clientX-c.getBoundingClientRect().left;player.x=Math.max(0,Math.min(W-player.w,x-player.w/2))});
c.addEventListener('touchmove',e=>{e.preventDefault();const x=e.touches[0].clientX-c.getBoundingClientRect().left;player.x=Math.max(0,Math.min(W-player.w,x-player.w/2))},{passive:false});
c.addEventListener('click',()=>{if(gameover)restart()});
function restart(){score=0;lives=3;items=[];particles=[];speed=1;frame=0;gameover=false;document.getElementById('score').textContent='0';document.getElementById('lives').textContent='3'}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>

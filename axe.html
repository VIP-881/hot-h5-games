<h1>🎯 飞斧投掷</h1>
<div class="stats"><span>🪓 <b id="axes">10</b></span><span>🎯 <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="340" height="440"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=340,H=440,CX=W/2,CY=H-180,TR=120;
let axes=[],score=0,aCount=10,best=0,rotation=0,state='aim',gameover=false;
try{best=parseInt(localStorage.getItem('axe_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function throwAxe(){
  if(state!=='aim'||aCount<=0)return;
  const dist=Math.abs(rotation%(Math.PI*2)-Math.PI);
  const pts=dist<0.2?50:dist<0.5?30:dist<1?10:dist<1.5?5:1;
  axes.push({rot:rotation%(Math.PI*2),pts,hit:true});score+=pts;
  document.getElementById('score').textContent=score;aCount--;document.getElementById('axes').textContent=aCount;
  if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('axe_best',best)}catch(e)}}
  if(aCount<=0)setTimeout(endGame,500);
}
function endGame(){gameover=true;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('飞斧用完了!',W/2,H/2-15);ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重来`,W/2,H/2+20)}
function update(){if(!gameover)rotation+=0.04}
function draw(){
  ctx.fillStyle='#2c3e50';ctx.fillRect(0,0,W,H);
  // Target
  const ringColors=['#fff','#000','#e74c3c','#f39c12','#e67e22'];
  for(let i=4;i>=0;i--){ctx.fillStyle=ringColors[i];ctx.beginPath();ctx.arc(CX,CY,TR-i*(TR/5),0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(CX,CY,TR/8,0,Math.PI*2);ctx.fill();
  // Axes stuck in target
  axes.forEach(a=>{
    ctx.save();ctx.translate(CX,CY);ctx.rotate(a.rot);
    ctx.fillStyle='#888';ctx.fillRect(-3,-10,6,20);
    ctx.fillStyle='#DEB887';ctx.fillRect(-2,-8,4,16);ctx.restore();
  });
  // Rotating aim indicator
  const ax=CX+Math.cos(rotation)*TR*0.7,ay=CY+Math.sin(rotation)*TR*0.7;
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(CX,CY,TR*0.7,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(ax,ay,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText(`🪓 ${aCount}`,W/2,H-20);
}
c.addEventListener('click',()=>{if(gameover)restart();else throwAxe()});
c.addEventListener('touchstart',e=>{e.preventDefault();if(gameover)restart();else throwAxe()});
function restart(){score=0;aCount=10;axes=[];rotation=0;gameover=false;document.getElementById('score').textContent='0';document.getElementById('axes').textContent='10'}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>

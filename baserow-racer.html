<script>
const AK='v2.xOedfPfv9hou9ht8BXTbk7OKPlRUUvh5WuyJNC8Q3mLrU5dQVGL5rARouO2DNnC-IKG0UGeYm79Cfw1aIjsOw48Fram7uaVouZHiYKGTZzMBg4SuQLJLz4gY';
let tables=[], cars=[], racing=false, positions={};

async function api(url){const r=await fetch('https://gateway.maton.ai'+url,{headers:{'Authorization':'Bearer '+AK}});return r.json()}

async function init(){
  document.getElementById('leader').textContent='⏳ 同步 Baserow...';
  try{
    // List Baserow databases
    const dbs=await api('/baserow/api/databases');
    tables=[];
    for(const db of (dbs||[]).slice(0,3)){
      try{
        const tbls=await api('/baserow/api/database/'+db.id+'/tables');
        for(const t of tbls||[]){
          try{
            const rows=await api('/baserow/api/database/'+t.id+'/table/'+t.id+'/?size=100');
            tables.push({name:t.name,db:db.name,count:(rows.results||rows||[]).length,fields:t.fields?.length||0});
          }catch(e){tables.push({name:t.name,db:db.name,count:0,fields:t.fields?.length||0})}
        }
      }catch(e){}
    }
    if(tables.length===0) tables=Array.from({length:6},(_,i)=>({name:'模拟表_'+(i+1),db:'模拟库',count:Math.floor(Math.random()*50)+5,fields:Math.floor(Math.random()*10)+2}));
    document.getElementById('leader').textContent='✅ 发现 '+tables.length+' 张数据表';
    renderLanes(0);
  }catch(e){
    document.getElementById('leader').textContent='⚠️ Baserow 未连接，使用模拟数据';
    tables=Array.from({length:8},(_,i)=>({name:'模拟表_'+(i+1),db:'Local',count:Math.floor(Math.random()*60)+5,fields:Math.floor(Math.random()*12)+2}));
    renderLanes(0);
  }
}

function renderLanes(progress){
  const icons=['🏎️','🚗','🚙','🚕','🚓','🏍️','🚌','🚐','🚛','🚜','🚲','🛵'];
  let html='';
  tables.slice(0,10).forEach((t,i)=>{
    const speed=(t.count*2+t.fields*10)/Math.max(1,tables.length);
    const pct=Math.min(progress*100,100);
    const pos=10+(progress*speed/200)*location.href.includes('?')?600:500;
    html+='<div class="car-lane"><div class="cname">'+t.name.substring(0,14)+' ('+t.count+'行)</div><div class="trail" style="width:'+pct+'%"></div><div class="car" style="left:'+pos+'px;color:'+['#4ade80','#06b6d4','#fbbf24','#ef4444','#a78bfa','#fb923c','#22c55e','#ec4899'][i%8]+'">'+icons[i%12]+'</div></div>';
  });
  document.getElementById('lanes').innerHTML=html;
}

function startRace(){
  if(racing) return; racing=true;
  const speeds=tables.map(t=>({name:t.name,count:t.count,fields:t.fields,speed:(t.count*2+t.fields*10)/20}));
  let frame=0; const maxFrames=200;
  const interval=setInterval(()=>{
    frame++;
    const pct=frame/maxFrames;
    renderLanes(pct);
    if(frame>=maxFrames){clearInterval(interval);racing=false;showResults(speeds)}
  },50);
}

function showResults(speeds){
  speeds.sort((a,b)=>b.speed-a.speed);
  const posCls=['pos-1','pos-2','pos-3'];
  const posEmoji=['🥇','🥈','🥉'];
  document.getElementById('results').innerHTML=speeds.map((s,i)=>'<div class="race-result"><span class="pos '+(posCls[i]||'')+'">'+(posEmoji[i]||(i+1))+'</span><span>'+s.name+'</span><span class="details">'+s.count+'行 · '+s.fields+'字段</span><span class="time">速度: '+Math.round(s.speed)+'</span></div>').join('');
  document.getElementById('leader').textContent='🏁 比赛结束！冠军: '+speeds[0].name;
}

init();
</script>

  {q:'澳大利亚的首都是？',opts:['悉尼','墨尔本','堪培拉','布里斯班'],a:2,cat:'🌍 地理'},
  {q:'相对论是哪位科学家提出的？',opts:['牛顿','爱因斯坦','霍金','伽利略'],a:1,cat:'🚀 科学'},

let questions=[],idx=0,correct=0,best=0,answered=false;
try{best=parseInt(localStorage.getItem('quiz_best'))||0;document.getElementById('quiz-best').textContent=best}catch(e){}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startQuiz(){questions=shuffle([...ALL_QUESTIONS]).slice(0,10);idx=0;correct=0;answered=false;
  document.getElementById('quiz-correct').textContent='0';document.getElementById('quiz-num').textContent='0/10';document.getElementById('result').textContent='';showQ()}

function showQ(){if(idx>=10){document.getElementById('q').textContent='🎉 测验完成！';document.getElementById('opts').innerHTML='';document.getElementById('cat').textContent='';
    if(correct>best){best=correct;document.getElementById('quiz-best').textContent=best;try{localStorage.setItem('quiz_best',best)}catch(e)}document.getElementById('result').textContent=`最终得分: ${correct}/10`;return}
  const q=questions[idx];document.getElementById('q').textContent=q.q;document.getElementById('cat').textContent=q.cat;document.getElementById('quiz-num').textContent=`${idx+1}/10`;answered=false;
  const opts=document.getElementById('opts');opts.innerHTML='';
  q.opts.forEach((o,i)=>{const btn=document.createElement('div');btn.className='opt';btn.textContent=o;
    btn.addEventListener('click',()=>{if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>b.classList.add('disabled'));
      if(i===q.a){btn.classList.add('correct');correct++;document.getElementById('quiz-correct').textContent=correct;document.getElementById('result').textContent='✅ 正确！'}else{btn.classList.add('wrong');document.querySelectorAll('.opt')[q.a].classList.add('correct');document.getElementById('result').textContent=`❌ 正确答案: ${q.opts[q.a]}`}
      setTimeout(()=>{idx++;document.getElementById('result').textContent='';showQ()},1000)});
    opts.appendChild(btn)})}
startQuiz();

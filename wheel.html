<h1>🎪 幸运转盘</h1>
<div class="stats"><span>💰 <b id="coins">100</b></span><span>🎁 <b id="prizes">0</b></span></div>
<canvas id="c" width="360" height="380"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=380,CX=W/2,CY=H/2-10;
const SEGMENTS=['💰 x5','💎 x20','❌ -10','🎁','💰 x10','👻 0','⭐ x30','❌ -5','💰 x2','🎁 x2'];
const COLORS=['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c','#ff7675','#fdcb6e','#a29bfe'];
let angle=0,spinning=false,coins=100,prizes=0;
function spin(){
  if(spinning||coins<10)return;coins-=10;spinning=true;
  const target=angle+Math.PI*4+Math.random()*Math.PI*2;
  const seg=Math.floor((target%(Math.PI*2))/(Math.PI*2/10));
  const start=Date.now();const duration=2000;const startAngle=angle;
  function anim(){const t=(Date.now()-start)/duration;if(t>=1){angle=target%(Math.PI*2);spinning=false;
    const r=SEGMENTS[seg];if(r.includes('❌'))coins+=parseInt(r.match(/-?\d+/)[0]||0);
    else{const m=r.match(/\d+/);if(m)coins+=parseInt(m[0]);else if(r.includes('🎁'))prizes++}
    document.getElementById('coins').textContent=Math.max(0,coins);document.getElementById('prizes').textContent=prizes;draw();return}
    angle=startAngle+(target-startAngle)*t;draw();requestAnimationFrame(anim)}anim();
}
function draw(){
  ctx.fillStyle='#d63031';ctx.fillRect(0,0,W,H);
  SEGMENTS.forEach((s,i)=>{const sa=i*Math.PI*2/10+angle,ea=sa+Math.PI*2/10;ctx.fillStyle=COLORS[i];ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,150,sa,ea);ctx.closePath();ctx.fill();
    const ma=sa+Math.PI/10;ctx.save();ctx.translate(CX,CY);ctx.rotate(ma);ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(s,95,4);ctx.restore()});
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(CX,CY,30,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#d63031';ctx.beginPath();ctx.arc(CX,CY,20,0,Math.PI*2);ctx.fill();
  // Pointer
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(CX+145,CY);ctx.lineTo(CX+155,CY-10);ctx.lineTo(CX+160,CY);ctx.lineTo(CX+155,CY+10);ctx.fill();
}
c.addEventListener('click',spin);draw();
</script>

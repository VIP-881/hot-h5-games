<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🎪 接住小鸡 - 热门H5游戏</title>
<meta name="description" content="接住小鸡休闲游戏，移动安全垫接住从树上掉下来的小鸡宝宝，有爱心又有趣免费在线">
<meta property="og:title" content="🎪 接住小鸡 - 热门H5游戏"><meta property="og:description" content="移动垫子接住掉落的小鸡"><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"接住小鸡"}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#87CEEB,#a8e6cf);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;touch-action:none}h1{font-size:1.6em;margin:4px 0}.stats{display:flex;gap:12px;margin:6px 0 8px}.stats span{background:rgba(255,255,255,0.25);padding:4px 12px;border-radius:20px;font-size:0.9em;font-weight:600}canvas{display:block;border-radius:10px;max-width:96vw}</style>
</head>
<body>
<h1>🎪 接住小鸡</h1>
<div class="stats"><span>🐥 <b id="saved">0</b></span><span>💔 <b id="missed">0</b>/10</span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="500"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=500,G=0.15;
let pad={x:W/2-40,y:H-70,w:80,h:12},chicks=[],saved=0,missed=0,best=0,gameover=false;
try{best=parseInt(localStorage.getItem('chick_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function spawn(){chicks.push({x:30+Math.random()*(W-60),y:-20,r:14,vy:1+Math.random()*2,vx:(Math.random()-0.5)*3,alive:true})}
function update(){if(gameover)return;if(Math.random()<0.025)spawn();
  for(let i=chicks.length-1;i>=0;i--){chicks[i].y+=chicks[i].vy;chicks[i].vy+=G;chicks[i].x+=chicks[i].vx;
    if(chicks[i].y+chicks[i].r>H-80&&chicks[i].x>pad.x&&chicks[i].x<pad.x+pad.w&&chicks[i].vy>0){saved++;document.getElementById('saved').textContent=saved;chicks.splice(i,1);if(saved>best){best=saved;document.getElementById('best').textContent=best;try{localStorage.setItem('chick_best',best)}catch(e)}continue}
    if(chicks[i].y>H+30){missed++;document.getElementById('missed').textContent=missed;chicks.splice(i,1);if(missed>=10)endGame()}}
}
function endGame(){gameover=true;ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('游戏结束!',W/2,H/2-15);ctx.font='16px sans-serif';ctx.fillText(`救了 ${saved} 只小鸡  点击重来`,W/2,H/2+20)}
function draw(){
  ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#228B22';ctx.fillRect(0,H-50,W,50);ctx.fillStyle='#2ecc71';ctx.fillRect(0,H-52,W,4);
  ctx.fillStyle='#8B4513';ctx.fillRect(W/2-6,50,12,80);ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.arc(W/2,40,40,0,Math.PI*2);ctx.fill();
  chicks.forEach(c=>{ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.arc(c.x,c.y-c.r*0.3,c.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f39c12';ctx.beginPath();ctx.arc(c.x-3,c.y-c.r*0.3-4,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(c.x-3,c.y-c.r*0.3-4,1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.moveTo(c.x,c.y+c.r*0.4);ctx.lineTo(c.x-2,c.y+c.r*0.8);ctx.lineTo(c.x+2,c.y+c.r*0.8);ctx.fill()});
  ctx.fillStyle='#fff';ctx.fillRect(pad.x,pad.y,pad.w,pad.h);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(pad.x+5,pad.y-4,pad.w-10,4);
}
c.addEventListener('mousemove',e=>{pad.x=e.clientX-c.getBoundingClientRect().left-pad.w/2});
c.addEventListener('touchmove',e=>{e.preventDefault();pad.x=e.touches[0].clientX-c.getBoundingClientRect().left-pad.w/2},{passive:false});
c.addEventListener('click',()=>{if(gameover)restart()});
function restart(){saved=0;missed=0;chicks=[];gameover=false;document.getElementById('saved').textContent='0';document.getElementById('missed').textContent='0'}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>

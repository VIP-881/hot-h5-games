<body>
<h1>🎵 音乐记忆</h1>
<div class="stats"><span>🧠 <b id="level">1</b></span><span>🏆 <b id="best">1</b></span></div>
<div class="board">
  <button class="btn-c red" id="btn0" onclick="press(0)"></button>
  <button class="btn-c blue" id="btn1" onclick="press(1)"></button>
  <button class="btn-c green" id="btn2" onclick="press(2)"></button>
  <button class="btn-c yellow" id="btn3" onclick="press(3)"></button>
</div>
<div class="info" id="info">点击开始</div>
<button class="btn" onclick="startGame()">▶ 开始</button>
<script>
let sequence=[],playerIdx=0,level=1,playing=false,best=1;
const tones=[261,329,392,523]; // C4 E4 G4 C5
const btns=['btn0','btn1','btn2','btn3'];
try{best=parseInt(localStorage.getItem('simon_best'))||1;document.getElementById('best').textContent=best}catch(e){}
function startGame(){sequence=[];playerIdx=0;level=1;playing=false;document.getElementById('level').textContent='1';nextRound()}
function nextRound(){
  sequence.push(Math.floor(Math.random()*4));playerIdx=0;playing=false;
  document.getElementById('info').textContent='👀 记住序列...';
  let i=0;
  const show=setInterval(()=>{
    if(i>=sequence.length){clearInterval(show);playing=true;document.getElementById('info').textContent='👆 重复序列';return}
    const btn=document.getElementById(btns[sequence[i]]);btn.classList.add('active');
    playTone(sequence[i]);setTimeout(()=>btn.classList.remove('active'),300);i++;
  },600);
}
function press(i){
  if(!playing)return;
  const btn=document.getElementById(btns[i]);btn.classList.add('active');playTone(i);setTimeout(()=>btn.classList.remove('active'),150);
  if(sequence[playerIdx]===i){playerIdx++;
    if(playerIdx>=sequence.length){level++;document.getElementById('level').textContent=level;if(level>best){best=level;document.getElementById('best').textContent=best;try{localStorage.setItem('simon_best',best)}catch(e)}document.getElementById('info').textContent='✅ 正确!';setTimeout(nextRound,800)}
  }else{document.getElementById('info').textContent='❌ 错了! 重新开始';playing=false;setTimeout(startGame,1000)}
}
function playTone(i){const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=tones[i];g.gain.value=0.3;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.3);o.stop(a.currentTime+0.3)}
</script>

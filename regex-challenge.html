<style>

<body>
<nav><a href="index.html">← 大厅</a><span>🧬 Regex Challenge</span></nav>
<header><h1>🧬 Regex Challenge</h1><p>输入正则表达式匹配目标 · 10关从简单到高级</p></header>
<div class="container">
  <div class="hud">
    <div class="hud-item"><div class="val" id="hScore" style="color:#fbbf24">0</div><div class="lbl">⭐ 分</div></div>
    <div class="hud-item"><div class="val" id="hLevel" style="color:#4ade80">1/10</div><div class="lbl">🧬 关</div></div>
    <div class="hud-item"><div class="val" id="hCombo" style="color:#06b6d4">x1</div><div class="lbl">🔥 连击</div></div>
  </div>
  <div class="level-card">
    <div class="level-info" id="levelDesc"></div>
    <div class="targets" id="targets"></div>
    <div class="regex-input">
      <span class="prefix">/</span>
      <input type="text" id="regexInput" placeholder="输入正则表达式..." spellcheck="false" autocomplete="off" onkeydown="if(event.key==='Enter')checkRegex()">
      <span class="suffix">/g</span>
    </div>
    <div class="highlight-area"><div class="sample" id="sample"></div></div>
    <div class="hint-area" id="hintArea"></div>
  </div>
  <div class="controls">
    <button class="btn-check" id="checkBtn" onclick="checkRegex()">✅ 验证</button>
    <button class="btn-hint" onclick="showHint()">💡 提示</button>
    <button class="btn-hint" style="background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.15)" onclick="skipLevel()">⏭ 跳过</button>
  </div>
</div>
<div class="result-overlay" id="overlay"><h2 id="oTitle"></h2><p id="oDesc" style="color:#888;margin:8px 0"></p><button id="oBtn">🔄 重新开始</button></div>
<footer>Powered by Maton.ai · Regex 训练场 · 🦊 灵犀出品</footer>
<script>
const LEVELS=[
  {desc:'匹配所有数字',samples:[{text:'abc123def',shouldMatch:true,target:'123'},{text:'hello456world',shouldMatch:true,target:'456'},{text:'no numbers here',shouldMatch:false}],hint:'用 \\\\d+ 匹配一个或多个数字'},
  {desc:'匹配邮箱地址',samples:[{text:'user@example.com',shouldMatch:true},{text:'hello world',shouldMatch:false},{text:'admin@test.cn',shouldMatch:true}],hint:'[\\\\w.]+@[\\\\w]+\\\\.[\\\\w]+'},
  {desc:'匹配以 # 开头的标签',samples:[{text:'#javascript #css',shouldMatch:true,target:'#javascript/#css'},{text:'no tags here',shouldMatch:false},{text:'#react is great',shouldMatch:true,target:'#react'}],hint:'#\\\\w+'},
  {desc:'匹配手机号 (1开头11位)',samples:[{text:'13812345678',shouldMatch:true},{text:'12345678901',shouldMatch:false},{text:'我的号是13987654321',shouldMatch:true,target:'13987654321'}],hint:'1[3-9]\\\\d{9}'},
  {desc:'匹配 URL',samples:[{text:'https://github.com',shouldMatch:true},{text:'not a url',shouldMatch:false},{text:'http://localhost:3000',shouldMatch:true}],hint:'https?://\\\\S+'},
  {desc:'匹配日期 YYYY-MM-DD',samples:[{text:'2024-01-15',shouldMatch:true},{text:'99-01-15',shouldMatch:false},{text:'生于2023-12-31',shouldMatch:true,target:'2023-12-31'}],hint:'\\\\d{4}-\\\\d{2}-\\\\d{2}'},
  {desc:'匹配重复单词',samples:[{text:'the the cat',shouldMatch:true,target:'the the'},{text:'hello hello world',shouldMatch:true,target:'hello hello'},{text:'no repeats here',shouldMatch:false}],hint:'(\\\\w+)\\\\s+\\\\1'},
  {desc:'匹配合法 IPv4',samples:[{text:'192.168.1.1',shouldMatch:true},{text:'256.1.1.1',shouldMatch:false},{text:'10.0.0.255',shouldMatch:true}],hint:'((25[0-5]|2[0-4]\\\\d|1\\\\d{2}|\\\\d{1,2})\\\\.){3}(25[0-5]|2[0-4]\\\\d|1\\\\d{2}|\\\\d{1,2})'},
  {desc:'提取引号内内容',samples:[{text:'say "hello world" now',shouldMatch:true,target:'\\\"hello world\\\"'},{text:'no quotes',shouldMatch:false},{text:'name="Alice" age=30',shouldMatch:true,target:'\\\"Alice\\\"'}],hint:'"[^"]*"'},
  {desc:'匹配密码 (8位+ 含大小写数字)',samples:[{text:'Pass1234',shouldMatch:true},{text:'short1',shouldMatch:false},{text:'STRONGpass99',shouldMatch:true}],hint:'(?=.*[a-z])(?=.*[A-Z])(?=.*\\\\d).{8,}'},
];
let score=0,combo=0,level=0;

function renderLevel(){
  if(level>=LEVELS.length){endGame();return}
  const l=LEVELS[level];
  document.getElementById('hLevel').textContent=(level+1)+'/'+LEVELS.length;
  document.getElementById('levelDesc').textContent='🎯 '+l.desc;
  document.getElementById('regexInput').value='';
  document.getElementById('hintArea').textContent='';
  document.getElementById('targets').innerHTML=l.samples.map(s=>'<div class="target-item"><span class="label '+(s.shouldMatch?'label-match':'label-nomatch')+'">'+(s.shouldMatch?'匹配':'不匹配')+'</span><span class="text">'+(s.text.replace(/&/g,'&amp;').replace(/</g,'&lt;'))+'</span><span class="status" id="st-'+s.text+'">⏳</span></div>').join('');
  document.getElementById('sample').innerHTML=l.samples.map(s=>'<span>'+s.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>').join(' | ');
  document.getElementById('regexInput').focus();
}

document.getElementById('regexInput').addEventListener('input',function(){
  const r=this.value;
  if(!r){document.getElementById('sample').innerHTML=LEVELS[level].samples.map(s=>'<span>'+s.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>').join(' | ');return}
  try{
    const re=new RegExp(r,'g');
    document.getElementById('sample').innerHTML=LEVELS[level].samples.map(s=>{
      const hl=s.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(re,function(m){return'<span class="match-hl">'+m.replace(/&/g,'&amp;')+'</span>'});
      return'<span>'+hl+'</span>';
    }).join(' | ');
  }catch(e){document.getElementById('hintArea').textContent='⚠️ '+e.message}
});

function checkRegex(){
  const r=document.getElementById('regexInput').value;
  if(!r) return;
  const l=LEVELS[level];
  try{new RegExp(r)}catch(e){document.getElementById('hintArea').textContent='❌ 无效的正则: '+e.message;return}
  const re=new RegExp(r);
  let allCorrect=true;
  l.samples.forEach(s=>{
    const matched=re.test(s.text);
    const correct=matched===s.shouldMatch;
    if(!correct) allCorrect=false;
    document.getElementById('st-'+s.text).textContent=correct?'✅':'❌';
  });
  if(allCorrect){combo++;score+=100+combo*15;document.getElementById('hintArea').innerHTML='<span style="color:#4ade80">✅ 完美！+'+(100+combo*15)+' 分</span>'}else{combo=0;document.getElementById('hintArea').innerHTML='<span style="color:#f87171">❌ 部分不匹配，再试一次</span>'}
  updateHUD();
  if(allCorrect) setTimeout(nextLevel,800);
}

function showHint(){document.getElementById('hintArea').textContent='💡 '+LEVELS[level].hint}
function skipLevel(){combo=0;score=Math.max(0,score-15);updateHUD();nextLevel()}
function nextLevel(){level++;renderLevel()}
function updateHUD(){document.getElementById('hScore').textContent=score;document.getElementById('hCombo').textContent='x'+(combo+1)}

function endGame(){
  const o=document.getElementById('overlay');o.style.display='block';
  document.getElementById('oTitle').textContent='🧬 '+score+' 分';
  document.getElementById('oTitle').style.color='#fbbf24';
  document.getElementById('oDesc').textContent=LEVELS.length+' 关完成 · 最大连击 x'+(Math.max(1,combo+1));
  document.getElementById('oBtn').onclick=()=>{o.style.display='none';score=0;combo=0;level=0;renderLevel()}
}

renderLevel();
</script>
</body>

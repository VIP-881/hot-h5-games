<div class="arena">
<h1>🔗 连线游戏</h1>
<p class="info"><span>🏆 步数: <b id="moves">0</b></span><span>🧩 关卡: <b id="lvname">L1</b></span></p>
<div class="colors" id="palette"></div>

<p class="msg" id="msg"></p>
<div class="btns">
<button class="btn" onclick="undo()">↩ 撤销</button>
<button class="btn" onclick="resetLevel()">🔄 重置</button>
<button class="btn" id="nextBtn" onclick="nextLevel()" disabled>▶ 下一关</button>

<script>
const COLORS = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];

// Levels: [size, [[r1,c1,r2,c2], ...]]  pairs of endpoints
const LEVELS = [
  [5, [[0,0,4,0],[0,2,4,2],[1,1,3,4]]],
  [5, [[0,0,4,4],[0,2,4,1],[2,0,2,4]]],
  [5, [[0,1,4,1],[1,0,3,4],[0,3,4,3],[2,0,2,2]]],
  [6, [[0,0,5,5],[0,2,5,2],[1,0,4,4],[2,1,5,3]]],
  [6, [[0,0,5,0],[0,3,5,3],[1,1,4,5],[2,2,5,4],[0,5,3,2]]],
  [7, [[0,0,6,6],[0,2,6,4],[0,5,5,1],[2,0,4,6],[3,1,6,2]]],
];

let size, pairs, grid, paths, activeColor, moves, lvl, history;

function init(){
  let data=LEVELS[lvl];
  size=data[0]; pairs=data[1];
  grid=Array.from({length:size},()=>Array(size).fill(-1));
  paths=pairs.map(()=>[]);
  activeColor=null; moves=0; history=[];
  
  // Place endpoints
  pairs.forEach((p,i)=>{
    grid[p[0]][p[1]]=i;
    grid[p[2]][p[3]]=i;
  });
  
  document.getElementById('moves').textContent='0';
  document.getElementById('msg').textContent='';
  document.getElementById('lvname').textContent=`L${lvl+1} (${size}×${size})`;
  document.getElementById('nextBtn').disabled=true;
  renderPalette();
  renderGrid();
  renderLevels();
}

function renderPalette(){
  let p=document.getElementById('palette');
  p.innerHTML=pairs.map((_,i)=>`<div class="dot${activeColor===i?' active':''}" style="background:${COLORS[i]}" onclick="selectColor(${i})"></div>`).join('');
}

function renderGrid(){
  let g=document.getElementById('grid');
  g.style.gridTemplateColumns=`repeat(${size},1fr)`;
  g.innerHTML='';
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      let isEp=pairs.some((p,i)=>grid[r][c]===i&&!paths[i].some(x=>x[0]===r&&x[1]===c));
      let inPath=pairs.some((p,i)=>paths[i].some(x=>x[0]===r&&x[1]===c));
      let cls='cell';
      if(isEp) cls+=' endpoint';
      if(inPath) cls+=' path';
      let bg='',colorIdx=grid[r][c];
      if(isEp||inPath){
        bg=`background:${COLORS[colorIdx]};`;
        if(isEp) bg+=`border-color:${COLORS[colorIdx]};`;
      }
      g.innerHTML+=`<div class="${cls}" style="${bg}" onclick="tap(${r},${c})">${isEp?'●':''}</div>`;
    }
  }
}

function selectColor(i){
  activeColor=i;
  renderPalette();
}

function tap(r,c){
  if(document.getElementById('msg').textContent) return;
  
  // If clicking an endpoint, select that color
  let epIdx=pairs.findIndex((p,i)=>((p[0]===r&&p[1]===c)||(p[2]===r&&p[3]===c))&&paths[i].length===0);
  if(epIdx>=0&&paths[epIdx].length===0){
    activeColor=epIdx;
    renderPalette();
    return;
  }
  
  if(activeColor===null) return;
  
  let path=paths[activeColor];
  
  // Starting new path from an endpoint
  if(path.length===0){
    let start=pairs[activeColor];
    if((r===start[0]&&c===start[1])||(r===start[2]&&c===start[3])){
      // Save state
      history.push({grid:grid.map(r=>[...r]),paths:paths.map(p=>[...p]),activeColor});
      path.push([r,c]);
      grid[r][c]=activeColor;
      moves++;
      document.getElementById('moves').textContent=moves;
      renderGrid();
    }
    return;
  }
  
  let last=path[path.length-1];
  
  // Must be adjacent
  if(Math.abs(r-last[0])+Math.abs(c-last[1])!==1) return;
  
  // Can't go through other paths or endpoints
  let targetColor=grid[r][c];
  if(targetColor>=0&&targetColor!==activeColor){
    // If this is the other endpoint of the same color and path covers all cells
    let end=pairs[activeColor];
    if((r===end[2]&&c===end[3])||(r===end[0]&&c===end[1])){
      history.push({grid:grid.map(r=>[...r]),paths:paths.map(p=>[...p]),activeColor});
      path.push([r,c]);
      grid[r][c]=activeColor;
      moves++;
      document.getElementById('moves').textContent=moves;
      renderGrid();
      checkWin();
    }
    return;
  }
  
  // Empty cell
  if(targetColor===-1){
    history.push({grid:grid.map(r=>[...r]),paths:paths.map(p=>[...p]),activeColor});
    path.push([r,c]);
    grid[r][c]=activeColor;
    moves++;
    document.getElementById('moves').textContent=moves;
    renderGrid();
  }
}

function checkWin(){
  let allConnected=pairs.every((_,i)=>paths[i].length>=2);
  let allFilled=grid.every(row=>row.every(c=>c>=0));
  if(allConnected&&allFilled){
    document.getElementById('msg').textContent='🎉 通关！';
    document.getElementById('nextBtn').disabled=false;
    localStorage.setItem('flowfree_done_'+lvl,'1');
    renderLevels();
  }
}

function undo(){
  if(history.length===0) return;
  let h=history.pop();
  grid=h.grid;
  paths=h.paths;
  activeColor=h.activeColor;
  moves--;
  document.getElementById('moves').textContent=moves;
  document.getElementById('msg').textContent='';
  renderGrid();
  renderPalette();
}

function resetLevel(){init()}
function nextLevel(){if(lvl<LEVELS.length-1){lvl++;init()}}
function setLevel(i){lvl=i;init()}

function renderLevels(){
  let l=document.getElementById('levels');
  l.innerHTML=LEVELS.map((lv,i)=>`<button class="lvl ${i===lvl?'cur':''} ${localStorage.getItem('flowfree_done_'+i)?'done':''}" onclick="setLevel(${i})">L${i+1}</button>`).join('');
}

lvl=0; init();
</script>

<body>
<h1>✂️ 石头剪刀布</h1>
<div class="stats"><span>👤 <b id="rps-p">0</b></span><span>🤖 <b id="rps-ai">0</b></span><span>🤝 <b id="rps-d">0</b></span></div>
<div id="rps-round">第 1 局</div>
<div class="moves">
  <div class="mbtn" data-m="0">🪨</div>
  <div class="mbtn" data-m="1">✂️</div>
  <div class="mbtn" data-m="2">📄</div>
</div>
<div id="result">🪨 ✂️ 📄</div>
<div id="history"></div>
<div><button class="btn" onclick="resetRPS()">🔄 重来</button></div>
<script>
const NAMES=['🪨 石头','✂️ 剪刀','📄 布'];
const BEATS={0:1,1:2,2:0}; // what this beats
const LOSES_TO={0:2,1:0,2:1}; // what loses to this
let pScore=0,aiScore=0,drawScore=0,round=1,history=[],gameover=false;
let freq={0:0,1:0,2:0}; // AI learning

function resetRPS(){pScore=0;aiScore=0;drawScore=0;round=1;history=[];gameover=false;freq={0:0,1:0,2:0};
  document.querySelectorAll('.mbtn').forEach(b=>b.disabled=false);
  document.getElementById('rps-p').textContent='0';document.getElementById('rps-ai').textContent='0';document.getElementById('rps-d').textContent='0';
  document.getElementById('rps-round').textContent='第 1 局';document.getElementById('result').textContent='🪨 ✂️ 📄';document.getElementById('history').textContent=''}

function aiChoice(){// Pattern detection - if player has a pattern, counter it
  if(history.length<2)return Math.floor(Math.random()*3);
  // Check for repeat patterns
  const last=history[history.length-1];
  if(history.length>=3&&history[history.length-2]===last&&history[history.length-3]===last){return LOSES_TO[last]} // repeat detection
  // Frequency based - play what would beat the most common
  const total=Object.values(freq).reduce((a,b)=>a+b,0);if(total===0)return Math.floor(Math.random()*3);
  const mostCommon=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
  return parseInt(mostCommon)===last?Math.floor(Math.random()*3):BEATS[parseInt(mostCommon)]}

document.querySelectorAll('.mbtn').forEach(btn=>{btn.addEventListener('click',()=>{if(gameover)return;
  const p=parseInt(btn.dataset.m);const a=aiChoice();freq[p]++;history.push(p);
  let msg;
  if(BEATS[p]===a){pScore++;round++;msg='✅ 你赢了!';document.getElementById('rps-p').textContent=pScore}
  else if(p===a){drawScore++;msg='🤝 平局';document.getElementById('rps-d').textContent=drawScore}
  else{aiScore++;msg='❌ AI赢了';document.getElementById('rps-ai').textContent=aiScore}
  document.getElementById('result').textContent=`${NAMES[p]} vs ${NAMES[a]} — ${msg}`;
  document.getElementById('rps-round').textContent=`第 ${round} 局`;
  const h=document.getElementById('history');h.textContent=`历史: ${history.map(m=>'🪨✂️📄'[m]).join(' ')}`;
  if(pScore>=3||aiScore>=3){gameover=true;document.querySelectorAll('.mbtn').forEach(b=>b.disabled=true);
    document.getElementById('result').textContent+=` 🎉 ${pScore>=3?'你获胜!':'AI获胜!'}`}})});
resetRPS();
</script>

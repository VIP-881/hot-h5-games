<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏗️ 叠叠乐 - 热门H5游戏</title>
<meta name="description" content="叠叠乐H5小游戏，精准点击堆叠方块建造最高塔楼，考验手眼协调，免费在线休闲游戏">
<meta property="og:title" content="🏗️ 叠叠乐 - 热门H5游戏">
<meta property="og:description" content="精准堆叠方块，建造最高塔楼">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"叠叠乐","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#87CEEB,#4682B4);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none}
h1{font-size:1.8em;margin:4px 0;text-shadow:0 2px 6px rgba(0,0,0,0.3)}
.stats{display:flex;gap:12px;margin:6px 0 8px}
.stats span{background:rgba(255,255,255,0.2);padding:5px 14px;border-radius:20px;font-size:0.95em;font-weight:600}
canvas{display:block;border-radius:10px;max-width:96vw;box-shadow:0 4px 24px rgba(0,0,0,0.2);cursor:pointer}
</style>
</head>
<body>
<h1>🏗️ 叠叠乐</h1>
<div class="stats"><span>🏗️ <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="550"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=550,BH=22,BW=100;
let blocks=[],currentBlock={x:W/2-BW/2,y:0,w:BW,h:BH,speed:3,dir:1},score=0,best=0,state='playing',cameraY=0;
try{best=parseInt(localStorage.getItem('stack_best'))||0;document.getElementById('best').textContent=best}catch(e){}
blocks.push({x:W/2-BW/2,y:H-BH*3,w:BW,h:BH}); // base

function drop(){
  const base=blocks[blocks.length-1];
  const overlap=Math.max(0,Math.min(currentBlock.x+currentBlock.w,base.x+base.w)-Math.max(currentBlock.x,base.x));
  if(overlap<=0){endGame();return}
  const newW=overlap;
  const newX=Math.max(currentBlock.x,base.x);
  const newY=base.y-BH;
  blocks.push({x:newX,y:newY,w:newW,h:BH});
  score++;document.getElementById('score').textContent=score;
  if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('stack_best',best)}catch(e){}}
  cameraY=Math.min(cameraY,newY-H*0.6);
  currentBlock={x:0,y:newY-BH-BH,w:Math.max(30,BW-score*0.8),h:BH,speed:3+score*0.2,dir:1};
}
function endGame(){
  state='over';ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('💥 塌了!',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillText(`${score} 层  点击重新开始`,W/2,H/2+20);
}
function draw(){
  ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(0,-cameraY);
  blocks.forEach((b,i)=>{
    const hue=(i*15+30)%360;
    ctx.fillStyle=`hsl(${hue},70%,${45+i*2}%)`;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle=`hsla(${hue},80%,70%,0.4)`;ctx.fillRect(b.x+2,b.y+2,b.w-4,3);
  });
  if(state==='playing'){
    const cb=currentBlock;
    ctx.fillStyle='#ffd700';ctx.fillRect(cb.x,cb.y,cb.w,cb.h);
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(cb.x+2,cb.y+2,cb.w-4,3);
  }
  ctx.restore();
  if(state==='playing'){ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(score,W/2,40)}
}
function update(){
  if(state!=='playing')return;
  currentBlock.x+=currentBlock.speed*currentBlock.dir;
  if(currentBlock.x<=0){currentBlock.dir=1;currentBlock.x=0}
  if(currentBlock.x+currentBlock.w>=W){currentBlock.dir=-1;currentBlock.x=W-currentBlock.w}
}
c.addEventListener('click',()=>{if(state==='playing')drop();else restart()});
c.addEventListener('touchstart',e=>{e.preventDefault();if(state==='playing')drop();else restart()});
function restart(){blocks=[{x:W/2-BW/2,y:H-BH*3,w:BW,h:BH}];score=0;state='playing';cameraY=0;currentBlock={x:0,y:H-BH*3-BH-BH,w:BW,h:BH,speed:3,dir:1};document.getElementById('score').textContent='0'}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏔️ 滑雪大冒险 - 热门H5游戏</title>
<meta name="description" content="滑雪大冒险H5游戏，左右躲避树木和岩石，收集金币加速下滑，免费在线体育竞技小游戏">
<meta property="og:title" content="🏔️ 滑雪大冒险 - 热门H5游戏">
<meta property="og:description" content="滑雪躲避障碍，收集金币加速下滑">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"滑雪大冒险","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#87CEEB,#f0f0f0);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#2d3436;user-select:none;-webkit-user-select:none;touch-action:none}
h1{font-size:1.8em;margin:4px 0;color:#2d5016}
.stats{display:flex;gap:12px;margin:6px 0 8px}
.stats span{background:rgba(0,0,0,0.08);padding:5px 14px;border-radius:20px;font-size:0.95em;font-weight:600}
canvas{display:block;border-radius:10px;max-width:96vw;box-shadow:0 6px 30px rgba(0,0,0,0.15)}
</style>
</head>
<body>
<h1>🏔️ 滑雪大冒险</h1>
<div class="stats"><span>⛷️ <b id="score">0</b></span><span>🪙 <b id="coins_collected">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="560"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=560;
let player={x:W/2,y:H/2,w:24,h:36,speed:0,tilt:0},obstacles=[],coins=[],score=0,coinCount=0,best=0,gameover=false,frame=0,speedY=3;
try{best=parseInt(localStorage.getItem('ski_best'))||0;document.getElementById('best').textContent=best}catch(e){}

function spawnObstacle(){
  const w=20+Math.random()*25,h=w*1.3;
  obstacles.push({x:Math.random()*(W-w),y:-50,w,h,speed:speedY})
}
function spawnCoin(){coins.push({x:Math.random()*(W-20),y:-30,r:12,speed:speedY})}
function update(){
  if(gameover)return;frame++;speedY=3+score/300;
  if(frame%15===0)spawnObstacle();
  if(frame%25===0&&Math.random()<0.6)spawnCoin();
  score++;document.getElementById('score').textContent=score;
  player.y+=Math.sin(frame*0.02)*0.5;
  for(let i=obstacles.length-1;i>=0;i--){obstacles[i].y+=obstacles[i].speed;if(obstacles[i].y>H+50)obstacles.splice(i,1)}
  for(let i=coins.length-1;i>=0;i--){coins[i].y+=coins[i].speed;if(coins[i].y>H+30)coins.splice(i,1)}
  for(const o of obstacles){
    if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y)endGame();
  }
  for(let i=coins.length-1;i>=0;i--){
    const co=coins[i],dx=player.x+player.w/2-co.x,dy=player.y+player.h/2-co.y;
    if(Math.sqrt(dx*dx+dy*dy)<player.w/2+co.r){coinCount++;document.getElementById('coins_collected').textContent=coinCount;coins.splice(i,1)}
  }
}
function endGame(){
  gameover=true;
  if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('ski_best',best)}catch(e){}}
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
  ctx.fillText('💥 撞树了!',W/2,H/2-15);ctx.font='16px sans-serif';ctx.fillText(`滑了 ${score}m · 收集 ${coinCount}🪙  点击重来`,W/2,H/2+20);
}
function draw(){
  ctx.fillStyle='#f0f0f0';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  for(let y=(frame*speedY)%60;y<H;y+=60){ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let x=0;x<W;x+=8){for(let y=(frame*speedY/2)%16;y<H;y+=16){ctx.fillStyle='rgba(0,0,0,0.03)';ctx.fillRect(x,y,4,4)}}
  coins.forEach(co=>{ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(co.x,co.y,co.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(co.x-3,co.y-3,co.r*0.3,0,Math.PI*2);ctx.fill()});
  obstacles.forEach(o=>{ctx.fillStyle='#006400';ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y);ctx.lineTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();ctx.fillStyle='#8B4513';ctx.fillRect(o.x+o.w/2-3,o.y+o.h,6,8)});
  ctx.fillStyle='#1e90ff';ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,6);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(player.x+4,player.y+4,player.w-8,player.h*0.4);
  ctx.fillStyle='#2d5016';ctx.fillRect(player.x-4,player.y-2,player.w+8,6);
  ctx.fillStyle='#DEB887';ctx.fillRect(player.x+2,player.y-4,player.w/3,4);ctx.fillRect(player.x+player.w-player.w/3-2,player.y-4,player.w/3,4);
  ctx.fillStyle='#8B4513';ctx.fillRect(player.x+10,player.y-6,3,8);ctx.fillRect(player.x+player.w-13,player.y-6,3,8);
}
c.addEventListener('mousemove',e=>{const x=e.clientX-c.getBoundingClientRect().left;player.x=Math.max(5,Math.min(W-player.w-5,x-player.w/2))});
c.addEventListener('touchmove',e=>{e.preventDefault();const x=e.touches[0].clientX-c.getBoundingClientRect().left;player.x=Math.max(5,Math.min(W-player.w-5,x-player.w/2))},{passive:false});
c.addEventListener('click',()=>{if(gameover)restart()});
function restart(){player.x=W/2;obstacles=[];coins=[];score=0;coinCount=0;speedY=3;frame=0;gameover=false;document.getElementById('score').textContent='0';document.getElementById('coins_collected').textContent='0'}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>

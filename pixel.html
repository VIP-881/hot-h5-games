<body>
<h1>🎨 像素绘图</h1>
<div class="toolbar" id="toolbar"></div>
<div><button class="btn" onclick="clearGrid()">🗑️</button><button class="btn" onclick="fillGrid()">🪣</button><button class="btn" onclick="saveImg()">💾</button></div>
<canvas id="c" width="320" height="320"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),SIZE=16,N=20;
let grid=Array(N).fill().map(()=>Array(N).fill('#fff')),currentColor='#000',drawing=false;
const colors=['#000','#fff','#ff4757','#ffa502','#ffdd59','#2ed573','#1e90ff','#a55eea','#ff6b81','#e67e22','#00cec9','#8B4513','#808080','#FFD700','#ff69b4','#7bed9f'];
colors.forEach(cl=>{const b=document.createElement('div');b.className='color-btn'+(cl===currentColor?' active':'');b.style.background=cl;b.style.color=cl;b.addEventListener('click',()=>{currentColor=cl;document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.getElementById('toolbar').appendChild(b)});
function drawGrid(){ctx.fillStyle='#333';ctx.fillRect(0,0,SIZE*N,SIZE*N);for(let r=0;r<N;r++)for(let c=0;c<N;c++){ctx.fillStyle=grid[r][c];ctx.fillRect(c*SIZE+1,r*SIZE+1,SIZE-2,SIZE-2)}}
function paint(x,y){const col=Math.floor(x/SIZE),row=Math.floor(y/SIZE);if(row>=0&&row<N&&col>=0&&col<N){grid[row][col]=currentColor;drawGrid()}}
function erase(x,y){const col=Math.floor(x/SIZE),row=Math.floor(y/SIZE);if(row>=0&&row<N&&col>=0&&col<N){grid[row][col]='#fff';drawGrid()}}
c.addEventListener('mousedown',e=>{drawing=true;const r=c.getBoundingClientRect();e.button===2?erase(e.clientX-r.left,e.clientY-r.top):paint(e.clientX-r.left,e.clientY-r.top)});
c.addEventListener('mousemove',e=>{if(!drawing)return;const r=c.getBoundingClientRect();e.buttons===2?erase(e.clientX-r.left,e.clientY-r.top):paint(e.clientX-r.left,e.clientY-r.top)});
c.addEventListener('mouseup',()=>drawing=false);
c.addEventListener('contextmenu',e=>e.preventDefault());
c.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const r=c.getBoundingClientRect();paint(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top)});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const r=c.getBoundingClientRect();paint(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top)});
c.addEventListener('touchend',()=>drawing=false);
function clearGrid(){grid=Array(N).fill().map(()=>Array(N).fill('#fff'));drawGrid()}
function fillGrid(){grid=Array(N).fill().map(()=>Array(N).fill(currentColor));drawGrid()}
function saveImg(){const link=document.createElement('a');link.download='pixel-art.png';link.href=c.toDataURL();link.click()}
drawGrid();
</script>

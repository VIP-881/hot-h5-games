<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="description" content="经典街机弹球，免费在线H5游戏，无需下载，手机电脑都能玩">
<meta property="og:title" content="🧱 打砖块 - 经典街机弹球">
<meta property="og:description" content="经典街机弹球，25款热门H5小游戏合集">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hot-h5-games.netlify.app/breakout.html">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"经典街机弹球","description":"经典街机弹球，热门H5小游戏","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>

<title>🧱 打砖块</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
h1{font-size:1.8em;margin-bottom:4px}
.stats{display:flex;gap:16px;margin:6px 0}
.stats span{background:rgba(255,255,255,0.1);padding:5px 14px;border-radius:20px;font-size:0.95em}
canvas{border-radius:10px;box-shadow:0 4px 24px rgba(100,100,255,0.2);display:block;max-width:96vw}
</style>
</head>
<body>
<h1>🧱 打砖块</h1>
<div class="stats"><span>⭐ <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="520"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=520;
let paddle={w:70,h:12,x:W/2-35,y:H-30},ball={x:W/2,y:H-50,r:6,vx:3.5,vy:-3.5};
let bricks=[],score=0,lives=3,best=0,running=false;
const ROWS=7,COLS=8,BW=38,BH=16,BPAD=4,BTOP=50;
const colors=['#ff4757','#ff6b81','#ffa502','#2ed573','#1e90ff','#a55eea','#ffdd59'];
try{best=parseInt(localStorage.getItem('breakout_best'))||0;document.getElementById('best').textContent=best}catch(e){}

function initBricks(){
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    bricks.push({x:c*(BW+BPAD)+10,y:r*(BH+BPAD)+BTOP,w:BW,h:BH,color:colors[r%colors.length],alive:true});
  }
}
function reset(){
  paddle.x=W/2-35;ball={x:W/2,y:H-50,r:6,vx:3.5*(Math.random()>.5?1:-1),vy:-3.5};
  initBricks();score=0;lives=3;running=true;
  document.getElementById('score').textContent='0';document.getElementById('lives').textContent='3';
}
function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(b.x+2,b.y+1,b.w-4,3)}});
  ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=12;
  ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#ffdd59';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
}
function update(){
  if(!running)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-ball.r<=0||ball.x+ball.r>=W)ball.vx*=-1;
  if(ball.y-ball.r<=0)ball.vy*=-1;
  if(ball.y+ball.r>=H){lives--;document.getElementById('lives').textContent=lives;if(lives<=0)endGame();else{ball.x=W/2;ball.y=H-50;ball.vx=3.5*(Math.random()>.5?1:-1);ball.vy=-3.5;paddle.x=W/2-35}}
  if(ball.y+ball.r>=paddle.y&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
    const hitX=(ball.x-paddle.x)/paddle.w;
    ball.vy=-Math.abs(ball.vy);ball.vx=(hitX-0.5)*8;ball.y=paddle.y-ball.r;
  }
  for(let i=bricks.length-1;i>=0;i--){
    const b=bricks[i];
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.alive=false;ball.vy*=-1;score+=10;
      document.getElementById('score').textContent=score;
      if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('breakout_best',best)}catch(e){}}
      if(bricks.every(b=>!b.alive)){initBricks();ball.vy=Math.abs(ball.vy)}
    }
  }
}
function endGame(){
  running=false;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重新开始`,W/2,H/2+20);
}
c.addEventListener('mousemove',e=>{
  const x=e.clientX-c.getBoundingClientRect().left;
  paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
});
c.addEventListener('touchmove',e=>{e.preventDefault();
  const x=e.touches[0].clientX-c.getBoundingClientRect().left;
  paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
},{passive:false});
c.addEventListener('click',()=>{if(!running)reset()});
function loop(){update();draw();requestAnimationFrame(loop)}
reset();loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"经典数字合并游戏","description":"经典数字合并游戏，热门H5小游戏","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>

<title>2048</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #faf8ef; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; user-select:none; -webkit-user-select:none; }
.header { width:90vw; max-width:400px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.header h1 { font-size:3em; color:#776e65; }
.scores { display:flex; gap:8px; }
.score-box { background:#bbada0; color:#fff; border-radius:6px; padding:8px 16px; text-align:center; min-width:70px; }
.score-box .label { font-size:0.7em; text-transform:uppercase; opacity:0.7; }
.score-box .val { font-size:1.4em; font-weight:bold; }
.btn { background:#8f7a66; color:#fff; border:none; padding:10px 20px; border-radius:6px; font-size:1em; font-weight:bold; cursor:pointer; transition:background 0.2s; }
.btn:hover { background:#9f8b77; }
.grid-wrap { background:#bbada0; border-radius:8px; padding:8px; width:90vw; max-width:400px; aspect-ratio:1; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:8px; position:relative; touch-action:none; }
.tile { border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:1.8em; transition:all 0.12s ease; position:relative; }
.tile-0 { background:rgba(238,228,218,0.35); }
.tile-2 { background:#eee4da; color:#776e65; }
.tile-4 { background:#ede0c8; color:#776e65; }
.tile-8 { background:#f2b179; color:#f9f6f2; }
.tile-16 { background:#f59563; color:#f9f6f2; }
.tile-32 { background:#f67c5f; color:#f9f6f2; }
.tile-64 { background:#f65e3b; color:#f9f6f2; }
.tile-128 { background:#edcf72; color:#f9f6f2; font-size:1.6em; }
.tile-256 { background:#edcc61; color:#f9f6f2; font-size:1.6em; }
.tile-512 { background:#edc850; color:#f9f6f2; font-size:1.6em; }
.tile-1024 { background:#edc53f; color:#f9f6f2; font-size:1.3em; }
.tile-2048 { background:#edc22e; color:#f9f6f2; font-size:1.3em; }
.tile-super { background:#3c3a32; color:#f9f6f2; font-size:1.1em; }
.overlay { position:absolute; inset:0; background:rgba(238,228,218,0.73); display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; z-index:10; }
.overlay h2 { font-size:2.5em; color:#776e65; }
.overlay p { color:#776e65; margin:8px 0 16px; }
.hidden { display:none; }
</style>
</head>
<body>
<div class="header">
  <h1>2048</h1>
  <div class="scores">
    <div class="score-box"><div class="label">分数</div><div class="val" id="score">0</div></div>
    <div class="score-box"><div class="label">最高</div><div class="val" id="best">0</div></div>
  </div>
</div>
<button class="btn" onclick="restart()">🔄 新游戏</button>
<div class="grid-wrap" id="grid">
  <div class="overlay hidden" id="overlay">
    <h2 id="overlayTitle">Game Over!</h2>
    <p id="overlayScore"></p>
    <button class="btn" onclick="restart()">再来一局</button>
  </div>
</div>
<script>
let grid = Array(4).fill().map(()=>Array(4).fill(0));
let score = 0, best = 0;
let touchStartX, touchStartY;
const bestKey = 'game2048_best';
try { best = parseInt(localStorage.getItem(bestKey))||0; document.getElementById('best').textContent=best; } catch(e){}

function render() {
  document.getElementById('score').textContent = score;
  document.getElementById('grid').innerHTML = '';
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    const v = grid[r][c];
    const d = document.createElement('div');
    d.className = `tile tile-${v>2048?'super':v}`;
    d.textContent = v||'';
    document.getElementById('grid').appendChild(d);
  }
  const ov = document.getElementById('overlay');
  if(isGameOver()) {
    ov.classList.remove('hidden');
    document.getElementById('overlayScore').textContent = `得分: ${score}`;
    document.getElementById('grid').appendChild(ov);
  }
}

function addRandom() {
  const empty = [];
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!grid[r][c]) empty.push([r,c]);
  if(!empty.length) return;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random()<0.9?2:4;
}

function move(dir) {
  let moved = false;
  const old = grid.map(r=>[...r]);
  const merged = Array(4).fill().map(()=>Array(4).fill(false));
  const lines = [];
  for(let i=0;i<4;i++) {
    let line=[];
    for(let j=0;j<4;j++) {
      if(dir==='left') line.push(grid[i][j]);
      if(dir==='right') line.push(grid[i][3-j]);
      if(dir==='up') line.push(grid[j][i]);
      if(dir==='down') line.push(grid[3-j][i]);
    }
    line = line.filter(v=>v);
    const res=[];
    for(let k=0;k<line.length;k++) {
      if(k<line.length-1 && line[k]===line[k+1]) { res.push(line[k]*2); score+=line[k]*2; k++; }
      else res.push(line[k]);
    }
    while(res.length<4) res.push(0);
    for(let j=0;j<4;j++) {
      if(dir==='left') grid[i][j]=res[j];
      if(dir==='right') grid[i][3-j]=res[j];
      if(dir==='up') grid[j][i]=res[j];
      if(dir==='down') grid[3-j][i]=res[j];
    }
  }
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(grid[r][c]!==old[r][c]) moved=true;
  if(moved) addRandom();
  if(score>best) { best=score; document.getElementById('best').textContent=best; try{localStorage.setItem(bestKey,best)}catch(e){} }
  render();
}

function isGameOver() {
  for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
    if(!grid[r][c]) return false;
    if(r<3&&grid[r][c]===grid[r+1][c]) return false;
    if(c<3&&grid[r][c]===grid[r][c+1]) return false;
  }
  return true;
}

function restart() {
  grid = Array(4).fill().map(()=>Array(4).fill(0));
  score = 0;
  addRandom(); addRandom();
  render();
}

document.addEventListener('keydown',e=>{
  const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

const g = document.getElementById('grid');
g.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; },{passive:false});
g.addEventListener('touchend',e=>{
  if(!touchStartX) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const abs = Math.abs(dx)>Math.abs(dy);
  if(Math.abs(abs?dx:dy)<30) return;
  move(abs?(dx>0?'right':'left'):(dy>0?'down':'up'));
  touchStartX=null;
});

restart();
</script>
</body>
</html>

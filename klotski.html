<body>

<div class="arena">
<h1>🧊 华容道</h1>
<p class="info"><span>🏆 步数: <b id="moves">0</b></span><span>📐 关卡: <b id="lname">横刀立马</b></span></p>

<script>
// Level encoding: "横刀立马" style
// Board is 4 cols x 5 rows. Pieces: 0=empty, 1=小兵(1x1), 2=竖将(1x2), 3=横将(2x1), 4=曹操(2x2)
// Encoded as: [type, row, col, name]
const LEVELS = [
  {name:'横刀立马',pieces:[[4,1,1,'曹操'],[3,0,0,'关羽'],[2,0,3,'张飞'],[2,2,3,'赵云'],[2,0,1,'马超'],[2,2,1,'黄忠'],[1,1,0,'兵'],[1,3,0,'兵'],[1,1,3,'兵'],[1,3,3,'兵']],exit:[3,1]},
  {name:'指挥若定',pieces:[[4,1,0,'曹操'],[3,1,2,'关羽'],[2,0,0,'张飞'],[2,0,1,'赵云'],[2,3,1,'马超'],[2,0,3,'黄忠'],[1,3,0,'兵'],[1,3,3,'兵'],[1,2,2,'兵'],[1,2,3,'兵']],exit:[3,1]},
  {name:'兵分三路',pieces:[[4,1,1,'曹操'],[3,1,0,'关羽'],[2,0,2,'张飞'],[2,2,2,'赵云'],[2,0,1,'马超'],[2,2,1,'黄忠'],[1,3,0,'兵'],[1,3,3,'兵'],[1,0,3,'兵'],[1,4,3,'兵']],exit:[3,1]},
  {name:'将拥曹营',pieces:[[4,1,1,'曹操'],[3,1,3,'关羽'],[2,0,3,'张飞'],[2,2,3,'赵云'],[2,0,0,'马超'],[2,2,0,'黄忠'],[1,3,1,'兵'],[1,4,1,'兵'],[1,0,2,'兵'],[1,4,2,'兵']],exit:[3,1]},
  {name:'屯兵东路',pieces:[[4,1,2,'曹操'],[3,0,0,'关羽'],[2,0,2,'张飞'],[2,2,2,'赵云'],[2,2,0,'马超'],[2,4,0,'黄忠'],[1,0,1,'兵'],[1,3,1,'兵'],[1,3,3,'兵'],[1,4,3,'兵']],exit:[3,1]},
];

let board=[], moves=0, history=[], lvl=0, cellW=0, cellH=0;

function init(){
  let data=LEVELS[lvl];
  // Create empty 4x5 grid
  board = Array.from({length:5},()=>Array(4).fill(0));
  document.getElementById('lname').textContent=data.name;
  document.getElementById('moves').textContent='0';
  document.getElementById('msg').textContent='';
  moves=0; history=[];
  
  // Place pieces
  let id=1;
  data.pieces.forEach(p=>{
    let [type,row,col,name]=p;
    for(let r=row;r<row+(type===2||type===4?2:1);r++)
      for(let c=col;c<col+(type===3||type===4?2:1);c++)
        board[r][c]=id;
    p.push(id++);
  });
  render();
  renderLevels();
}

function render(){
  let b=document.getElementById('board');
  let bw=300,bh=375; cellW=bw/4; cellH=bh/5;
  let seen=new Set();
  let html='';
  LEVELS[lvl].pieces.forEach(p=>{
    let [type,row,col,name,id]=p;
    if(seen.has(id)) return; seen.add(id);
    let w=(type===3||type===4)?cellW*2-4:cellW-4;
    let h=(type===2||type===4)?cellH*2-4:cellH-4;
    let cls='piece '+(type===4?'cao':type===2||type===3?'gen':'p');
    html+=`<div class="${cls}" style="left:${col*cellW+2}px;top:${row*cellH+2}px;width:${w}px;height:${h}px;line-height:${h}px" 
      ontouchstart="dragStart(event,${id})" onmousedown="dragStart(event,${id})"
      id="p${id}">${name}</div>`;
  });
  html+=`<div style="position:absolute;right:0;top:${3*cellH}px;width:${cellW}px;height:${cellH}px;border:2px dashed #4ade80;border-radius:0 0 8px 0;opacity:.3"></div>`;
  b.innerHTML=html;
}

function findPiece(id){
  for(let r=0;r<5;r++) for(let c=0;c<4;c++) if(board[r][c]===id) return {r,c,id};
  return null;
}

function getPieceSize(id){
  let p=LEVELS[lvl].pieces.find(x=>x[4]===id);
  if(!p) return [1,1];
  let t=p[0];
  return [t===2||t===4?2:1, t===3||t===4?2:1];
}

let dragInfo=null;
function dragStart(e,id){
  e.preventDefault();
  let pos=findPiece(id);
  if(!pos) return;
  let [h,w]=getPieceSize(id);
  dragInfo={id,r:pos.r,c:pos.c,h,w};
  
  let startX=e.touches?e.touches[0].clientX:e.clientX;
  let startY=e.touches?e.touches[0].clientY:e.clientY;
  let moved=false;

  function onMove(ev){
    ev.preventDefault();
    let dx=(ev.touches?ev.touches[0].clientX:ev.clientX)-startX;
    let dy=(ev.touches?ev.touches[0].clientY:ev.clientY)-startY;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<10) return;
    moved=true;
    
    // Determine direction
    let dir='';
    if(Math.abs(dx)>Math.abs(dy)) dir=dx>0?'right':'left';
    else dir=dy>0?'down':'up';
    
    // Try move
    let nr=dragInfo.r, nc=dragInfo.c;
    if(dir==='up') nr--;
    else if(dir==='down') nr++;
    else if(dir==='left') nc--;
    else if(dir==='right') nc++;
    
    if(canMove(dragInfo.id,dragInfo.r,dragInfo.c,nr,nc,dragInfo.h,dragInfo.w)){
      movePiece(dragInfo.id,dragInfo.r,dragInfo.c,nr,nc,dragInfo.h,dragInfo.w);
      dragInfo.r=nr; dragInfo.c=nc;
      startX=ev.touches?ev.touches[0].clientX:ev.clientX;
      startY=ev.touches?ev.touches[0].clientY:ev.clientY;
    }
  }
  
  function onEnd(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onEnd);
    dragInfo=null;
  }
  
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onEnd);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd);
}

function movePiece(id,sr,sc,nr,nc,h,w){
  // Save state
  let saved=board.map(r=>[...r]);
  // Clear old pos
  for(let r=sr;r<sr+h;r++) for(let c=sc;c<sc+w;c++) board[r][c]=0;
  // Set new pos
  for(let r=nr;r<nr+h;r++) for(let c=nc;c<nc+w;c++) board[r][c]=id;
  
  history.push({board:saved,moves:moves});
  moves++;
  document.getElementById('moves').textContent=moves;
  
  // Update piece position in levels data
  let p=LEVELS[lvl].pieces.find(x=>x[4]===id);
  if(p){p[1]=nr; p[2]=nc;}
  
  render();
  
  // Check win: 曹操 (id 1) at exit
  let cao=LEVELS[lvl].pieces.find(x=>x[4]===1);
  if(cao&&cao[1]===3&&cao[2]===1){
    document.getElementById('msg').textContent='🎉 曹操逃出！通关！';
    localStorage.setItem('klotski_done_'+lvl,'1');
    renderLevels();
  }
}

function canMove(id,sr,sc,nr,nc,h,w){
  if(nr<0||nc<0||nr+h>5||nc+w>4) return false;
  for(let r=nr;r<nr+h;r++)
    for(let c=nc;c<nc+w;c++)
      if(board[r][c]!==0&&board[r][c]!==id) return false;
  return true;
}

function undo(){
  if(history.length===0) return;
  let h=history.pop();
  board=h.board;
  moves=h.moves;
  document.getElementById('moves').textContent=moves;
  document.getElementById('msg').textContent='';
  render();
}

function resetLevel(){
  let pcs=LEVELS[lvl].pieces;
  pcs.forEach(p=>{let [t,r,c,n,id]=p; p[1]=p[5]||r; p[2]=p[6]||c;});
  init();
}

function setLevel(i){
  lvl=i;
  init();
  document.getElementById('msg').textContent='';
}

function renderLevels(){
  let l=document.getElementById('levels');
  l.innerHTML=LEVELS.map((lv,i)=>`<button class="lvl ${i===lvl?'cur':''} ${localStorage.getItem('klotski_done_'+i)?'done':''}" onclick="setLevel(${i})">${lv.name}</button>`).join('');
}

// Store original positions for reset
LEVELS.forEach(lv=>lv.pieces.forEach(p=>{p[5]=p[1];p[6]=p[2];}));
init();
</script>

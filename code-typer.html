<body>

<header>
  <h1>⌨️ 代码打字竞速</h1>
  <p>用 GitHub 热门代码片段练打字 · 多语言 · 实时 WPM</p>
</header>
<div class="game-container">
  <div class="code-editor">
    <div class="editor-header">
      <div style="display:flex;gap:6px">
        <button class="btn-lang active" onclick="setLang('js')">JS</button>
        <button class="btn-lang" onclick="setLang('py')">Python</button>
        <button class="btn-lang" onclick="setLang('go')">Go</button>
        <button class="btn-lang" onclick="setLang('rs')">Rust</button>
      </div>
      <div class="stats-row">
        <div class="stat-badge wpm"><div class="val" id="sWPM">0</div><div class="lbl">WPM</div></div>
        <div class="stat-badge acc"><div class="val" id="sACC">100%</div><div class="lbl">准确率</div></div>
        <div class="stat-badge time"><div class="val" id="sTIME">0s</div><div class="lbl">用时</div></div>
        <div class="stat-badge combo"><div class="val" id="sCOMBO">x1</div><div class="lbl">连击</div></div>
      </div>
    </div>
    <div class="code-display" id="codeDisplay"></div>
    <div class="input-area">
      <input type="text" id="codeInput" placeholder="点击开始，输入代码..." disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="result-bar" id="resultBar">按 Enter 或点击开始 开始挑战</div>
  </div>
  <div class="btn-row">
    <button class="btn-start" id="startBtn" onclick="startGame()">▶ 开始</button>
  </div>
</div>
<div class="history-panel">
  <h3>📜 最近记录</h3>
  <div id="history"><div style="color:#444;font-size:12px;padding:12px">暂无记录</div></div>
</div>

<script>
const SNIPPETS={
  js:[
    'const fibonacci = n => n <= 1 ? n : fibonacci(n-1) + fibonacci(n-2);',
    'const sorted = arr.sort((a, b) => a - b);',
    'const fetchData = async (url) => { const res = await fetch(url); return res.json(); };',
    'const memoize = (fn) => { const cache = {}; return (...args) => { const key = JSON.stringify(args); return cache[key] ??= fn(...args); }; };',
    'const debounce = (fn, ms) => { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); }; };',
    'const groupBy = (arr, key) => arr.reduce((acc, item) => { (acc[item[key]] ??= []).push(item); return acc; }, {});',
  ],
  py:[
    'def quicksort(arr): return arr if len(arr) <= 1 else quicksort([x for x in arr[1:] if x < arr[0]]) + [arr[0]] + quicksort([x for x in arr[1:] if x >= arr[0]])',
    'from collections import defaultdict; counts = defaultdict(int)',
    'with open("data.json", "r") as f: data = json.load(f)',
    'result = [x * 2 for x in range(10) if x % 2 == 0]',
    'async def fetch_data(url): async with aiohttp.ClientSession() as session: async with session.get(url) as resp: return await resp.json()',
    'def singleton(cls): instances = {}; def wrapper(*a, **k): return instances.setdefault(cls, cls(*a, **k)); return wrapper',
  ],
  go:[
    'func fibonacci(n int) int { if n <= 1 { return n }; return fibonacci(n-1) + fibonacci(n-2) }',
    'ch := make(chan string, 10); go func() { ch <- "hello" }(); msg := <-ch',
    'type Server struct { host string; port int; mu sync.RWMutex }',
    'defer file.Close(); scanner := bufio.NewScanner(file)',
    'var wg sync.WaitGroup; wg.Add(1); go func() { defer wg.Done(); process() }(); wg.Wait()',
  ],
  rs:[
    'let result: Vec<i32> = numbers.iter().map(|x| x * 2).filter(|x| x > &10).collect();',
    'impl<T: Display> Summary for T { fn summarize(&self) -> String { format!("{}", self) } }',
    'match result { Ok(val) => println!("{}", val), Err(e) => eprintln!("Error: {}", e), }',
    'async fn fetch(url: &str) -> Result<String, reqwest::Error> { reqwest::get(url).await?.text().await }',
  ]
};
let currentLang='js',snippet='',pos=0,started=false,startTime=0,timer=null,errors=0,combo=0,maxCombo=0;
let history=JSON.parse(localStorage.getItem('typer_history')||'[]');
let totalChars=0;

function setLang(l){currentLang=l;document.querySelectorAll('.btn-lang').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');resetGame()}

function resetGame(){
  clearInterval(timer);started=false;pos=0;errors=0;combo=0;maxCombo=0;totalChars=0;
  const snips=SNIPPETS[currentLang];
  snippet=snips[Math.floor(Math.random()*snips.length)];
  document.getElementById('codeInput').value='';document.getElementById('codeInput').disabled=true;
  document.getElementById('sWPM').textContent='0';document.getElementById('sACC').textContent='100%';
  document.getElementById('sTIME').textContent='0s';document.getElementById('sCOMBO').textContent='x1';
  document.getElementById('resultBar').textContent='按 Enter 或点击开始 开始挑战';
  document.getElementById('startBtn').textContent='▶ 开始';
  renderCode();
}

function renderCode(){
  let html='';
  for(let i=0;i<snippet.length;i++){
    if(i<pos) html+='<span class="typed">'+esc(snippet[i])+'</span>';
    else if(i===pos&&started) html+='<span class="current">'+esc(snippet[i])+'</span>';
    else html+='<span class="untyped">'+esc(snippet[i])+'</span>';
  }
  document.getElementById('codeDisplay').innerHTML=html;
}

function esc(c){return c===' '?'&nbsp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c}

function startGame(){
  resetGame();
  document.getElementById('codeInput').disabled=false;
  document.getElementById('codeInput').focus();
  started=true;startTime=Date.now();errors=0;combo=0;maxCombo=0;
  document.getElementById('startBtn').textContent='🔄 重新开始';
  renderCode();
  timer=setInterval(updateStats,100);
}

function updateStats(){
  const elapsed=(Date.now()-startTime)/1000;
  document.getElementById('sTIME').textContent=Math.floor(elapsed)+'s';
  const words=pos/5;
  const wpm=elapsed>0?Math.round(words/(elapsed/60)):0;
  document.getElementById('sWPM').textContent=wpm;
  const acc=pos>0?Math.round((pos-errors)/pos*100):100;
  document.getElementById('sACC').textContent=acc+'%';
  document.getElementById('sCOMBO').textContent='x'+(combo+1);
}

document.getElementById('codeInput').addEventListener('input',function(e){
  if(!started) return;
  const typed=e.target.value;
  if(typed.length>0&&typed[typed.length-1]===snippet[pos]){
    pos++;combo++;if(combo>maxCombo)maxCombo=combo;
    e.target.value='';
    renderCode();updateStats();
    if(pos>=snippet.length) finishGame();
  }else if(typed.length>0){
    errors++;combo=0;
    document.getElementById('codeDisplay').innerHTML+='<span class="error">'+esc(typed[typed.length-1])+'</span>';
    e.target.value='';
    updateStats();
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!started)startGame()});

function finishGame(){
  clearInterval(timer);started=false;
  const elapsed=((Date.now()-startTime)/1000).toFixed(1);
  const wpm=Math.round((pos/5)/(elapsed/60));
  const acc=Math.round((pos-errors)/pos*100);
  document.getElementById('resultBar').innerHTML='<span style="color:#4ade80">✅ 完成！</span> '+wpm+' WPM · '+acc+'% 准确率 · '+elapsed+'s';
  document.getElementById('codeInput').disabled=true;
  document.getElementById('sCOMBO').textContent='🔥 x'+(maxCombo+1);
  history.unshift({lang:currentLang,wpm,acc,time:parseFloat(elapsed),date:new Date().toISOString()});
  history=history.slice(0,20);
  localStorage.setItem('typer_history',JSON.stringify(history));
  renderHistory();
}

function renderHistory(){
  const langs={js:'JS',py:'Python',go:'Go',rs:'Rust'};
  document.getElementById('history').innerHTML=history.length?history.map(h=>'<div class="history-item"><span class="lang">'+langs[h.lang]+'</span><span class="stats">'+h.wpm+' WPM · '+h.acc+'% · '+h.time+'s</span><span class="wpm-val">🏆 '+h.wpm+'</span></div>').join(''):'<div style="color:#444;font-size:12px;padding:12px">暂无记录</div>';
}

resetGame();renderHistory();
</script>
</body>

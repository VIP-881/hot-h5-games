<h1>🕳️ 黑洞吞噬</h1>
<div class="stats"><span>⚫ <b id="size">1</b></span><span>⭐ <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="380" height="520"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=380,H=520;
let hole={x:W/2,y:H/2,r:30},items=[],score=0,best=0,size=1,frame=0;
try{best=parseInt(localStorage.getItem('hole_best'))||0;document.getElementById('best').textContent=best}catch(e){}
const ICONS=['🏠','🚗','🌲','👤','🪑','📦','⚽','🐕','🍕','🚲','📺','🎸'];
function spawn(){const i=ICONS[Math.floor(Math.random()*ICONS.length)];items.push({x:Math.random()*W,y:Math.random()*H,icon:i,size:14+Math.random()*20,speed:0.3+Math.random()})}
function update(){frame++;
  if(frame%20===0&&items.length<15)spawn();
  items.forEach(it=>{const dx=hole.x-it.x,dy=hole.y-it.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<hole.r+150){const force=(hole.r+150-dist)/(hole.r+150);it.x+=dx/dist*force*4;it.y+=dy/dist*force*4}
    if(dist<hole.r){score+=Math.floor(it.size);document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('hole_best',best)}catch(e)}items.splice(items.indexOf(it),1);hole.r+=it.size*0.08;size=Math.floor(hole.r/30);document.getElementById('size').textContent=size}
  });
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.3})`;ctx.fillRect(Math.random()*W,Math.random()*H,2,2)}
  items.forEach(it=>{ctx.font=`${it.size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=it.dist<hole.r?'#fff':'#999';ctx.fillText(it.icon,it.x,it.y)});
  const g=ctx.createRadialGradient(hole.x,hole.y,hole.r*0.3,hole.x,hole.y,hole.r);
  g.addColorStop(0,'#000');g.addColorStop(0.6,'#1a0020');g.addColorStop(0.9,'#4a0070');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r+20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#8e44ad';ctx.lineWidth=3;ctx.shadowColor='#8e44ad';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();hole.x=e.clientX-r.left;hole.y=e.clientY-r.top});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();hole.x=e.touches[0].clientX-r.left;hole.y=e.touches[0].clientY-r.top},{passive:false});
for(let i=0;i<12;i++)spawn();
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>

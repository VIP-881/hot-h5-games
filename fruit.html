<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"水果忍者风格","description":"水果忍者风格，热门H5小游戏","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>

<title>🎮 Fruit - 灵犀游戏大厅 | 免费H5在线小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#0a1628,#1a2a48);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;overflow:hidden}
h1{font-size:1.8em;margin-bottom:2px;color:#ff6347}
.stats{display:flex;gap:16px;margin:4px 0}
.stats span{background:rgba(255,255,255,0.12);padding:4px 12px;border-radius:20px;font-size:0.95em}
canvas{border-radius:10px;display:block;max-width:98vw;max-height:80vh;touch-action:none}
</style>
<link rel="canonical" href="https://VIP-881.github.io/hot-h5-games/fruit.html">
<meta property="og:image" content="https://vip-881.github.io/hot-h5-games/og-image.png">
<meta name="twitter:image" content="https://vip-881.github.io/hot-h5-games/og-image.png">
</head>
<body>
<h1>🔪 切水果</h1>
<div class="stats"><span>⭐ <b id="score">0</b></span><span>💣 <b id="misses">0</b>/3</span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="600"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=600;
let fruits=[],trail=[],score=0,misses=0,best=0,running=true,lastTrail=[];
try{best=parseInt(localStorage.getItem('fruit_best'))||0;document.getElementById('best').textContent=best}catch(e){}

const FRUIT_TYPES=[
  {emoji:'🍎',color:'#ff4757',points:1,radius:22},
  {emoji:'🍊',color:'#ffa502',points:1,radius:20},
  {emoji:'🍋',color:'#ffdd59',points:1,radius:18},
  {emoji:'🍉',color:'#2ed573',points:3,radius:28},
  {emoji:'🍇',color:'#a55eea',points:1,radius:16},
  {emoji:'🍑',color:'#ff6b81',points:1,radius:20},
  {emoji:'🥝',color:'#7bed9f',points:2,radius:22},
  {emoji:'💣',color:'#333',points:-99,radius:20,isBomb:true},
];
function spawnFruit(){
  const type=FRUIT_TYPES[Math.random()<0.12?7:Math.floor(Math.random()*7)];
  const x=30+Math.random()*(W-60),angle=-Math.PI/4-Math.random()*Math.PI/2;
  const speed=6+Math.random()*6;
  fruits.push({
    x,y:type.isBomb?H+30:H+40,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
    r:type.radius,type,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.15,
    gravity:0.15+Math.random()*0.1
  });
}
function reset(){
  fruits=[];trail=[];score=0;misses=0;running=true;
  document.getElementById('score').textContent='0';document.getElementById('misses').textContent='0';
}
let sx,sy;
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  sx=e.touches[0].clientX-c.getBoundingClientRect().left;
  sy=e.touches[0].clientY-c.getBoundingClientRect().top;
  lastTrail=[{x:sx,y:sy}];
});
c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const x=e.touches[0].clientX-c.getBoundingClientRect().left;
  const y=e.touches[0].clientY-c.getBoundingClientRect().top;
  trail.push({x,y,life:10});lastTrail.push({x,y});
  if(lastTrail.length>3)lastTrail.shift();
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    const dx=x-f.x,dy=y-f.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<f.r+8){
      if(f.type.isBomb){misses=3;endGame();return}
      score+=f.type.points;
      document.getElementById('score').textContent=score;
      if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('fruit_best',best)}catch(e){}}
      fruits.splice(i,1);
    }
  }
});
c.addEventListener('mousedown',e=>{
  const rect=c.getBoundingClientRect();
  sx=e.clientX-rect.left;sy=e.clientY-rect.top;
  lastTrail=[{x:sx,y:sy}];
});
c.addEventListener('mousemove',e=>{
  if(e.buttons!==1)return;
  const rect=c.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  trail.push({x,y,life:10});lastTrail.push({x,y});
  if(lastTrail.length>3)lastTrail.shift();
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    const dx=x-f.x,dy=y-f.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<f.r+8){
      if(f.type.isBomb){misses=3;endGame();return}
      score+=f.type.points;
      document.getElementById('score').textContent=score;
      if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('fruit_best',best)}catch(e){}}
      fruits.splice(i,1);
    }
  }
});
let frame=0;
function update(){
  if(!running)return;
  frame++;
  if(frame%20===0)spawnFruit();
  for(let i=trail.length-1;i>=0;i--){trail[i].life--;if(trail[i].life<=0)trail.splice(i,1)}
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    f.x+=f.vx;f.y+=f.vy;f.vy+=f.gravity;f.rot+=f.rotV;
    if(f.y>H+f.r*2&&!f.type.isBomb){misses++;document.getElementById('misses').textContent=misses;fruits.splice(i,1);if(misses>=3)endGame()}
    else if(f.y>H+f.r*2)fruits.splice(i,1);
  }
}
function endGame(){
  running=false;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
  ctx.fillText('GAME OVER',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重新开始`,W/2,H/2+20);
}
function draw(){
  ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);
  for(let i=1;i<lastTrail.length;i++){
    ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(lastTrail[i-1].x,lastTrail[i-1].y);ctx.lineTo(lastTrail[i].x,lastTrail[i].y);ctx.stroke();
  }
  trail.forEach(t=>{
    ctx.fillStyle=`rgba(255,255,255,${t.life/10})`;
    ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);ctx.fill();
  });
  fruits.forEach(f=>{
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
    ctx.font=`${f.r*1.6}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.type.emoji,0,0);ctx.restore();
    if(f.type.isBomb){
      ctx.strokeStyle='#ff4757';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r+4,0,Math.PI*2);ctx.stroke();
    }
  });
}
c.addEventListener('click',()=>{if(!running)reset()});
function loop(){update();draw();requestAnimationFrame(loop)}
reset();loop();
</script>
</body>
</html>

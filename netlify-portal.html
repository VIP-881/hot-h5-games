<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚀 Netlify 部署传送门</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0f0;min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:rgba(15,15,26,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(139,92,246,.2);padding:8px 12px;display:flex;align-items:center;gap:8px}
nav a{color:#a78bfa;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:12px;background:rgba(139,92,246,.1);transition:.3s}
nav a:hover{background:rgba(139,92,246,.2)}
header{text-align:center;padding:20px;background:linear-gradient(180deg,rgba(6,182,212,.06),transparent)}
header h1{font-size:1.6em;background:linear-gradient(135deg,#06b6d4,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.portal-stage{max-width:600px;margin:20px auto;padding:0 16px;text-align:center}
.portal-ring{width:200px;height:200px;border-radius:50%;border:4px solid transparent;border-top-color:#06b6d4;border-right-color:#8b5cf6;margin:20px auto;animation:spin 3s linear infinite;display:flex;align-items:center;justify-content:center;position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.portal-ring.deploying{animation:spin .5s linear infinite;border-top-color:#fbbf24;border-right-color:#ef4444}
.portal-ring.success{animation:spin 0s;border:4px solid #4ade80;box-shadow:0 0 40px rgba(34,197,94,.4)}
.portal-core{font-size:60px;animation:spin 3s linear infinite reverse}
.stats-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:16px 0}
.stat-box{background:rgba(20,20,35,.9);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 20px;text-align:center;min-width:100px}
.stat-box .val{font-size:24px;font-weight:700}
.stat-box .lbl{font-size:10px;color:#888;margin-top:2px}
.deploy-log{max-width:600px;margin:16px auto;padding:0 16px}
.log-entry{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(20,20,35,.9);border-radius:8px;margin:4px 0;font-size:12px;border-left:3px solid}
.log-entry.staging{border-color:#fbbf24}
.log-entry.building{border-color:#a78bfa}
.log-entry.deploying{border-color:#06b6d4}
.log-entry.success{border-color:#4ade80}
.log-entry.fail{border-color:#ef4444}
.btn-row{text-align:center;margin:16px}
.btn-row button{padding:12px 28px;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;transition:.3s;margin:4px}
.btn-deploy{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff}
.btn-deploy:hover{box-shadow:0 4px 20px rgba(6,182,212,.5)}
.btn-sync{background:rgba(139,92,246,.15);color:#a78bfa}
.deploy-effect{position:fixed;pointer-events:none;z-index:300}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:particleBurst 1.5s ease-out forwards}
@keyframes particleBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
footer{text-align:center;padding:16px;color:#555;font-size:11px}
</style>
</head>
<body>
<nav><a href="index.html">← 大厅</a><span>🚀 Netlify 传送门</span></nav>
<header><h1>🚀 Netlify 部署传送门</h1><p>每次部署打开一个传送门 · 构建时间越短分数越高</p></header>
<div class="portal-stage">
  <div class="portal-ring" id="portal">
    <div class="portal-core">🌀</div>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="val" id="deployCount" style="color:#06b6d4">0</div><div class="lbl">🚀 部署次数</div></div>
    <div class="stat-box"><div class="val" id="bestTime" style="color:#4ade80">-</div><div class="lbl">⚡ 最快构建</div></div>
    <div class="stat-box"><div class="val" id="score" style="color:#fbbf24">0</div><div class="lbl">🏆 总分</div></div>
    <div class="stat-box"><div class="val" id="sites" style="color:#a78bfa">-</div><div class="lbl">🌐 站点</div></div>
  </div>
  <div class="btn-row">
    <button class="btn-deploy" onclick="deploy()">🌌 开启传送门！</button>
    <button class="btn-sync" onclick="init()">🔄 同步 Netlify</button>
  </div>
</div>
<div class="deploy-log">
  <h3 style="font-size:13px;color:#888;margin-bottom:8px">📜 部署日志</h3>
  <div id="log"><div style="color:#666;font-size:12px;padding:12px">同步中...</div></div>
</div>
<footer>Powered by Maton.ai · Netlify · 🦊 灵犀出品</footer>
<script>
const AK='v2.xOedfPfv9hou9ht8BXTbk7OKPlRUUvh5WuyJNC8Q3mLrU5dQVGL5rARouO2DNnC-IKG0UGeYm79Cfw1aIjsOw48Fram7uaVouZHiYKGTZzMBg4SuQLJLz4gY';
let stats=JSON.parse(localStorage.getItem('netlify_stats')||'{"deploys":0,"bestTime":null,"score":0,"history":[],"sites":0}');

async function api(url){const r=await fetch('https://gateway.maton.ai'+url,{headers:{'Authorization':'Bearer '+AK}});return r.json()}

async function init(){
  try{
    const sites=await api('/netlify/api/v1/sites');
    stats.sites=(sites||[]).length;
    document.getElementById('sites').textContent=stats.sites;
    document.getElementById('deployCount').textContent=stats.deploys;
    document.getElementById('bestTime').textContent=stats.bestTime?stats.bestTime+'s':'--';
    document.getElementById('score').textContent=stats.score;
    renderLog();
    addLog('success','✅ Netlify 已连接 · '+stats.sites+' 个站点在线');
  }catch(e){
    document.getElementById('log').innerHTML='<div style="color:#666;padding:12px">Netlify 连接中...使用模拟模式</div>';
    document.getElementById('sites').textContent='?';
  }
  updateUI();
}

function deploy(){
  const portal=document.getElementById('portal');
  portal.classList.add('deploying');
  const stages=['staging','building','deploying'];
  let i=0;
  const interval=setInterval(()=>{
    addLog(stages[i%3],['⬆️ 正在上传构建产物...','⚙️ 正在编译资源...','🌐 正在部署到 CDN...'][i%3]);
    i++;
    if(i>=6){clearInterval(interval);finishDeploy()}
  },600+Math.random()*400);
}

function finishDeploy(){
  const portal=document.getElementById('portal');
  portal.classList.remove('deploying');
  portal.classList.add('success');
  const buildTime=Math.floor(Math.random()*30)+5;
  stats.deploys++;
  stats.score+=Math.max(0,100-buildTime*3);
  if(!stats.bestTime||buildTime<stats.bestTime)stats.bestTime=buildTime;
  stats.history.unshift({time:buildTime,ts:Date.now()});
  if(stats.history.length>20)stats.history.pop();
  localStorage.setItem('netlify_stats',JSON.stringify(stats));
  updateUI();
  addLog('success','🎉 部署成功！构建时间: '+buildTime+'s · +'+(100-buildTime*3)+' 分');
  burstParticles();
  setTimeout(()=>portal.classList.remove('success'),2000);
}

function burstParticles(){
  const colors=['#06b6d4','#8b5cf6','#fbbf24','#4ade80','#ef4444'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.cssText='left:50vw;top:40vh;background:'+colors[i%5]+';--tx:'+(Math.random()*300-150)+'px;--ty:'+(Math.random()*300-150)+'px';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1500);
  }
}

function addLog(type,msg){
  const l=document.getElementById('log');
  l.innerHTML='<div class="log-entry '+type+'"><span>'+(type==='staging'?'🟡':type==='building'?'🟣':type==='deploying'?'🔵':type==='success'?'🟢':'🔴')+'</span> '+msg+'</div>'+l.innerHTML;
  if(l.children.length>30)l.removeChild(l.lastChild);
}

function updateUI(){
  document.getElementById('deployCount').textContent=stats.deploys;
  document.getElementById('bestTime').textContent=stats.bestTime?stats.bestTime+'s':'--';
  document.getElementById('score').textContent=stats.score;
  document.getElementById('sites').textContent=stats.sites||'?';
}

function renderLog(){
  stats.history.forEach(h=>addLog('success','部署完成: '+h.time+'s'));
}

init();
</script>
</body>
</html>

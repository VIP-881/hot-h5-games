<body>
<h1>🎪 套圈大挑战</h1>
<div class="stats"><span>🎯 <b id="score">0</b></span><span>⭕ <b id="rings">10</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="380" height="450"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=380,H=450;
let targets=[],rings=[],ring={x:W/2,y:H-40,r:16,active:true},score=0,rCount=10,best=0,aimAngle=-Math.PI/2,power=0,aiming=false,shot=false,pStart=0;
try{best=parseInt(localStorage.getItem('ringtoss_best'))||0;document.getElementById('best').textContent=best}catch(e){}

const ITEMS=['🧸','🎁','🏆','💎','🎀','⭐','🍭','🎈'];
function spawnTargets(){
  targets=[];
  const positions=[[W/2-80,120],[W/2+80,120],[W/2,80],[W/2-140,200],[W/2+140,200],[W/2-60,180],[W/2+60,180]];
  positions.forEach(([x,y],i)=>{
    const s=18+i*2;
    targets.push({x,y,r:s,item:ITEMS[i],points:(8-i)*15+10,hit:false,glow:0});
  });
}
function resetRing(){ring={x:W/2,y:H-40,r:16,active:true,vx:0,vy:0};shot=false;rCount--;document.getElementById('rings').textContent=Math.max(0,rCount);if(rCount<=0)endGame()}
function shoot(p,angle){if(shot||!ring.active)return;ring.vx=Math.cos(angle)*p*0.13;ring.vy=Math.sin(angle)*p*0.13;shot=true}
function update(){
  if(!shot||!ring.active)return;
  ring.x+=ring.vx;ring.y+=ring.vy;ring.vy+=0.12;
  if(ring.y>H+30){resetRing();return}
  for(const t of targets){
    if(t.hit)continue;
    const dx=ring.x-t.x,dy=ring.y-t.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<t.r&&ring.y>t.y-t.r){t.hit=true;t.glow=1;score+=t.points;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('ringtoss_best',best)}catch(e){}}resetRing();return}
  }
}
function endGame(){
  ring.active=false;shot=true;
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
  ctx.fillText('🎪 游戏结束!',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重新开始`,W/2,H/2+20);
}
function draw(){
  ctx.fillStyle='#e17055';ctx.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){ctx.fillStyle=`rgba(255,255,255,${0.03+Math.random()*0.03})`;ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,5+Math.random()*15,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(20,H-20,W-40,4);
  ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
  targets.forEach(t=>{
    if(t.hit){ctx.fillStyle=`rgba(0,0,0,${t.glow})`;t.glow*=0.95;ctx.beginPath();ctx.arc(t.x,t.y,t.r+4,0,Math.PI*2);ctx.fill()}
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.roundRect(t.x-20,t.y-60,40,50,6);ctx.fill();
    ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(t.points,t.x,t.y-18);
    ctx.font=`${t.r*1.5}px sans-serif`;ctx.fillText(t.item,t.x,t.y-32);
    if(!t.hit){
      ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y-22,t.r,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#8B4513';ctx.beginPath();ctx.arc(t.x,t.y-22,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#A0522D';ctx.fillRect(t.x-1,t.y-30,2,10);
    }
  });
  if(ring.active){
    ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ring.x,ring.y,ring.r,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(255,215,0,0.3)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ring.x,ring.y,ring.r+3,0,Math.PI*2);ctx.stroke();
    if(aiming&&!shot){
      const ex=ring.x+Math.cos(aimAngle)*power*0.4,ey=ring.y+Math.sin(aimAngle)*power*0.4;
      ctx.strokeStyle=`rgba(255,255,255,${power/100})`;ctx.lineWidth=2;ctx.setLineDash([3,5]);
      ctx.beginPath();ctx.moveTo(ring.x,ring.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
    }
  }
}
c.addEventListener('mousedown',e=>{if(shot||!ring.active)return;aiming=true;pStart=Date.now();const r=c.getBoundingClientRect();aimAngle=Math.atan2((e.clientY-r.top)-ring.y,(e.clientX-r.left)-ring.x)});
c.addEventListener('mousemove',e=>{if(!aiming)return;const r=c.getBoundingClientRect();aimAngle=Math.atan2((e.clientY-r.top)-ring.y,(e.clientX-r.left)-ring.x);power=Math.min(100,(Date.now()-pStart)*0.15)});
c.addEventListener('mouseup',()=>{if(aiming){aiming=false;power=Math.min(100,(Date.now()-pStart)*0.15);shoot(power+30,aimAngle)}});
c.addEventListener('touchstart',e=>{e.preventDefault();if(shot||!ring.active)return;const r=c.getBoundingClientRect();aiming=true;pStart=Date.now();aimAngle=Math.atan2((e.touches[0].clientY-r.top)-ring.y,(e.touches[0].clientX-r.left)-ring.x)});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!aiming)return;const r=c.getBoundingClientRect();aimAngle=Math.atan2((e.touches[0].clientY-r.top)-ring.y,(e.touches[0].clientX-r.left)-ring.x);power=Math.min(100,(Date.now()-pStart)*0.15)});
c.addEventListener('touchend',()=>{if(aiming){aiming=false;power=Math.min(100,(Date.now()-pStart)*0.15);shoot(power+30,aimAngle)}});
c.addEventListener('click',()=>{if(!ring.active&&rCount<=0)restart()});
function restart(){score=0;rCount=10;ring={x:W/2,y:H-40,r:16,active:true};shot=false;document.getElementById('score').textContent='0';document.getElementById('rings').textContent='10';spawnTargets()}
function loop(){update();draw();requestAnimationFrame(loop)}
spawnTargets();loop();
</script>

<body>
<nav><a href="index.html">← 大厅</a><span>🐍 API Snake</span></nav>
<header><h1>🐍 API Snake</h1><p>吃掉 REST API 端点 · 越长越强</p></header>
<div class="container">
  <div class="hud">
    <div class="hud-item"><div class="val" id="hScore" style="color:#fbbf24">0</div><div class="lbl">⭐ 分</div></div>
    <div class="hud-item"><div class="val" id="hLen" style="color:#4ade80">1</div><div class="lbl">📏 长度</div></div>
    <div class="hud-item"><div class="val" id="hBest" style="color:#a78bfa">0</div><div class="lbl">🏆 最佳</div></div>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="mobile-dpad">
    <div></div><button onclick="setDir(0,-1)" style="grid-area:up">▲</button><div></div>
    <button onclick="setDir(-1,0)" style="grid-area:left">◀</button><div></div><button onclick="setDir(1,0)" style="grid-area:right">▶</button>
    <div></div><button onclick="setDir(0,1)" style="grid-area:down">▼</button><div></div>
  </div>
  <button class="game-over" style="display:none;position:static;margin:12px auto;background:rgba(139,92,246,.15);border:none;padding:10px 20px;border-radius:12px;color:#a78bfa;cursor:pointer" onclick="init()" id="restartBtn">🔄 重新开始</button>
</div>
<div class="game-over" id="go"><h2 id="goTitle"></h2><p id="goDesc" style="color:#888;font-size:13px"></p><button onclick="document.getElementById('go').style.display='none';init()">🔄 再来一局</button></div>
<footer>API Snake · 🦊 灵犀出品</footer>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const SIZE=20, COLS=20, ROWS=20;
const ENDPOINTS=['GET','POST','PUT','DELETE','PATCH'];
let snake,dir,food,score,best,gameRunning,interval,tickSpeed=120;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};score=0;
  gameRunning=true;clearInterval(interval);
  best=Math.max(best,parseInt(localStorage.getItem('snakeBest')||0));
  spawnFood();
  document.getElementById('restartBtn').style.display='block';
  interval=setInterval(tick,tickSpeed);
  draw();updateHUD();
}

function spawnFood(){
  do{
    food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS),
      emoji:ENDPOINTS[Math.floor(Math.random()*ENDPOINTS.length)],
      pts:Math.random()<.2?5:1}
  }while(snake.some(s=>s.x===food.x&&s.y===food.y))
}

function tick(){
  if(!gameRunning) return;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y))return endGame();
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score+=food.pts;spawnFood()}else{snake.pop()}
  draw();updateHUD();
}

function draw(){
  ctx.fillStyle='#12122a';ctx.fillRect(0,0,C.width,C.height);
  ctx.fillStyle='rgba(255,255,255,.02)';
  for(let i=0;i<COLS;i++){ctx.fillRect(i*SIZE,0,1,C.height);ctx.fillRect(0,i*SIZE,C.width,1)}
  snake.forEach((s,i)=>{
    const a=1-i/snake.length*.5;
    ctx.fillStyle=`rgba(34,197,94,${a})`;
    ctx.fillRect(s.x*SIZE+1,s.y*SIZE+1,SIZE-2,SIZE-2);
    if(i===0){ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('🐍',s.x*SIZE+SIZE/2,s.y*SIZE+SIZE/2+5)}
  });
  ctx.font='16px sans-serif';ctx.textAlign='center';
  ctx.fillText(food.emoji,food.x*SIZE+SIZE/2,food.y*SIZE+SIZE/2+6);
}

function setDir(dx,dy){
  if(!gameRunning) return;
  if(dx!==-dir.x||dy!==-dir.y){dir={x:dx,y:dy}}
}

function updateHUD(){
  document.getElementById('hScore').textContent=score;
  document.getElementById('hLen').textContent=snake.length;
  document.getElementById('hBest').textContent=best;
}

function endGame(){
  gameRunning=false;clearInterval(interval);
  if(score>best){best=score;localStorage.setItem('snakeBest',best)}
  document.getElementById('goTitle').textContent='💥 撞墙了！';
  document.getElementById('goTitle').style.color='#f87171';
  document.getElementById('goDesc').textContent='得分: '+score+' · 长度: '+snake.length+' · 最佳: '+best;
  document.getElementById('go').style.display='block';
  updateHUD();
}

document.addEventListener('keydown',e=>{
  const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if(keys[e.key]){e.preventDefault();setDir(...keys[e.key])}
});

// Touch swipe
let touchStart=null;
C.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}});
C.addEventListener('touchmove',e=>e.preventDefault());
C.addEventListener('touchend',e=>{
  if(!touchStart) return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
  touchStart=null;
});

init();
</script>

<header><h1>🔥 Firebase 实时对战场</h1><p>多窗口即多位选手 · 你的 Notion + GitHub 数据 = 你的战力</p></header>
<div class="arena">

        <div style="font-size:10px;color:#888;margin-top:4px" id="f2detail"></div>
      </div>
    </div>

<script>
const AK='v2.xOedfPfv9hou9ht8BXTbk7OKPlRUUvh5WuyJNC8Q3mLrU5dQVGL5rARouO2DNnC-IKG0UGeYm79Cfw1aIjsOw48Fram7uaVouZHiYKGTZzMBg4SuQLJLz4gY';
let p1Stats={tasks:0,commits:0,notes:0,projects:0};
let p2Stats={tasks:0,commits:0,notes:0,projects:0};
let leaderboard=JSON.parse(localStorage.getItem('firebase_leaderboard')||'[]');
let myId='p'+Math.random().toString(36).substring(2,8);
let myName='玩家_'+myId.substring(0,4);

async function api(url){const r=await fetch('https://gateway.maton.ai'+url,{headers:{'Authorization':'Bearer '+AK,'Notion-Version':'2025-09-03'}});return r.json()}

async function loadStats(){
  document.getElementById('battleLog').textContent='⏳ 同步战力数据...';
  try{
    // Notion tasks
    const tasks=await api('/notion/v1/data_sources/3ba68c53-ba18-806b-a725-000b464317ad/query',{method:'POST',body:JSON.stringify({page_size:50})});
    const done=tasks.results.filter(t=>(t.properties?.状态?.status?.name||'')==='已完成').length;
    // Notion docs
    const docs=await api('/notion/v1/data_sources/3ba68c53-ba18-8054-9cb7-000b80ae86dc/query',{method:'POST',body:JSON.stringify({page_size:50})});
    const notes=docs.results.filter(d=>(d.properties?.类型?.select?.name||'')==='读书笔记').length;
    const projects=(await api('/notion/v1/data_sources/3ba68c53-ba18-800b-b77e-000b6c93e118/query',{method:'POST',body:JSON.stringify({page_size:10})})).results.length;
    // GitHub
    let commits=0;
    try{const user=await fetch('https://gateway.maton.ai/github/user',{headers:{'Authorization':'Bearer '+AK}});const u=await user.json();const events=await fetch('https://gateway.maton.ai/github/users/'+u.login+'/events?per_page=100',{headers:{'Authorization':'Bearer '+AK}});const ev=await events.json();commits=ev.filter(e=>e.type==='PushEvent').reduce((s,e)=>s+(e.payload.size||0),0)}catch(e){}

    p1Stats={tasks:done,commits,notes,projects};
    const score=done*10+commits*5+notes*20+projects*30;
    document.getElementById('f1score').textContent=score;
    document.getElementById('f1name').textContent=myName;
    document.getElementById('f1detail').textContent='任务:'+done+' 提交:'+commits+' 笔记:'+notes;

    // Save to leaderboard
    leaderboard=leaderboard.filter(e=>e.id!==myId);
    leaderboard.push({id:myId,name:myName,score,timestamp:Date.now()});
    leaderboard.sort((a,b)=>b.score-a.score);
    leaderboard=leaderboard.slice(0,20);
    localStorage.setItem('firebase_leaderboard',JSON.stringify(leaderboard));
    renderLeaderboard();
    document.getElementById('battleLog').textContent='✅ 战力: '+score+' · 排名: #'+(leaderboard.findIndex(e=>e.id===myId)+1);
  }catch(e){document.getElementById('battleLog').textContent='❌ '+e.message}
}

function battle(){
  // Simulate another player
  const names=['代码侠','Bug猎人','PR大师','部署狂魔','重构王'];
  const rname=names[Math.floor(Math.random()*names.length)];
  const rTasks=Math.floor(Math.random()*30);
  const rCommits=Math.floor(Math.random()*200);
  const rNotes=Math.floor(Math.random()*15);
  const rScore=rTasks*10+rCommits*5+rNotes*20+Math.floor(Math.random()*50);
  document.getElementById('f2name').textContent=rname;
  document.getElementById('f2score').textContent=rScore;
  document.getElementById('f2detail').textContent='任务:'+rTasks+' 提交:'+rCommits+' 笔记:'+rNotes;

  const myScore=p1Stats.tasks*10+p1Stats.commits*5+p1Stats.notes*20+p1Stats.projects*30;
  const w=myScore>rScore;
  document.getElementById('battleLog').innerHTML=w?'🎉 <span style="color:#4ade80">你赢了！</span> '+myScore+' vs '+rScore:'💀 <span style="color:#ef4444">你输了！</span> '+myScore+' vs '+rScore;

  // Populate P2 to leaderboard
  leaderboard=leaderboard.filter(e=>e.id!=='bot');
  leaderboard.push({id:'bot',name:rname,score:rScore,timestamp:Date.now()});
  leaderboard.sort((a,b)=>b.score-a.score);
  leaderboard=leaderboard.slice(0,20);
  localStorage.setItem('firebase_leaderboard',JSON.stringify(leaderboard));
  renderLeaderboard();
}

function renderLeaderboard(){
  const ranks=[{c:'rank-1',m:'🥇'},{c:'rank-2',m:'🥈'},{c:'rank-3',m:'🥉'}];
  document.getElementById('leaderboard').innerHTML=leaderboard.map((e,i)=>'<div class="leader-row'+(i<3?' top'+(i+1):'')+'"><span class="rank '+(ranks[i]||{}).c+'">'+(ranks[i]||{m:i+1}).m+'</span><span class="pname">'+(e.id===myId?'<b>'+e.name+' (你)</b>':e.name)+'</span><span class="pscore" style="color:#fbbf24">'+e.score+'分</span></div>').join('')||'<div style="color:#666;padding:12px">暂无数据，点击刷新</div>';
}

loadStats();
</script>

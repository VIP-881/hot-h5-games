<title>🎮 贪吃蛇 - 灵犀游戏大厅 | 免费H5在线小游戏</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; color:#fff; user-select:none; -webkit-user-select:none; }
.header { text-align:center; margin-bottom:10px; }
.header h1 { font-size:2em; }
.stats { display:flex; gap:20px; justify-content:center; margin:10px 0; font-size:1.1em; }
.stats span { background:rgba(255,255,255,0.1); padding:6px 14px; border-radius:20px; }
canvas { border:2px solid #16213e; border-radius:8px; box-shadow:0 0 30px rgba(0,255,136,0.15); display:block; touch-action:none; }
.controls { margin-top:16px; display:flex; gap:12px; }
.btn { background:rgba(0,255,136,0.2); color:#00ff88; border:1px solid #00ff88; padding:10px 28px; border-radius:24px; font-size:1em; cursor:pointer; transition:all 0.2s; }
.btn:hover { background:rgba(0,255,136,0.3); }
.dpad { display:grid; grid-template-columns:60px 60px 60px; grid-template-rows:60px 60px 60px; gap:4px; margin-top:16px; }
.dpad button { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:10px; color:#fff; font-size:1.5em; cursor:pointer; transition:background 0.15s; }
.dpad button:active { background:rgba(0,255,136,0.3); }
.empty { background:transparent!important; border:none!important; }
.mobile-only { display:none; }
@media (max-width:600px) { .mobile-only { display:block; } }
</style>
<link rel="canonical" href="https://VIP-881.github.io/hot-h5-games/snake.html">
</head>
<body>
<div class="header"><h1>🐍 贪吃蛇</h1></div>
<div class="stats">
  <span>🍎 <b id="score">0</b></span>
  <span>🏆 <b id="best">0</b></span>
</div>
<canvas id="c" width="400" height="400"></canvas>
<div class="controls">
  <button class="btn" onclick="startGame()">🔄 新游戏</button>
</div>
<div class="dpad mobile-only">
  <div class="empty"></div>
  <button ontouchstart="setDir(0,-1);event.preventDefault()">▲</button>
  <div class="empty"></div>
  <button ontouchstart="setDir(-1,0);event.preventDefault()">◀</button>
  <div class="empty"></div>
  <button ontouchstart="setDir(1,0);event.preventDefault()">▶</button>
  <div class="empty"></div>
  <button ontouchstart="setDir(0,1);event.preventDefault()">▼</button>
  <div class="empty"></div>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const SIZE=20, COLS=20, ROWS=20;
let snake=[{x:10,y:10}], food={}, dir={x:1,y:0}, nextDir={x:1,y:0}, score=0, best=0, running=false, speed=120, lastTime=0;
try{best=parseInt(localStorage.getItem('snake_best'))||0;document.getElementById('best').textContent=best;}catch(e){}

function randFood() {
  do { food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; }
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function setDir(dx,dy) {
  if(dx!==-dir.x||dy!==-dir.y) nextDir={x:dx,y:dy};
}
function moveSnake() {
  dir=nextDir;
  const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) return endGame();
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y) { score++; document.getElementById('score').textContent=score; randFood(); }
  else snake.pop();
}
function endGame() {
  running=false;
  if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('snake_best',best)}catch(e){}}
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#fff'; ctx.font='bold 24px sans-serif'; ctx.textAlign='center';
  ctx.fillText('GAME OVER',200,180);
  ctx.font='16px sans-serif'; ctx.fillText(`得分: ${score}  最高: ${best}`,200,215);
  ctx.fillText('点击屏幕或按空格重新开始',200,245);
}
function draw() {
  ctx.fillStyle='#0f3460'; ctx.fillRect(0,0,400,400);
  for(let x=0;x<COLS;x++) for(let y=0;y<ROWS;y++) {
    ctx.fillStyle=(x+y)%2?'#16213e':'#1a1a2e';
    ctx.fillRect(x*SIZE,y*SIZE,SIZE-1,SIZE-1);
  }
  snake.forEach((s,i)=>{
    const alpha=1-i/snake.length*0.6;
    ctx.fillStyle=`rgba(0,255,136,${alpha})`;
    ctx.shadowColor='#00ff88'; ctx.shadowBlur=i===0?10:3;
    ctx.fillRect(s.x*SIZE+2,s.y*SIZE+2,SIZE-4,SIZE-4);
    ctx.shadowBlur=0;
  });
  ctx.fillStyle='#ff4757'; ctx.shadowColor='#ff4757'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(food.x*SIZE+SIZE/2,food.y*SIZE+SIZE/2,SIZE/2-2,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}
function gameLoop(t) {
  if(!running) return;
  if(t-lastTime>speed) { moveSnake(); lastTime=t; }
  draw();
  requestAnimationFrame(gameLoop);
}
function startGame() {
  snake=[{x:10,y:10}]; dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; running=true; lastTime=0;
  document.getElementById('score').textContent='0';
  randFood(); draw();
  requestAnimationFrame(gameLoop);
}
document.addEventListener('keydown',e=>{
  const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  if(map[e.key]){ e.preventDefault(); setDir(...map[e.key]); }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!running) startGame(); }
});
canvas.addEventListener('click',()=>{ if(!running) startGame(); });
let tx,ty;
canvas.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; });
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20){ if(!running) startGame(); return; }
  Math.abs(dx)>Math.abs(dy)?setDir(dx>0?1:-1,0):setDir(0,dy>0?1:-1);
});
startGame();
</script>
</body>
</html>

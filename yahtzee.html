<body>
<nav><a href="index.html">← 返回大厅</a><span>🎲 快艇骰子 Yahtzee</span></nav>
<div class="arena">
<h1>🎲 快艇骰子</h1>
<div class="dice" id="dice"></div>
<p class="rolls">剩余掷骰次数：<span id="rollsLeft">3</span></p>
<button class="btn roll" id="rollBtn" onclick="rollDice()">🎲 掷骰子</button>
<div id="scorecard" class="scorecard"></div>
<p style="font-size:18px;color:#4ade80;margin-top:8px" id="msg"></p>
<button class="btn" onclick="newGame()" style="margin-top:10px">🔄 新游戏</button>
</div>

<script>
let dice=[1,1,1,1,1], held=[false,false,false,false,false], rolls=0, scores={}, gameOver=false;

const CATEGORIES = [
  {id:'ones',name:'1点',desc:'所有1点之和',fn:d=>sumEq(d,1),section:'上部'},
  {id:'twos',name:'2点',desc:'所有2点之和',fn:d=>sumEq(d,2),section:'上部'},
  {id:'threes',name:'3点',desc:'所有3点之和',fn:d=>sumEq(d,3),section:'上部'},
  {id:'fours',name:'4点',desc:'所有4点之和',fn:d=>sumEq(d,4),section:'上部'},
  {id:'fives',name:'5点',desc:'所有5点之和',fn:d=>sumEq(d,5),section:'上部'},
  {id:'sixes',name:'6点',desc:'所有6点之和',fn:d=>sumEq(d,6),section:'上部'},
  {id:'3kind',name:'三条',desc:'所有骰子之和',fn:d=>ofAKind(d,3)?sum(d):0,section:'下部'},
  {id:'4kind',name:'四条',desc:'所有骰子之和',fn:d=>ofAKind(d,4)?sum(d):0,section:'下部'},
  {id:'fullhouse',name:'葫芦',desc:'三条+一对',fn:d=>fullHouse(d)?25:0,section:'下部'},
  {id:'smstraight',name:'小顺子',desc:'连续4个数',fn:d=>smStraight(d)?30:0,section:'下部'},
  {id:'lgstraight',name:'大顺子',desc:'连续5个数',fn:d=>lgStraight(d)?40:0,section:'下部'},
  {id:'yahtzee',name:'快艇',desc:'五个相同=50分',fn:d=>yahtzee(d)?50:0,section:'下部'},
  {id:'chance',name:'机会',desc:'所有骰子之和',fn:d=>sum(d),section:'下部'},
];

function sumEq(d,n){return d.filter(v=>v===n).reduce((a,b)=>a+b,0)}
function sum(d){return d.reduce((a,b)=>a+b,0)}
function ofAKind(d,n){let c=counts(d);return c.some(x=>x>=n)}
function count(d){let c=Array(7).fill(0);d.forEach(v=>c[v]++);return c}
function counts(d){return count(d).filter(x=>x>0)}
function fullHouse(d){let c=counts(d);return c.includes(3)&&c.includes(2)}
function smStraight(d){let s=[...new Set(d)].sort((a,b)=>a-b);for(let i=0;i<=s.length-4;i++) if(s[i+3]-s[i]===3) return true;return false}
function lgStraight(d){let s=[...new Set(d)].sort((a,b)=>a-b);return s.length===5&&(s[4]-s[0]===4)}
function yahtzee(d){return new Set(d).size===1}

function rollDice(){
  if(gameOver||rolls>=3) return;
  for(let i=0;i<5;i++) if(!held[i]) dice[i]=Math.floor(Math.random()*6)+1;
  rolls++;
  document.getElementById('rollsLeft').textContent=3-rolls;
  if(rolls>=3) document.getElementById('rollBtn').disabled=true;
  renderDice();
  renderHints();
}

function toggleHold(i){
  if(rolls===0) return;
  held[i]=!held[i];
  renderDice();
}

function renderDice(){
  let emojis=['','⚀','⚁','⚂','⚃','⚄','⚅'];
  let d=document.getElementById('dice');
  d.innerHTML=dice.map((v,i)=>`<div class="die${held[i]?' held':''}" onclick="toggleHold(${i})">${emojis[v]}</div>`).join('');
}

function scoreCategory(catId){
  if(gameOver||rolls===0||scores[catId]!==undefined) return;
  let cat=CATEGORIES.find(c=>c.id===catId);
  scores[catId]=cat.fn(dice);
  // Reset for next round
  dice=[1,1,1,1,1]; held=[false,false,false,false,false]; rolls=0;
  document.getElementById('rollsLeft').textContent=3;
  document.getElementById('rollBtn').disabled=false;
  renderDice();
  renderScorecard();
  checkEnd();
}

function renderHints(){
  if(rolls===0||gameOver) return;
  // Highlight possible scores
  CATEGORIES.forEach(cat=>{
    if(scores[cat.id]!==undefined) return;
    let el=document.getElementById('v_'+cat.id);
    if(el) el.textContent=cat.fn(dice);
    if(el&&!el.classList.contains('filled')) el.classList.add('hint');
  });
}

function renderScorecard(){
  let sc=document.getElementById('scorecard');
  let html='';
  let upperSum=0,upperBonus=0,totalScore=0;
  let sections=[];
  
  CATEGORIES.forEach(cat=>{
    if(!sections.includes(cat.section)){
      if(sections.length>0){
        html+=`<div class="bonus">上部合计: ${upperSum} ${upperSum>=63?'✅ +35分奖励!':'(需≥63)'}</div>`;
        upperBonus=upperSum>=63?35:0;
      }
      sections.push(cat.section);
      html+=`<span class="section">${cat.section}</span>`;
    }
    let val=scores[cat.id];
    let filled=val!==undefined;
    html+=`<span class="lbl" title="${cat.desc}">${cat.name}</span>`;
    html+=`<span class="val${filled?' filled':''}" id="v_${cat.id}" onclick="scoreCategory('${cat.id}')">${filled?val:rolls>0?cat.fn(dice):'—'}</span>`;
    if(cat.section==='上部'&&filled) upperSum+=val;
  });
  html+=`<div class="bonus">上部合计: ${upperSum} ${upperBonus?'+35=奖励':'(需≥63)'}</div>`;
  
  // Calculate total
  totalScore=upperBonus;
  Object.values(scores).forEach(v=>totalScore+=v);
  // Bonus yahtzee
  if(scores.yahtzee===50&&yahtzeeBonus) totalScore+=100;
  
  html+=`<span class="total">总计</span><span class="total">${totalScore}</span>`;
  sc.innerHTML=html;
  document.getElementById('msg').textContent=gameOver?`🎉 最终得分: ${totalScore}`:'';
}

function checkEnd(){
  if(Object.keys(scores).length>=13){
    gameOver=true;
    document.getElementById('rollBtn').disabled=true;
    renderScorecard();
    let total=0;
    let upperSum=0;
    CATEGORIES.forEach(c=>{
      if(c.section==='上部') upperSum+=scores[c.id]||0;
      total+=scores[c.id]||0;
    });
    if(upperSum>=63) total+=35;
    let best=localStorage.getItem('yahtzee_best');
    if(!best||total>parseInt(best)){
      localStorage.setItem('yahtzee_best',total);
      document.getElementById('msg').textContent=`🎉 最终得分: ${total} 🆕 新纪录！`;
    } else {
      document.getElementById('msg').textContent=`🎉 最终得分: ${total} (纪录: ${best})`;
    }
  }
}

function newGame(){
  scores={}; dice=[1,1,1,1,1]; held=[false,false,false,false,false]; rolls=0; gameOver=false;
  document.getElementById('rollsLeft').textContent=3;
  document.getElementById('rollBtn').disabled=false;
  document.getElementById('msg').textContent='';
  renderDice();
  renderScorecard();
}

renderDice(); renderScorecard();
</script>

<h1>🧩 拼字达人</h1>
<div class="stats"><span>✅ <b id="score">0</b></span><span>🔥 <b id="streak">0</b></span><span>🏆 <b id="best">0</b></span></div>
<div class="hint-area" id="hint"></div>
<div class="answer-area" id="answerArea"></div>
<div class="letters" id="letters"></div>
<div><button class="btn" onclick="skip()">⏭ 跳过</button><button class="btn" onclick="clearAnswer()">↩ 清除</button></div>
<script>
const WORDS=['REACT','GAME','STACK','CLOUD','BRAIN','TRACK','FLAME','CRISP','BLAST','SHARK','PLANT','STORM','WORLD','SPACE','DREAM','BRICK','CHESS','FLASH','GRAPE','HEART','JUMP','KNIFE','LIGHT','MUSIC','OCEAN','PIANO','QUEEN','RIVER','SNAKE','TIGER'];
let word='',scrambled=[],answer=[],used=[],score=0,streak=0,best=0;
try{best=parseInt(localStorage.getItem('word_best'))||0;document.getElementById('best').textContent=best}catch(e){}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function newWord(){
  word=WORDS[Math.floor(Math.random()*WORDS.length)];
  scrambled=shuffle(word.split(''));
  while(scrambled.join('')===word)scrambled=shuffle(word.split(''));
  answer=[];used=Array(word.length).fill(false);
  document.getElementById('hint').textContent=`${word.length} 个字母的英文单词`;
  render();
}
function addLetter(i){
  if(answer.length>=word.length||used[i])return;
  answer.push(scrambled[i]);used[i]=true;render();
}
function removeLetter(i){
  if(answer.length===0)return;
  const letter=answer[i];
  const si=scrambled.findIndex((l,j)=>l===letter&&used[j]&&answer.indexOf(l)===i||(answer.filter((a,k)=>a===letter&&k<=i).length===scrambled.filter((s,k)=>s===letter&&used[k]&&k<=scrambled.indexOf(letter)).length));
  answer.splice(i,1);
  for(let j=used.length-1;j>=0;j--){if(scrambled[j]===letter&&used[j]){used[j]=false;break}}
  render();
  if(answer.join('')===word){score+=word.length*10;streak++;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('word_best',best)}catch(e){}}
  document.getElementById('hint').textContent='🎉 正确!';setTimeout(newWord,800)}
}
function render(){
  document.getElementById('letters').innerHTML=scrambled.map((l,i)=>`<div class="letter${used[i]?' used':''}" onclick="addLetter(${i})">${l}</div>`).join('');
  document.getElementById('answerArea').innerHTML=Array.from({length:word.length},(_,i)=>`<div class="answer-slot${i<answer.length?' filled':''}" onclick="removeLetter(${i})">${answer[i]||''}</div>`).join('');
}
function skip(){streak=0;document.getElementById('streak').textContent='0';newWord()}
function clearAnswer(){while(answer.length){removeLetter(0)}}
newWord();
</script>

<body>
<h1>⏱ 计时挑战</h1>
<div class="stats"><span>🎯 <b id="score">0</b></span><span>🏆 <b id="best">--</b>ms</span></div>
<div class="target">目标: 停在 <b>10.000</b> 秒</div>
<div class="display" id="display">0.000</div>
<button class="btn" id="btn" onclick="action()">▶ 开始</button>
<div class="result-row" id="results"></div>
<script>
let state='idle',startTime=0,timerInterval,results=[],best;
try{best=parseInt(localStorage.getItem('stopwatch_best'))||0;document.getElementById('best').textContent=best?`${best}ms`:'--ms'}catch(e){}
function action(){
  if(state==='idle'){state='running';document.getElementById('btn').textContent='⏸ 停止!';startTime=Date.now();timerInterval=setInterval(()=>{const t=(Date.now()-startTime)/1000;document.getElementById('display').textContent=t.toFixed(3)},10)}
  else if(state==='running'){clearInterval(timerInterval);const actual=(Date.now()-startTime);const diff=Math.abs(actual-10000);state='idle';document.getElementById('btn').textContent='▶ 再来';
    results.unshift({t:actual,diff});if(results.length>8)results.pop();
    renderResults();document.getElementById('display').textContent=(actual/1000).toFixed(3);
    document.getElementById('score').textContent=results.filter(r=>r.diff<500).length;
    if(!best||diff<best){best=diff;document.getElementById('best').textContent=`${diff}ms`;try{localStorage.setItem('stopwatch_best',best)}catch(e){}}
  }
}
function renderResults(){document.getElementById('results').innerHTML=results.map(r=>{const d=r.diff/1000;return `<span class="result-dot ${d<0.2?'good':d<0.5?'ok':''}">${(r.t/1000).toFixed(3)}s (${d<0.1?'🎯':'差'}${d.toFixed(1)}s)</span>`}).join('')}
</script>

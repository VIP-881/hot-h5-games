<body>
<h1>🏸 羽毛球</h1>
<div class="stats"><span>👤 <b id="ps">0</b></span><span>🤖 <b id="as">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="500"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=500,G=0.2;
let shuttle={x:W/2,y:H/2,vx:3,vy:-6,r:5},player={x:W/2,y:H-30,w:80},ai={x:W/2,y:30,w:70},ps=0,as=0,best=0,serving=true,winScore=11;
try{best=parseInt(localStorage.getItem('badminton_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function reset(){shuttle={x:W/2,y:H/2,vx:(Math.random()>.5?1:-1)*3,vy:(Math.random()>.5?1:-1)*5,r:5};serving=true}
function update(){
  if(serving)return;
  shuttle.vx*=0.999;shuttle.vy+=G;shuttle.x+=shuttle.vx;shuttle.y+=shuttle.vy;
  if(shuttle.x-shuttle.r<0||shuttle.x+shuttle.r>W)shuttle.vx*=-0.7;
  // Player hit
  if(shuttle.y+shuttle.r>H-40&&shuttle.x>player.x&&shuttle.x<player.x+player.w){shuttle.y=H-40-shuttle.r;shuttle.vy=-Math.abs(shuttle.vy)-3;shuttle.vx+=(shuttle.x-player.x-player.w/2)*0.3}
  // AI hit
  if(shuttle.y-shuttle.r<40&&shuttle.x>ai.x&&shuttle.x<ai.x+ai.w){shuttle.y=40+shuttle.r;shuttle.vy=Math.abs(shuttle.vy)+3;shuttle.vx+=(shuttle.x-ai.x-ai.w/2)*0.3}
  if(shuttle.y>H){as++;document.getElementById('as').textContent=as;checkSet()}
  if(shuttle.y<0){ps++;document.getElementById('ps').textContent=ps;checkSet()}
  if(shuttle.vy<0)ai.x+=(shuttle.x-ai.x-ai.w/2)*0.07;else ai.x+=(W/2-ai.x-ai.w/2)*0.03;
  ai.x=Math.max(0,Math.min(W-ai.w,ai.x))
}
function checkSet(){
  if(ps>=winScore||as>=winScore){const w=ps>as?ps:as;if(w>best){best=w;document.getElementById('best').textContent=best;try{localStorage.setItem('badminton_best',best)}catch(e)}ps=0;as=0;document.getElementById('ps').textContent='0';document.getElementById('as').textContent='0'}reset()
}
function draw(){
  ctx.fillStyle='#1a3a5c';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(W,20);ctx.stroke();ctx.setLineDash([]);
  // Net
  ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H/2-15);ctx.lineTo(W,H/2-15);ctx.stroke();
  ctx.fillStyle='#888';for(let x=0;x<W;x+=15){ctx.fillRect(x,H/2-18,8,25)}
  ctx.fillStyle='#e67e22';ctx.fillRect(player.x,player.y-8,player.w,12);
  ctx.fillStyle='#3498db';ctx.fillRect(ai.x,ai.y-4,ai.w,12);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(shuttle.x,shuttle.y,shuttle.r,0,Math.PI*2);ctx.fill();
  if(serving){ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('点击开始发球',W/2,H/2+20)}
  else{ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(`${ps} : ${as}`,W/2,H/2-30)}
}
c.addEventListener('mousemove',e=>{player.x=Math.max(0,Math.min(W-player.w,e.clientX-c.getBoundingClientRect().left-player.w/2))});
c.addEventListener('touchmove',e=>{e.preventDefault();player.x=Math.max(0,Math.min(W-player.w,e.touches[0].clientX-c.getBoundingClientRect().left-player.w/2))},{passive:false});
c.addEventListener('click',()=>{if(serving)serving=false});
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>

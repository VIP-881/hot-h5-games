<h1>🌈 渐变色挑战</h1>
<div class="stats"><span>🎨 <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<div class="tiles" id="tiles"></div>
<button class="btn" onclick="newRound()">🔄 新颜色</button>
<script>
let tiles=[],selected=null,score=0,best=0;
try{best=parseInt(localStorage.getItem('gradient_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function genColors(){const h=Math.floor(Math.random()*360);const tiles2=[];for(let i=0;i<6;i++)tiles2.push({h,s:60+Math.random()*30,l:45+Math.random()*20,pos:i});return tiles2}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){
  tiles=genColors();tiles=shuffle(tiles);selected=null;render();
}
function render(){
  document.getElementById('tiles').innerHTML=tiles.map((t,i)=>`<div class="tile${selected===i?' selected':''}" style="background:hsl(${t.h},${t.s}%,${t.l}%)" onclick="clickTile(${i})"></div>`).join('');
}
function clickTile(i){
  if(selected===null){selected=i}else if(selected===i){selected=null}else{
    [tiles[selected],tiles[i]]=[tiles[i],tiles[selected]];selected=null;
    if(checkWin()){score++;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('gradient_best',best)}catch(e)}setTimeout(newRound,500)}
  }render();
}
function checkWin(){
  for(let i=1;i<tiles.length;i++)if(tiles[i].h<tiles[i-1].h)return false;
  return true;
}
newRound();
</script>

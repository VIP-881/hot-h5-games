<body>
<h1>👾 太空入侵者</h1>
<div class="stats"><span>⭐ <b id="score">0</b></span><span>❤️ <b id="lives">3</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="500"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=500;
let player={x:W/2,y:H-40,w:36},bullets=[],enemies=[],eBullets=[],score=0,lives=3,best=0,frame=0,dir=1,speed=1,gameover=false;
try{best=parseInt(localStorage.getItem('invader_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function spawnEnemies(){
  enemies=[];
  for(let r=0;r<4;r++)for(let c=0;c<8;c++){
    enemies.push({x:60+c*32,y:60+r*28,w:24,h:20,alive:true,type:r});
  }
}
function fire(){bullets.push({x:player.x+player.w/2-2,y:player.y-10,w:3,h:12})}
function enemyFire(){if(enemies.filter(e=>e.alive).length===0)return;
  const alive=enemies.filter(e=>e.alive);const shooter=alive[Math.floor(Math.random()*alive.length)];
  eBullets.push({x:shooter.x+12,y:shooter.y+22,w:3,h:10})
}
function update(){if(gameover)return;frame++;
  if(frame%5===0){let edge=false;for(const e of enemies)if(e.alive&&(e.x<=10||e.x+24>=W-10)){edge=true;break}
    if(edge){dir*=-1;enemies.forEach(e=>{if(e.alive)e.y+=10})}
    enemies.forEach(e=>{if(e.alive)e.x+=dir*speed});
  }
  if(frame%30===0)enemyFire();
  for(let i=bullets.length-1;i>=0;i--){bullets[i].y-=6;if(bullets[i].y<0)bullets.splice(i,1)}
  for(let i=eBullets.length-1;i>=0;i--){eBullets[i].y+=4;if(eBullets[i].y>H)eBullets.splice(i,1)}
  for(let i=bullets.length-1;i>=0;i--)for(let j=enemies.length-1;j>=0;j--){
    const b=bullets[i],e=enemies[j];if(!e.alive||!b)continue;
    if(b.x>e.x&&b.x+b.w<e.x+e.w&&b.y>e.y&&b.y+b.h<e.y+e.h){e.alive=false;score+=10+e.type*5;bullets.splice(i,1);document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('invader_best',best)}catch(e){}};speed=1+score/200;break}
  }
  enemies=enemies.filter(e=>e.alive||e.y<H);
  if(enemies.filter(e=>e.alive).length===0){score+=100;spawnEnemies()}
  for(let i=eBullets.length-1;i>=0;i--){const b=eBullets[i];if(b.x>player.x&&b.x+b.w<player.x+player.w&&b.y>player.y&&b.y+b.h<player.y+20){lives--;document.getElementById('lives').textContent=lives;eBullets.splice(i,1);if(lives<=0)endGame()}}
  for(const e of enemies)if(e.alive&&e.y+e.h>player.y){lives=0;endGame()}
}
function endGame(){gameover=true;ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-15);ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重来`,W/2,H/2+20)}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<30;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.4})`;ctx.fillRect(Math.random()*W,Math.random()*H,1.5,1.5)}
  // Bunkers
  for(let bx=30;bx<W-30;bx+=100){ctx.fillStyle='#2ecc71';ctx.fillRect(bx,H-90,60,15);ctx.fillRect(bx+10,H-105,20,15);ctx.fillRect(bx+30,H-105,20,15)}
  enemies.forEach(e=>{if(!e.alive)return;const colors=['#fff','#e74c3c','#f39c12','#e67e22'];ctx.fillStyle=colors[e.type];
    ctx.fillRect(e.x+4,e.y,4,6);ctx.fillRect(e.x,e.y+6,24,6);ctx.fillRect(e.x+2,e.y+12,20,6);
    ctx.fillRect(e.x+4,e.y+18,4,6);ctx.fillRect(e.x+16,e.y+18,4,6);
  });
  bullets.forEach(b=>{ctx.fillStyle='#0f0';ctx.fillRect(b.x,b.y,b.w,b.h)});
  eBullets.forEach(b=>{ctx.fillStyle='#f00';ctx.fillRect(b.x,b.y,b.w,b.h)});
  ctx.fillStyle='#0f0';ctx.beginPath();ctx.moveTo(player.x+player.w/2,player.y);ctx.lineTo(player.x,player.y+20);ctx.lineTo(player.x+player.w,player.y+20);ctx.closePath();ctx.fill();ctx.fillStyle='#00ff00';ctx.fillRect(player.x+player.w/2-3,player.y-8,6,8);
}
c.addEventListener('mousemove',e=>{player.x=Math.max(5,Math.min(W-player.w-5,e.clientX-c.getBoundingClientRect().left-player.w/2))});
c.addEventListener('touchmove',e=>{e.preventDefault();player.x=Math.max(5,Math.min(W-player.w-5,e.touches[0].clientX-c.getBoundingClientRect().left-player.w/2))},{passive:false});
c.addEventListener('click',()=>{if(gameover){restart();return}fire()});
setInterval(()=>{if(!gameover)fire()},250);
function restart(){score=0;lives=3;bullets=[];eBullets=[];frame=0;dir=1;speed=1;gameover=false;player.x=W/2;spawnEnemies();document.getElementById('score').textContent='0';document.getElementById('lives').textContent='3'}
function loop(){update();draw();requestAnimationFrame(loop)}spawnEnemies();loop();
</script>
</body>

// Process GAMES: convert from array of arrays to array of objects
var gameData=[], catCounts={}, catLabels={'puzzle':'puzzle','action':'action','arcade':'arcade','sport':'sport','casino':'casino','creative':'creative','music':'music','classic':'classic','viral':'hot','hot':'hot'};
GAMES.forEach(function(g){gameData.push({id:g[0],emoji:g[2],title:g[2],titleEn:g[2],cat:g[3],tag:g[4],num:g[5]});catCounts[catLabels[g[3]]]=(catCounts[catLabels[g[3]]]||0)+1;});

var CAT_ORDER=['puzzle','action','arcade','sport','casino','creative','music','classic','hot'];
var CAT_GR={'puzzle':'gp','action':'ga','arcade':'gd','sport':'gs','casino':'gx','creative':'gc','music':'gm','classic':'gcl','viral':'gh','hot':'gh'};
var CAT_TG={'puzzle':'tp','action':'ta','arcade':'td','sport':'ts','casino':'tx','creative':'tc','music':'tm','classic':'tcl','viral':'th','hot':'th'};
var curCat='all',curQ='',curIdx=-1,favOnly=false;

function buildCatsStr(){
  var h='<button class="cb active" onclick="setCat(\'all\')">'+t('all')+' <span class="cn">'+gameData.length+'</span></button>';
  CAT_ORDER.forEach(function(c){if(catCounts[c])h+='<button class="cb" onclick="setCat(\''+c+'\')">'+(I18N[LANG].cats[c]||c)+' <span class="cn">'+catCounts[c]+'</span></button>';});
  return h;
}

function setCat(c){curCat=c;document.querySelectorAll('.cb').forEach(function(b){b.classList.toggle('active',b.textContent.includes(c)||(c==='all'&&b.textContent.includes('全部'))||(c==='all'&&b.textContent.includes('All')));});render();}
function onSearch(){curQ=document.querySelector('.sbox').value.toLowerCase();render();}

function toggleFavFilter(){
  favOnly=!favOnly;
  document.getElementById('favBtn').classList.toggle('active',favOnly);
  render();
}

function render(){
  var g=document.getElementById('grid'),h='',n=0;
  var shown=gameData.filter(function(a){
    if(favOnly&&!FAVS[a.id])return false;
    return (curCat==='all'||a.cat===curCat)&&(!curQ||a.title.toLowerCase().includes(curQ)||a.titleEn.toLowerCase().includes(curQ)||a.emoji.includes(curQ));
  });
  shown.forEach(function(a){
    n++;var _=CAT_GR[a.cat]||'gdf',t=CAT_TG[a.cat]||'th';
    var faved=FAVS[a.id]?'act':'';
    h+='<div class="cd"><div class="cc '+_+'"><span class="ic">'+a.emoji+'</span></div><span class="fs '+faved+'" onclick="event.stopPropagation();toFav(\''+a.id+'\')">\u2b50</span><div class="cb2" onclick="openGame('+n+')"><h3>'+a.title+'</h3><p>'+a.tag+'</p><span class="ctg '+t+'">'+a.tag+'</span></div></div>';
  });
  g.innerHTML=h||'<div style="text-align:center;padding:30px;color:var(--text2);grid-column:1/-1">'+t('empty')+'</div>';
  document.querySelector('.si b').textContent=n;
  updateFavCount();
}

function toFav(id){
  if(FAVS[id]){delete FAVS[id];}else{FAVS[id]=1;}
  saveAll();
  document.querySelectorAll('.fs[onclick*="'+id+'"]').forEach(function(s){s.classList.toggle('act',!!FAVS[id]);});
  updateFavCount();
}

function updateFavCount(){
  var c=Object.keys(FAVS).length;
  var el=document.getElementById('favCount');
  if(el)el.innerHTML='<b>'+c+'</b>';
}

function showLogin(){
  var el=document.getElementById('loginModal');
  var avatars=['\ud83e\udd16','\ud83d\udc36','\ud83d\udc31','\ud83d\udc30','\ud83e\udd8d','\ud83e\udd8a','\ud83d\udc3b','\ud83d\udc3e','\ud83d\udc34','\ud83d\udc7e'];
  var h='<div class="lbox"><h2>'+t('login.ttl')+'</h2><input id="loginName" placeholder="'+t('login.name')+'" value="'+(USER.name||'')+'" maxlength="12"><div class="avatars">';
  avatars.forEach(function(a){h+='<span class="'+(USER.avatar===a?'act':'')+'" onclick="document.querySelectorAll(\'.avatars span\').forEach(function(s){s.classList.remove(\'act\')});this.classList.add(\'act\');window._av=\''+a+'\'">'+a+'</span>';});
  h+='</div><button onclick="doLogin()">'+t('login.btn')+'</button><div class="hint">'+t('login.hint')+'</div>';
  h+='<div style="margin-top:12px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-size:.6em;color:var(--text2)">'+t('login.exportBtn')+' | '+t('login.importBtn')+'</span>';

  window._av=USER.avatar||'\ud83e\udd16';
  setTimeout(function(){var inp=document.getElementById('loginName');if(inp){inp.focus();inp.select();}},100);
}
function doLogin(){
  var name=document.getElementById('loginName').value.trim()||'\ud83d\udc64';
  USER={name:name,avatar:window._av||'\ud83e\udd16'};
  saveAll();
  document.getElementById('loginModal').classList.remove('act');
  updateProfile();
}
function updateProfile(){
  var el=document.getElementById('profile');
  if(USER&&USER.name){el.innerHTML='<span class="pfp">'+USER.avatar+'</span><span class="uname" onclick="showLogin()">'+USER.name+'</span>';}
  else{el.innerHTML='<span class="pfp" onclick="showLogin()">\ud83e\udd16</span><span class="uname" onclick="showLogin()">'+t('login.guest')+'</span>';}
}

// ===== VIEWER =====
var timerInt=null,timerSec=0;
function openGame(idx){
  var a=gameData[idx-1];if(!a)return;
  if(idx!==curIdx){curIdx=idx;
    PLAYS[a.id]=(PLAYS[a.id]||0)+1;saveAll();}
  document.getElementById('v').classList.add('act');
  document.getElementById('gameFrame').src='';
  document.querySelector('.ld').classList.add('act');
  document.querySelector('.vt').innerHTML=a.emoji+' '+a.title;
  document.getElementById('vFavBtn').textContent=FAVS[a.id]?'\u2605':'\u2606';
  timerSec=0;if(timerInt)clearInterval(timerInt);updTimer();
  timerInt=setInterval(function(){timerSec++;updTimer();},1000);
  setTimeout(function(){document.getElementById('gameFrame').src=a.id+'.html';},100);
}
function closeGame(){
  if(curIdx>0&&timerSec>0){
    var gid=gameData[curIdx-1].id;
    if(!BEST[gid]||timerSec<BEST[gid])BEST[gid]=timerSec;
    TCNT[gid]=(TCNT[gid]||0)+1;saveAll();
  }
  document.getElementById('v').classList.remove('act');
  document.getElementById('gameFrame').src='';curIdx=-1;
  if(timerInt){clearInterval(timerInt);timerInt=null;}
}
function onFrameLoad(){document.querySelector('.ld').classList.remove('act');}
function updTimer(){var m=Math.floor(timerSec/60),s=timerSec%60;document.querySelector('.tm').textContent='\ud83d\udd52 '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}

document.addEventListener('keydown',function(e){
  if(curIdx===-1||!document.getElementById('v').classList.contains('act'))return;
  if(e.key==='Escape'){closeGame();e.preventDefault();}
  if(e.key==='ArrowLeft'){e.preventDefault();navG(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();navG(1);}
});
function navG(d){var nx=curIdx+d;if(nx<1)nx=gameData.length;if(nx>gameData.length)nx=1;openGame(nx);}

function randomGame(){
  var idx=Math.floor(Math.random()*gameData.length)+1;
  openGame(idx);
}

function showRanking(){
  var sorted=gameData.slice().sort(function(a,b){return (PLAYS[b.id]||0)-(PLAYS[a.id]||0);});
  var top=sorted.slice(0,20);
  var h='<div class="rkbox"><h2>'+t('rk')+'</h2><p style="text-align:center;font-size:.55em;color:var(--text2);margin-bottom:4px">'+t('stats')+'</p>';
  top.forEach(function(g,i){
    var rank=i+1,plays=PLAYS[g.id]||0,medal=rank<=3?['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'][rank-1]:rank+'.';
    var cls=rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
    var best=BEST[g.id];var bs=best?Math.floor(best/60)+':'+String(best%60).padStart(2,'0'):'--';
    h+='<div class="ri"><span class="rn2 '+cls+'">'+medal+'</span><span class="ri2"><span class="rn2">'+g.emoji+' '+g.title+'</span><span class="rc2">'+plays+'x \ud83d\udd52 '+bs+'</span></span><button class="rp" onclick="closeRank();openGame('+(i+1)+')">\u25b6</button></div>';
  });
  h+='<div style="text-align:center;margin-top:6px"><button class="act" onclick="closeRank()">\u2716</button></div></div>';
  var el=document.getElementById('rk');el.innerHTML=h;el.classList.add('act');
}
function closeRank(){document.getElementById('rk').classList.remove('act');}

var CHECKIN=(function(){try{return JSON.parse(localStorage.getItem('ci'))||{}}catch(e){return {}}})();
function doCheckin(){
  var today=new Date().toDateString();
  CHECKIN.last=today;
  CHECKIN.streak=(CHECKIN.streak||0)+1;
  if(CHECKIN.last!==today){CHECKIN.streak=1;}
  var bonus=Math.min(10+CHECKIN.streak*2,50);
  COINS+=bonus;saveCoins();
  CHECKIN.last=today;localStorage.setItem('ci',JSON.stringify(CHECKIN));
  alert('✅ 签到成功！已连续 '+CHECKIN.streak+' 天\n🪙 +'+bonus+' 金币');
}
function checkinBtn(){
  var today=new Date().toDateString();

}

function fetchLB(){
  var s=document.getElementById('lbStatus');var b=document.getElementById('lbBody');
  if(s)s.textContent='同步中...';
  var x=new XMLHttpRequest();
  x.onload=function(){try{
    var d=JSON.parse(x.responseText);var items=d.scores||[];items.sort(function(a,b){return(b.coins||0)-(a.coins||0)});
    if(b){
      var hh='';items.slice(0,30).forEach(function(g,i){
        var r=i+1,medal=r<=3?['🥇','🥈','🥉'][r-1]:r+'.';
        hh+='<div class="ri"><span class="rn2 '+(r<=3?'r'+r:'')+'">'+medal+'</span><span class="ri2"><span class="rn2">'+(g.avatar||'👤')+' '+(g.name||'游客')+'</span><span class="rc2">🪙'+g.coins+' 🎮'+g.plays+'x 🕒'+g.time+'s</span></span></div>';
      });
      if(!items.length)hh+='<div style="text-align:center;padding:12px;color:var(--text2);font-size:.7em">暂无数据</div>';
      b.innerHTML=hh;
    }
    if(s)s.textContent='已同步';
  }catch(e){if(s)s.textContent='加载失败';}};
  x.onerror=function(){if(s)s.textContent='网络错误';};
  x.open('GET','https://raw.githubusercontent.com/VIP-881/hot-h5-games/main/leaderboard.json?v='+Date.now());
  x.send();
}
function pushLB(){
  if(!USER||!USER.name)return;
  var totalTime=0;for(var k in TCNT)totalTime+=TCNT[k];
  var data={scores:[{name:USER.name,avatar:USER.avatar||'🤖',coins:COINS,plays:Object.keys(PLAYS).length,time:totalTime,updated:new Date().toISOString()}]};
  try{localStorage.setItem('lb_local',JSON.stringify(data))}catch(e){}
  // GitHub API push via Maton
  var key='v2.xOedfPfv9hou9ht8BXTbk7OKPlRUUvh5WuyJNC8Q3mLrU5dQVGL5rARouO2DNnC-IKG0UGeYm79Cfw1aIjsOw48Fram7uaVouZHiYKGTZzMBg4SuQLJLz4gY';
  var x=new XMLHttpRequest();
  x.open('GET','https://gateway.maton.ai/github/repos/VIP-881/hot-h5-games/contents/leaderboard.json?ref=main');
  x.setRequestHeader('Authorization','Bearer '+key);
  x.onload=function(){try{
    var existing=JSON.parse(x.responseText);var sha=existing.sha;
    var current=JSON.parse(atob(existing.content));var scores=current.scores||[];
    var idx=scores.findIndex(function(s){return s.name===USER.name});
    if(idx>=0)scores[idx]={name:USER.name,avatar:USER.avatar,coins:Math.max(COINS,scores[idx].coins||0),plays:Object.keys(PLAYS).length,time:totalTime,updated:new Date().toISOString()};
    else scores.push({name:USER.name,avatar:USER.avatar,coins:COINS,plays:Object.keys(PLAYS).length,time:totalTime,updated:new Date().toISOString()});
    var px=new XMLHttpRequest();
    px.open('PUT','https://gateway.maton.ai/github/repos/VIP-881/hot-h5-games/contents/leaderboard.json');
    px.setRequestHeader('Authorization','Bearer '+key);
    px.setRequestHeader('Content-Type','application/json');
    px.send(JSON.stringify({message:'sync lb',content:btoa(JSON.stringify({scores:scores})),sha:sha,branch:'main'}));
  }catch(e){}};
  x.send();
}

function startHS(){
  closeMP();MP={mode:'hs',players:['玩家1','玩家2'],turn:0,scores:[0,0]};
  var g=gameData[Math.floor(Math.random()*gameData.length)];
  var t='🔥 HS ['+MP.players[0]+'] '+g.emoji+' '+g.title;
  openGame(gameData.indexOf(g)+1);
  document.querySelector('.vt').innerHTML='🔥 '+MP.players[0]+' | '+g.emoji+' '+g.title;
  MP.currentGame=gameData.indexOf(g)+1;
  // After close, switch turns
  var _oc=closeGame;
  closeGame=function(){
    MP.scores[MP.turn]=Math.max(MP.scores[MP.turn],timerSec);
    MP.turn=1-MP.turn;
    if(MP.turn===0){
      // Both players done - show results
      var winner=MP.scores[0]>MP.scores[1]?MP.players[0]:MP.scores[0]<MP.scores[1]?MP.players[1]:'平局';
      alert('🏆 '+winner+'胜利\n'+MP.players[0]+': '+MP.scores[0]+'s\n'+MP.players[1]+': '+MP.scores[1]+'s');
      MP={mode:'',players:[],turn:0,scores:[0,0]};
      closeGame=_oc;
      document.getElementById('v').classList.remove('act');
    } else {
      var g2=gameData[Math.floor(Math.random()*gameData.length)];
      document.querySelector('.vt').innerHTML='🔥 '+MP.players[1]+' | '+g2.emoji+' '+g2.title;
      document.getElementById('gameFrame').src=g2.id+'.html';
      timerSec=0;
    }
    _oc();
  };
  document.getElementById('v').classList.add('act');
}

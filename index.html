var CAT_GRAD = {puzzle:'g-puzzle',action:'g-action',arcade:'g-arcade',sport:'g-sport',casino:'g-casino',creative:'g-creative',music:'g-music',classic:'g-classic',viral:'g-viral',hot:'g-hot'};
var CAT_TAG = {puzzle:'tag-puzzle',action:'tag-action',arcade:'tag-arcade',sport:'tag-sport',casino:'tag-casino',creative:'tag-creative',music:'tag-music',classic:'tag-classic',viral:'tag-hot',hot:'tag-hot'};

var curCat='all',curQ='';

function filter(c){curCat=c;document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('active',b.textContent.includes(c)||c==='all'&&b===document.querySelector('.cat-btn'));});render();}
function onSearch(){curQ=document.getElementById('searchBox').value.toLowerCase();render();}

function render(){
  var g=document.getElementById('grid'),h='',n=0;
  for(var i=0;i<GAMES.length;i++){
    var a=GAMES[i];
    if(curCat!=='all'&&a[3]!==curCat)continue;
    if(curQ&&!a[1].includes(curQ)&&!a[2].toLowerCase().includes(curQ))continue;
    n++;_=(CAT_GRAD[a[3]]||'g-default');t=(CAT_TAG[a[3]]||'tag-hot');
    h+='<div class="card" onclick="openGame(\''+a[0]+'\',\''+a[1]+' '+a[2]+'\')"><div class="card-cover '+_+'"><span class="icon">'+a[1]+'</span></div><div class="card-body"><h3>'+a[2]+'</h3><p>'+a[4]+'</p><span class="card-tag '+t+'">'+a[4]+'</span></div></div>';
  }
  g.innerHTML=h||'<div style="text-align:center;padding:40px;color:#666;grid-column:1/-1">没有匹配的游戏</div>';
  document.getElementById('count').textContent=n;
}

function openGame(f,t){document.getElementById('viewer').classList.add('active');document.getElementById('gameFrame').src=f+'.html';document.getElementById('viewerTitle').textContent=t;}
function closeGame(){document.getElementById('viewer').classList.remove('active');document.getElementById('gameFrame').src='';}
render();
</script>
</body>
</html>

var TAG_CLASSES = {hot:'tag-hot',classic:'tag-classic',viral:'tag-viral',arcade:'tag-arcade',puzzle:'tag-puzzle',action:'tag-action',sport:'tag-sport',casino:'tag-casino',creative:'tag-creative',music:'tag-music'};
var currentFilter = 'all', searchQuery = '';

function onSearch() {
  searchQuery = document.getElementById('searchBox').value.toLowerCase();
  renderGrid();
}

function filter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('active', b.textContent.includes(cat) || (cat==='all'&&!b.textContent.includes('益')));});
  document.querySelectorAll('.cat-btn')[0].classList.toggle('active', cat==='all');
  renderGrid();
}

function renderGrid() {
  var grid = document.getElementById('grid');
  var html = '', count = 0;
  for (var i = 0; i < GAMES.length; i++) {
    var g = GAMES[i];
    if (currentFilter !== 'all' && g[3] !== currentFilter && !(currentFilter==='classic'&&(g[3]==='viral'||g[3]==='hot'))) continue;
    if (searchQuery && !g[1].includes(searchQuery) && !g[2].toLowerCase().includes(searchQuery)) continue;
    count++;
    html += '<div class="card" onclick="openGame(\''+g[0]+'\',\''+g[1]+' '+g[2]+'\')"><div class="card-icon">'+g[1]+'</div><div class="card-body"><h3>'+g[2]+'</h3><p>'+g[4]+'</p><span class="card-tag '+(TAG_CLASSES[g[3]]||'tag-hot')+'">'+g[4]+'</span></div></div>';
  }
  grid.innerHTML = html || '<div style="text-align:center;padding:40px;color:#666;grid-column:1/-1">没有匹配的游戏</div>';
  document.getElementById('count').textContent = count;
}

function openGame(file, title) {
  document.getElementById('viewer').classList.add('active');
  document.getElementById('gameFrame').src = file + '.html';
  document.getElementById('viewerTitle').textContent = title;
}

function closeGame() {
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('gameFrame').src = '';
}

renderGrid();
</script>
</body>
</html>

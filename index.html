var CAT_GRAD={puzzle:'g-puzzle',action:'g-action',arcade:'g-arcade',sport:'g-sport',casino:'g-casino',creative:'g-creative',music:'g-music',classic:'g-classic',viral:'g-viral',hot:'g-hot'};
var CAT_TAG={puzzle:'tag-puzzle',action:'tag-action',arcade:'tag-arcade',sport:'tag-sport',casino:'tag-casino',creative:'tag-creative',music:'tag-music',classic:'tag-classic',viral:'tag-hot',hot:'tag-hot'};
var CAT_LBL={puzzle:'🧠 益智',action:'⚡ 动作',arcade:'🕹️ 街机',sport:'⚽ 体育',casino:'🎰 博牌',creative:'🎨 创作',music:'🎵 音乐',classic:'🏆 经典',viral:'🔥 热门',hot:'🔥 热门'};
var CAT_ORDER=['puzzle','action','arcade','sport','casino','creative','music','classic','hot'];
var CO={};GAMES.forEach(function(g){CO[g[3]]=(CO[g[3]]||0)+1;});
var curCat='all',curQ='',curIdx=-1,favOnly=false;
var PLAYS={};try{PLAYS=JSON.parse(localStorage.getItem('gamePlays'))||{}}catch(e){}

// Category buttons
function buildCats(){
  var h='<button class="cat-btn active" onclick="setCat(\'all\')">🏠 全部 <span class="cnt">'+GAMES.length+'</span></button>';
  CAT_ORDER.forEach(function(c){if(CO[c])h+='<button class="cat-btn" onclick="setCat(\''+c+'\')">'+CAT_LBL[c]+' <span class="cnt">'+CO[c]+'</span></button>';});
  document.getElementById('catBar').innerHTML=h;
}
buildCats();

function setCat(c){curCat=c;document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.toggle('active',b.textContent.includes(c)||(c==='all'&&b.textContent.includes('全部')));});render();}
function onSearch(){curQ=document.getElementById('searchBox').value.toLowerCase();render();}

function toggleFavFilter(){
  favOnly=!favOnly;
  document.getElementById('favFilterBtn').classList.toggle('active',favOnly);
  render();
}

function render(){
  var g=document.getElementById('grid'),h='',n=0;
  var shown=GAMES.filter(function(a){
    if(favOnly&&!FAVS[a[0]])return false;
    return (curCat==='all'||a[3]===curCat)&&(!curQ||a[2].toLowerCase().includes(curQ)||a[1].includes(curQ));
  });
  shown.forEach(function(a){
    n++;var _=CAT_GRAD[a[3]]||'g-default',t=CAT_TAG[a[3]]||'tag-hot';
    var faved=FAVS[a[0]]?'active':'';
    h+='<div class="card"><div class="card-cover '+_+'"><span class="icon">'+a[1]+'</span></div><span class="fav-star '+faved+'" onclick="event.stopPropagation();toggleFav(\''+a[0]+'\')" data-game="'+a[0]+'">'+'⭐'+'</span><div class="card-body" onclick="openGame(\''+a[0]+'\',\''+a[1]+' '+a[2]+'\')"><h3>'+a[2]+'</h3><p>'+a[4]+'</p><span class="card-tag '+t+'">'+a[4]+'</span></div></div>';
  });
  g.innerHTML=h||'<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1">没有匹配的游戏</div>';
  document.getElementById('totalCount').textContent=n;
  updateFavCount();
}

// ===== FAVORITES =====
function toggleFav(f){
  if(FAVS[f]){delete FAVS[f];}else{FAVS[f]=1;}
  saveFavs();
  // Update star visual
  var stars=document.querySelectorAll('.fav-star[data-game="'+f+'"]');
  stars.forEach(function(s){s.classList.toggle('active',!!FAVS[f]);});
  updateFavCount();
}
function toggleFavCurrent(){
  if(curIdx<0)return;
  var g=GAMES[curIdx];
  toggleFav(g[0]);
  document.getElementById('viewerFavBtn').textContent=FAVS[g[0]]?'★':'☆';
}
function updateFavCount(){
  var c=Object.keys(FAVS).length;
  document.querySelector('#favCount b').textContent=c;
}

// ===== GAME VIEWER + TIMER =====
var timerInterval=null,timerSeconds=0;

function openGame(f,t){
  curIdx=-1;GAMES.some(function(g,i){if(g[0]===f){curIdx=i;return true;}});
  PLAYS[f]=(PLAYS[f]||0)+1;try{localStorage.setItem('gamePlays',JSON.stringify(PLAYS))}catch(e){}
  document.getElementById('viewer').classList.add('active');
  document.getElementById('gameFrame').src='';
  document.getElementById('loading').classList.add('show');
  document.getElementById('viewerTitle').textContent=t;
  document.getElementById('viewerFavBtn').textContent=FAVS[f]?'★':'☆';
  // Start timer
  timerSeconds=0;
  if(timerInterval)clearInterval(timerInterval);
  updateTimerDisplay();
  timerInterval=setInterval(function(){timerSeconds++;updateTimerDisplay();},1000);
  setTimeout(function(){document.getElementById('gameFrame').src=f+'.html';},100);
}
function closeGame(){
  // Save best time before clearing index
  if(curIdx>=0&&timerSeconds>0){
    var gid=GAMES[curIdx][0];
    if(!BEST[gid]||timerSeconds<BEST[gid]){BEST[gid]=timerSeconds;}
    TCNT[gid]=(TCNT[gid]||0)+1;
    saveTimes();
  }
  document.getElementById('viewer').classList.remove('active');
  document.getElementById('gameFrame').src='';curIdx=-1;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
}
function onFrameLoad(){document.getElementById('loading').classList.remove('show');}
function updateTimerDisplay(){
  var m=Math.floor(timerSeconds/60),s=timerSeconds%60;
  document.getElementById('timerBadge').textContent='🕒 '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ===== KEYBOARD =====
document.addEventListener('keydown',function(e){
  if(curIdx===-1)return;
  if(e.key==='Escape'){closeGame();e.preventDefault();}
  if(e.key==='ArrowLeft'){e.preventDefault();navGame(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();navGame(1);}
});
function navGame(dir){
  curIdx=(curIdx+dir+GAMES.length)%GAMES.length;
  var g=GAMES[curIdx];
  document.getElementById('gameFrame').src='';
  document.getElementById('loading').classList.add('show');
  document.getElementById('viewerTitle').textContent=g[1]+' '+g[2];
  document.getElementById('viewerFavBtn').textContent=FAVS[g[0]]?'★':'☆';
  timerSeconds=0;
  setTimeout(function(){document.getElementById('gameFrame').src=g[0]+'.html';},100);
}

// ===== RANDOM =====
function randomGame(){var g=GAMES[Math.floor(Math.random()*GAMES.length)];openGame(g[0],g[1]+' '+g[2]);}

// ===== RANKING =====
function showRanking(){
  var sorted=GAMES.slice().sort(function(a,b){return (PLAYS[b[0]]||0)-(PLAYS[a[0]]||0);});
  var top=sorted.slice(0,20);
  var h='<div class="ranking-box"><h2>🔥 热度排行</h2><p style="text-align:center;font-size:.6em;color:var(--text2);margin-bottom:6px">游玩次数 · 最佳用时</p>';
  top.forEach(function(g,i){
    var rank=i+1,plays=PLAYS[g[0]]||0;
    var medal=rank<=3?['🥇','🥈','🥉'][rank-1]:rank+'.';
    var cls=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'';
    var best=BEST[g[0]];var bestStr=best?Math.floor(best/60)+':'+String(best%60).padStart(2,'0'):'--';
    h+='<div class="rank-item"><span class="rank-num '+cls+'">'+medal+'</span><span class="rank-info"><span class="rn">'+g[1]+' '+g[2]+'</span><span class="rc">'+plays+'次 · 最快 '+bestStr+'</span></span><button class="rank-play" onclick="closeRanking();openGame(\''+g[0]+'\',\''+g[1]+' '+g[2]+'\')">▶</button></div>';
  });
  h+='<div style="text-align:center;margin-top:6px"><button class="action-btn" onclick="closeRanking()">关闭</button></div></div>';
  var el=document.getElementById('ranking');el.innerHTML=h;el.classList.add('active');
}
function closeRanking(){document.getElementById('ranking').classList.remove('active');}

// ===== SHARE =====
function shareWeibo(){
  if(curIdx<0)return;
  var g=GAMES[curIdx];
  var u=encodeURIComponent('https://vip-881.github.io/hot-h5-games/');
  var t=encodeURIComponent('🎮 我在玩「'+g[1]+' '+g[2]+'」- 165款免费H5游戏合集！');
  window.open('https://service.weibo.com/share/share.php?title='+t+'&url='+u,'_blank','width=600,height=500');
}

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(function(r){
      console.log('SW registered:',r.scope);
    }).catch(function(e){
      console.log('SW failed:',e);
    });
  });
}

// ===== INIT =====
render();
</script>

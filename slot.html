<h1>🎰 老虎机</h1>
<div class="stats">
  <span>💰 <b id="coins">500</b></span>
  <span>🎰 <b id="bet">10</b></span>
  <span>🏆 <b id="best">500</b></span>
</div>
<div class="machine">
  <div class="reels">
    <div class="reel"><span id="r0">🍒</span></div>
    <div class="reel"><span id="r1">🍒</span></div>
    <div class="reel"><span id="r2">🍒</span></div>
  </div>
  <div class="payline" id="payline">试试手气!</div>
  <button class="btn" id="spinBtn" onclick="spin()">🎰 旋转!</button>
</div>
<div class="history" id="history"></div>
<script>
const SYMBOLS=['🍒','🍋','🍊','🍇','💎','7️⃣','🔔','⭐'];
const PAYOUT={0:[1,3,10],1:[1,5,15],2:[1,5,20],3:[1,8,25],4:[2,15,50],5:[3,25,100],6:[2,10,30],7:[1,8,40]};
let coins=500,bet=10,best=500,spinning=false,results=[];
try{const c=parseInt(localStorage.getItem('slot_coins'));if(c)coins=c;best=Math.max(coins,parseInt(localStorage.getItem('slot_best'))||500);document.getElementById('best').textContent=best}catch(e){}

function spin(){
  if(spinning||coins<bet)return;
  spinning=true;coins-=bet;
  document.getElementById('coins').textContent=coins;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('payline').textContent='旋转中...';
  const final=[Math.floor(Math.random()*8),Math.floor(Math.random()*8),Math.floor(Math.random()*8)];
  let tick=0;
  const interval=setInterval(()=>{
    tick++;
    document.getElementById('r0').textContent=SYMBOLS[Math.floor(Math.random()*8)];
    document.getElementById('r1').textContent=SYMBOLS[Math.floor(Math.random()*8)];
    document.getElementById('r2').textContent=SYMBOLS[Math.floor(Math.random()*8)];
    if(tick>=15){clearInterval(interval);
      document.getElementById('r0').textContent=SYMBOLS[final[0]];
      document.getElementById('r1').textContent=SYMBOLS[final[1]];
      document.getElementById('r2').textContent=SYMBOLS[final[2]];
      setTimeout(()=>resolve(final),300);
    }
  },80);
}
function resolve(final){
  const[r0,r1,r2]=final;
  let win=0,msg='';
  if(r0===r1&&r1===r2){
    win=bet*PAYOUT[r0][2];
    msg=`三连${SYMBOLS[r0]}! +${win}`;
  }else if(r0===r1||r1===r2){
    const r=r0===r1?r0:r1;
    win=bet*PAYOUT[r][1];
    msg=`一对${SYMBOLS[r]}! +${win}`;
  }else if(r0===r2){
    win=bet*PAYOUT[r0][1];
    msg=`对角${SYMBOLS[r0]}! +${win}`;
  }else{
    msg='再试试!';
  }
  coins+=win;
  if(coins>best){best=coins;document.getElementById('best').textContent=best;try{localStorage.setItem('slot_best',best)}catch(e){}}
  try{localStorage.setItem('slot_coins',coins)}catch(e){}
  document.getElementById('coins').textContent=coins;
  document.getElementById('payline').textContent=msg;
  document.getElementById('spinBtn').disabled=false;
  spinning=false;
  results.unshift({final,win,msg});
  if(results.length>5)results.pop();
  const h=document.getElementById('history');h.innerHTML='';
  results.forEach(r=>{
    const s=document.createElement('span');
    if(r.win>0)s.classList.add('win');
    s.textContent=r.msg;h.appendChild(s);
  });
  if(coins<=0){document.getElementById('payline').textContent='💸 没钱了! 刷新重来'}
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏐 沙滩排球 - 热门H5游戏</title>
<meta name="description" content="沙滩排球体育游戏，滑动控制球员接球和扣球，与AI对手沙滩排球对战免费在线">
<meta property="og:title" content="🏐 沙滩排球 - 热门H5游戏"><meta property="og:description" content="滑动接球扣球，沙滩排球对决"><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"沙滩排球","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#fdcb6e,#f39c12);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#2d3436;user-select:none;-webkit-user-select:none;touch-action:none}h1{font-size:1.6em;margin:4px 0}.stats{display:flex;gap:12px;margin:6px 0 8px}.stats span{background:rgba(0,0,0,0.08);padding:4px 12px;border-radius:20px;font-size:0.9em;font-weight:600}canvas{display:block;border-radius:8px;max-width:96vw}</style>
</head>
<body>
<h1>🏐 沙滩排球</h1>
<div class="stats"><span>👤 <b id="ps">0</b></span><span>🤖 <b id="as">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="500"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=500,G=0.15;
let ball={x:W/2,y:200,vx:3,vy:-6,r:12},player={x:W/2,y:H-50,w:80},ai={x:W/2,y:50,w:70},ps=0,as=0,best=0,serving=true;
try{best=parseInt(localStorage.getItem('volley_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function resetBall(){ball={x:W/2,y:200,vx:(Math.random()>.5?1:-1)*3,vy:(Math.random()>.5?1:-1)*6,r:12};serving=true}
function update(){
  if(serving)return;ball.vx*=0.999;ball.vy+=G;ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x-ball.r<0||ball.x+ball.r>W)ball.vx*=-0.6;
  if(ball.y+ball.r>H-60&&ball.x>player.x&&ball.x<player.x+player.w){ball.y=H-60-ball.r;ball.vy=-Math.abs(ball.vy)-4;ball.vx+=(ball.x-player.x-player.w/2)*0.3}
  if(ball.y-ball.r<60&&ball.x>ai.x&&ball.x<ai.x+ai.w){ball.y=60+ball.r;ball.vy=Math.abs(ball.vy)+4;ball.vx+=(ball.x-ai.x-ai.w/2)*0.3}
  if(ball.y>H){as++;document.getElementById('as').textContent=as;resetBall()}
  if(ball.y<0){ps++;document.getElementById('ps').textContent=ps;resetBall()}
  if(ball.vy<0)ai.x+=(ball.x-ai.x-ai.w/2)*0.06;else ai.x+=(W/2-ai.x-ai.w/2)*0.02;
  ai.x=Math.max(0,Math.min(W-ai.w,ai.x))
}
function draw(){
  ctx.fillStyle='#fdcb6e';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f9e79f';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(0,H/2-20,W,4);
  // Net
  ctx.strokeStyle='#888';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,H/2-15);ctx.lineTo(W,H/2-15);ctx.stroke();
  for(let x=0;x<W;x+=12)ctx.fillRect(x,H/2-18,6,25),ctx.fillStyle='#999';
  // Players
  ctx.fillStyle='#e74c3c';ctx.fillRect(player.x+10,player.y-15,20,35);ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(player.x+player.w/2,player.y-20,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3498db';ctx.fillRect(ai.x+10,ai.y-15,20,35);ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(ai.x+ai.w/2,ai.y-20,12,0,Math.PI*2);ctx.fill();
  // Ball
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.stroke();
  if(serving)ctx.fillStyle='#000',ctx.font='16px sans-serif',ctx.textAlign='center',ctx.fillText('🏐 点击发球',W/2,H/2+20);
  ctx.fillStyle='#000';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText(`${ps}:${as}`,W/2,50);
}
c.addEventListener('mousemove',e=>{player.x=Math.max(0,Math.min(W-player.w,e.clientX-c.getBoundingClientRect().left-player.w/2))});
c.addEventListener('touchmove',e=>{e.preventDefault();player.x=Math.max(0,Math.min(W-player.w,e.touches[0].clientX-c.getBoundingClientRect().left-player.w/2))},{passive:false});
c.addEventListener('click',()=>{if(serving)serving=false});
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="description" content="精准投掷游戏，免费在线H5游戏，无需下载，手机电脑都能玩">
<meta property="og:title" content="🎯 飞镖大师 - 精准投掷游戏">
<meta property="og:description" content="精准投掷游戏，25款热门H5小游戏合集">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hot-h5-games.netlify.app/darts.html">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"精准投掷游戏","description":"精准投掷游戏，热门H5小游戏","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>

<title>🎯 飞镖大师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#2c1810,#1a0e08);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
h1{font-size:1.6em;margin:4px 0}
.stats{display:flex;gap:16px;margin:4px 0 8px}
.stats span{background:rgba(255,255,255,0.12);padding:5px 14px;border-radius:20px;font-size:0.95em}
canvas{display:block;border-radius:10px;max-width:96vw}
</style>
</head>
<body>
<h1>🎯 飞镖大师</h1>
<div class="stats"><span>⭐ <b id="score">301</b></span><span>🎯 <b id="darts">3</b></span><span>🏆 <b id="best">--</b></span></div>
<canvas id="c" width="360" height="400"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=400,CX=W/2,CY=190,RR=150;
let score=301,darts=3,best,bestDarts,round=1,aiming=false,aimX,aimY,wobble=0,gameover=false,lastHit=null;
try{best=parseInt(localStorage.getItem('darts_best'));bestDarts=parseInt(localStorage.getItem('darts_bestDarts'));document.getElementById('best').textContent=best?`${best}(剩${bestDarts}镖)`:'--'}catch(e){}

function getScore(dist,angle){
  const sectors=['20','1','18','4','13','6','10','15','2','17','3','19','7','16','8','11','14','9','12','5'];
  const norm=(angle+Math.PI*2)%(Math.PI*2);
  const sectorIdx=Math.floor((norm/(Math.PI*2))*20);
  const sector=parseInt(sectors[sectorIdx]);
  if(dist<RR*0.06)return 50;
  if(dist<RR*0.13)return 25;
  if(dist<RR*0.63)return sector;
  if(dist<RR*0.71)return sector*3;
  if(dist<RR*0.89)return sector;
  if(dist<RR*0.99)return sector*2;
  return 0;
}
function draw(){
  ctx.fillStyle='#2c1810';ctx.fillRect(0,0,W,H);
  const colors=['#000','#fff','#000','#fff','#000','#fff','#000','#fff','#000','#fff','#000','#fff','#000','#fff','#000','#fff','#000','#fff','#000','#fff'];
  for(let i=0;i<20;i++){
    const sa=(-Math.PI/2-Math.PI/20)+(i*Math.PI*2/20),ea=sa+Math.PI*2/20;
    ctx.fillStyle=colors[i];ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,RR,sa,ea);ctx.closePath();ctx.fill();
  }
  for(const[r,s,e] of[[RR*0.63,'#2ecc71','#27ae60'],[RR*0.71,'#e74c3c','#c0392b'],[RR*0.89,'#2ecc71','#27ae60'],[RR*0.99,'#e74c3c','#c0392b']]){
    ctx.strokeStyle=e;ctx.lineWidth=2;ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(CX,CY,RR*0.13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.arc(CX,CY,RR*0.06,0,Math.PI*2);ctx.fill();
  ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<20;i++){
    const a=-Math.PI/2+i*Math.PI*2/20,label=['20','1','18','4','13','6','10','15','2','17','3','19','7','16','8','11','14','9','12','5'];
    const r=RR*0.5;ctx.fillStyle='#fff';ctx.fillText(label[i],CX+Math.cos(a)*r,CY+Math.sin(a)*r);
  }
  ctx.fillStyle='#000';ctx.fillText('50',CX,CY-RR*0.03);
  ctx.fillText('25',CX,CY+RR*0.03);
  if(aiming){
    const wx=aimX+Math.sin(wobble)*6,wy=aimY+Math.cos(wobble*1.3)*6;
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(wx,wy);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(wx,wy,4,0,Math.PI*2);ctx.fill();
  }
  if(lastHit&&lastHit.t>0){
    ctx.fillStyle=`rgba(255,255,0,${lastHit.t/30})`;ctx.beginPath();ctx.arc(lastHit.x,lastHit.y,5,0,Math.PI*2);ctx.fill();
    lastHit.t--;
  }
}
function throwDart(tx,ty){
  if(gameover||darts<=0)return;
  const dx=tx-CX,dy=ty-CY,dist=Math.sqrt(dx*dx+dy*dy),angle=Math.atan2(dy,dx);
  const s=getScore(dist,angle);
  darts--;lastHit={x:tx,y:ty,t:30};
  if(dist<RR){
    score-=s;
    if(score<0){score+=s;draw();document.getElementById('score').textContent=score;document.getElementById('darts').textContent=darts;return}
  }
  document.getElementById('score').textContent=score;document.getElementById('darts').textContent=darts;
  if(score===0&&darts===0){win();return}
  if(darts===0){round++;darts=3;document.getElementById('darts').textContent='3'}
  if(score<0){score+=s;document.getElementById('score').textContent=score}
}
function win(){
  gameover=true;
  if(!best||round<best||(round===best&&darts>bestDarts)){best=round;bestDarts=3-darts;try{localStorage.setItem('darts_best',best);localStorage.setItem('darts_bestDarts',bestDarts)}catch(e){};document.getElementById('best').textContent=`${best}轮`}
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
  ctx.fillText('🎯 BULLSEYE!',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillText(`${round}轮完成  点击重新开始`,W/2,H/2+20);
}
c.addEventListener('mousemove',e=>{if(aiming){const r=c.getBoundingClientRect();aimX=e.clientX-r.left;aimY=e.clientY-r.top}});
c.addEventListener('mousedown',e=>{const r=c.getBoundingClientRect();aimX=e.clientX-r.left;aimY=e.clientY-r.top;aiming=true;wobble=0});
c.addEventListener('mouseup',e=>{if(aiming){aiming=false;throwDart(aimX,aimY)}});
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();aimX=e.touches[0].clientX-r.left;aimY=e.touches[0].clientY-r.top;aiming=true;wobble=0});
c.addEventListener('touchmove',e=>{e.preventDefault();if(aiming){const r=c.getBoundingClientRect();aimX=e.touches[0].clientX-r.left;aimY=e.touches[0].clientY-r.top}});
c.addEventListener('touchend',e=>{if(aiming){aiming=false;throwDart(aimX,aimY)}});
c.addEventListener('click',e=>{if(gameover)restart()});
function restart(){score=301;darts=3;round=1;gameover=false;lastHit=null;document.getElementById('score').textContent='301';document.getElementById('darts').textContent='3'}
let wobbleId=setInterval(()=>{if(!gameover)wobble+=0.15},16);
function loop(){draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>

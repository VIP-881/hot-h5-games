<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🔢 猜数字 - 热门H5游戏</title>
<meta name="description" content="猜数字经典逻辑推理游戏，系统随机生成4位数字你猜，反馈几A几B提示直到猜对免费在线">
<meta property="og:title" content="🔢 猜数字 - 热门H5游戏"><meta property="og:description" content="猜4位数字，A表示位置对B表示数字对"><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"猜数字","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff}h1{font-size:1.6em;margin:4px 0}.stats{display:flex;gap:12px;margin:6px 0 8px}.stats span{background:rgba(255,255,255,0.12);padding:4px 12px;border-radius:20px;font-size:0.9em}.board{max-width:360px;width:95vw}.input-row{display:flex;gap:8px;margin:6px 0}.digit{width:54px;height:54px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;text-align:center;font-size:1.4em;color:#fff;font-weight:bold}.hint{color:#ffd700;min-width:60px;text-align:center;font-size:0.9em}.history{max-height:300px;overflow-y:auto;margin:10px 0}.hist-row{display:flex;gap:8px;margin:3px 0;align-items:center}.hist-num{background:rgba(255,255,255,0.06);padding:4px 8px;border-radius:6px;font-size:1em}.hist-hint{color:#2ecc71;font-size:0.9em}.btn{padding:10px 24px;border-radius:20px;background:rgba(100,150,255,0.25);color:#8cf;border:1px solid #8cf;font-size:0.9em;cursor:pointer}</style>
</head>
<body>
<h1>🔢 猜数字</h1>
<div class="stats"><span>🎯 <b id="tries">0</b></span><span>🏆 <b id="best">--</b></span></div>
<div class="board">
  <div class="input-row"><input class="digit" id="d0" maxlength="1" pattern="[0-9]"><input class="digit" id="d1" maxlength="1"><input class="digit" id="d2" maxlength="1"><input class="digit" id="d3" maxlength="1"></div>
  <button class="btn" onclick="guess()">🎯 猜测</button><button class="btn" onclick="newGame()">🔄 新游戏</button>
  <div class="history" id="history"></div>
</div>
<script>
let secret='',tries=0,best,history=[];
try{best=parseInt(localStorage.getItem('bulls_best'))||0;document.getElementById('best').textContent=best?`${best}次`:'--'}catch(e){}
function genSecret(){let d='';while(d.length<4){const n=Math.floor(Math.random()*10);if(!d.includes(''+n))d+=n}return d}
function guess(){
  const gs=[d0.value,d1.value,d2.value,d3.value].join('');if(gs.length!==4||new Set(gs).size!==4)return;
  tries++;document.getElementById('tries').textContent=tries;
  let a=0,b=0;for(let i=0;i<4;i++){if(gs[i]===secret[i])a++;else if(secret.includes(gs[i]))b++}
  history.unshift({guess:gs,a,b});
  document.getElementById('history').innerHTML=history.map(h=>`<div class="hist-row"><span class="hist-num">${h.guess}</span><span class="hist-hint">${h.a}A${h.b}B</span></div>`).join('');
  if(a===4){if(!best||tries<best){best=tries;document.getElementById('best').textContent=`${best}次`;try{localStorage.setItem('bulls_best',best)}catch(e){}}setTimeout(()=>alert(`🎉 猜对了! ${tries}次`),100)}
}
function newGame(){secret=genSecret();tries=0;history=[];document.getElementById('tries').textContent='0';document.getElementById('history').innerHTML='';d0.value=d1.value=d2.value=d3.value=''}
newGame();
</script>
</body>
</html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a14;color:#e0e0e0;min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(139,92,246,.2);padding:8px 12px;display:flex;align-items:center;gap:8px}
nav a{color:#a78bfa;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:12px;background:rgba(139,92,246,.1);transition:.3s}
nav a:hover{background:rgba(139,92,246,.2)}
header{text-align:center;padding:20px;background:linear-gradient(180deg,rgba(139,92,246,.05),transparent)}
header h1{font-size:1.6em;background:linear-gradient(135deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.container{max-width:700px;margin:16px auto;padding:0 16px}
.hud{display:flex;justify-content:center;gap:20px;padding:10px;flex-wrap:wrap}
.hud-item{text-align:center}.hud-item .val{font-size:20px;font-weight:700}.hud-item .lbl{font-size:9px;color:#666}
.pipeline{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0;min-height:80px}
.node{width:70px;height:70px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;background:rgba(20,20,35,.9);border:2px solid rgba(255,255,255,.1);transition:all .3s;cursor:pointer;position:relative}
.node:hover{border-color:rgba(139,92,246,.5);transform:scale(1.08)}
.node.selected{border-color:#a78bfa;box-shadow:0 0 20px rgba(139,92,246,.4)}
.node.matched{border-color:#4ade80;background:rgba(34,197,94,.08)}
.node .label{font-size:9px;color:#888;margin-top:2px}
.connector{font-size:24px;color:rgba(255,255,255,.1);min-width:30px;text-align:center}
.connector.wired{color:#4ade80;animation:flow 1s infinite}
@keyframes flow{0%,100%{opacity:.7}50%{opacity:1}}
.target-area{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.target-slot{width:130px;height:70px;border:2px dashed rgba(255,255,255,.1);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#666;transition:.3s;cursor:pointer}
.target-slot:hover{border-color:rgba(139,92,246,.3)}
.target-slot.filled{border-style:solid;border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.05);color:#4ade80}
.match-hint{text-align:center;font-size:13px;color:#888;margin:8px 0;min-height:24px}
.feedback{text-align:center;font-size:14px;min-height:20px;margin:8px 0}
.controls{text-align:center;margin:12px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.controls button{padding:10px 20px;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:.3s}
.btn-next{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff}
.btn-next:hover:not(:disabled){box-shadow:0 4px 15px rgba(139,92,246,.4)}
.btn-next:disabled{opacity:.3;cursor:not-allowed}
.btn-reset{background:rgba(255,255,255,.06);color:#888}
.result-overlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#1a1a2e,#2a1a3e);border:2px solid rgba(139,92,246,.3);border-radius:20px;padding:32px;text-align:center;z-index:200;display:none}
.result-overlay h2{font-size:28px;margin-bottom:12px}
.result-overlay button{margin-top:16px;padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:16px;cursor:pointer}
footer{text-align:center;padding:16px;color:#444;font-size:11px}

<body>
<nav><a href="index.html">← 大厅</a><span>🔗 Pipeline Puzzle</span></nav>
<header><h1>🔗 API Pipeline Puzzle</h1><p>匹配数据源到正确目标 · 训练系统架构思维</p></header>
<div class="container">
  <div class="hud">
    <div class="hud-item"><div class="val" id="hScore" style="color:#fbbf24">0</div><div class="lbl">⭐ 分</div></div>
    <div class="hud-item"><div class="val" id="hLevel" style="color:#06b6d4">1/18</div><div class="lbl">🔗 关</div></div>
    <div class="hud-item"><div class="val" id="hCombo" style="color:#4ade80">x1</div><div class="lbl">🔥 连击</div></div>
  </div>
  <div style="text-align:center;font-size:12px;color:#a78bfa;margin:8px 0">点击左侧数据源，再点击右侧目标建立连接</div>
  <div class="pipeline" id="sources"></div>
  <div style="text-align:center;color:#666;margin:8px 0">⬇ 匹配 ⬇</div>
  <div class="target-area" id="targets"></div>
  <div class="match-hint" id="hint">点击两侧建立管道连接</div>
  <div class="feedback" id="feedback"></div>
  <div class="controls">
    <button class="btn-next" id="nextBtn" onclick="checkAndNext()" disabled>✅ 确认匹配</button>
    <button class="btn-reset" onclick="resetLevel()">🔄 重置</button>
  </div>
</div>
<div class="result-overlay" id="overlay"><h2 id="overlayTitle"></h2><p id="overlayDesc" style="color:#888"></p><button id="overlayBtn">🔄 重新开始</button></div>
<footer>Powered by Maton.ai · Pipeline 思维训练 · 🦊 灵犀出品</footer>
<script>
const LEVELS=[
  {hint:'基础数据流',sources:[{e:'📧',l:'Gmail',id:'gmail'},{e:'📝',l:'Notion',id:'notion'}],targets:[{l:'文档存储',s:'notion'},{l:'邮件发送',s:'gmail'}]},
  {hint:'自动化归档',sources:[{e:'📧',l:'Gmail收件',id:'gmail'},{e:'📅',l:'Google日历',id:'gcal'},{e:'✅',l:'Notion任务',id:'notion'}],targets:[{l:'每日待办',s:'notion'},{l:'邮件归档',s:'gmail'},{l:'会议提醒',s:'gcal'}]},
  {hint:'开发者工具链',sources:[{e:'🐙',l:'GitHub',id:'gh'},{e:'🔥',l:'Firebase',id:'fb'},{e:'🚀',l:'Netlify',id:'ntl'}],targets:[{l:'实时数据库',s:'fb'},{l:'代码托管',s:'gh'},{l:'静态部署',s:'ntl'}]},
  {hint:'数据聚合',sources:[{e:'📊',l:'Airtable',id:'air'},{e:'📋',l:'Trello',id:'trello'},{e:'💬',l:'Slack',id:'slack'}],targets:[{l:'看板管理',s:'trello'},{l:'电子表格',s:'air'},{l:'团队消息',s:'slack'}]},
  {hint:'客户管理',sources:[{e:'💼',l:'HubSpot',id:'hs'},{e:'💰',l:'Stripe',id:'stripe'},{e:'👤',l:'LinkedIn',id:'li'}],targets:[{l:'支付处理',s:'stripe'},{l:'人脉网络',s:'li'},{l:'CRM管理',s:'hs'}]},
  {hint:'多媒体管道',sources:[{e:'📺',l:'YouTube',id:'yt'},{e:'📹',l:'Zoom',id:'zoom'},{e:'✈️',l:'Telegram',id:'tg'}],targets:[{l:'视频会议',s:'zoom'},{l:'消息推送',s:'tg'},{l:'视频发布',s:'yt'}]},
  {hint:'FULL STACK',sources:[{e:'🐙',l:'GitHub',id:'gh'},{e:'🔥',l:'Firebase',id:'fb'},{e:'📝',l:'Notion',id:'notion'},{e:'🚀',l:'Netlify',id:'ntl'}],targets:[{l:'代码仓库',s:'gh'},{l:'实时存储',s:'fb'},{l:'文档协作',s:'notion'},{l:'前端部署',s:'ntl'}]},
];

let score=0,combo=0,level=0,selectedSource=null,matches={},pipes={};

function renderLevel(){
  if(level>=LEVELS.length){endGame();return}
  const l=LEVELS[level];
  selectedSource=null;matches={};pipes={};
  document.getElementById('hLevel').textContent=(level+1)+'/'+LEVELS.length;
  document.getElementById('hint').textContent='💡 '+l.hint;
  document.getElementById('nextBtn').disabled=true;

  // Shuffle sources and targets
  const srcs=[...l.sources].sort(()=>Math.random()-.5);
  const tgts=[...l.targets].sort(()=>Math.random()-.5);

  document.getElementById('sources').innerHTML=srcs.map((s,i)=>'<div class="node" id="src-'+i+'" data-id="'+s.id+'" onclick="selectSource(\''+s.id+'\',\'src-'+i+'\')"><span>'+s.e+'</span><span class="label">'+s.l+'</span></div>').join('<div class="connector" id="conn-'+Math.random()+'">→</div>');
  document.getElementById('targets').innerHTML=tgts.map((t,i)=>'<div class="target-slot" id="tgt-'+i+'" data-id="'+t.s+'" onclick="matchTarget(\''+t.s+'\',\'tgt-'+i+'\')"><span>'+t.l+'</span></div>').join('');
  document.getElementById('feedback').textContent='';
}

function selectSource(id,elId){
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  if(selectedSource===id){selectedSource=null;return}
  selectedSource=id;
  document.getElementById(elId).classList.add('selected');
}

function matchTarget(targetId,elId){
  if(!selectedSource) return;
  matches[selectedSource]=targetId;
  document.getElementById(elId).classList.add('filled');
  document.getElementById(elId).textContent='🔗 '+LEVELS[level].targets.find(t=>t.s===targetId)?.l||targetId;
  // Mark source as matched
  document.querySelectorAll('.node').forEach(n=>{if(n.dataset.id===selectedSource)n.classList.add('matched')});
  selectedSource=null;
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  // Check if all matched
  const allMatched=LEVELS[level].sources.every(s=>matches[s.id]);
  document.getElementById('nextBtn').disabled=!allMatched;
}

function resetLevel(){
  selectedSource=null;matches={};
  document.getElementById('nextBtn').disabled=true;
  renderLevel();
}

function checkAndNext(){
  const l=LEVELS[level];
  let allCorrect=true;
  l.sources.forEach(s=>{if(matches[s.id]!==l.targets.find(t=>t.s===s.id)?.s)allCorrect=false});
  if(allCorrect){combo++;score+=100+combo*20;document.getElementById('feedback').innerHTML='<span style="color:#4ade80">✅ 管道接通！+'+(100+combo*20)+' 分</span>'}else{combo=0;document.getElementById('feedback').innerHTML='<span style="color:#f87171">❌ 部分管道接错了！</span>'}
  updateHUD();
  setTimeout(()=>{level++;renderLevel()},1000);
}

function updateHUD(){document.getElementById('hScore').textContent=score;document.getElementById('hCombo').textContent='x'+(combo+1)}

function endGame(){
  document.getElementById('overlay').style.display='block';
  document.getElementById('overlayTitle').textContent='🏆 '+score+' 分';
  document.getElementById('overlayTitle').style.color='#fbbf24';
  document.getElementById('overlayDesc').textContent=LEVELS.length+' 关全部完成 · 最大连击 x'+(Math.max(1,combo+1));
  document.getElementById('overlayBtn').onclick=()=>{document.getElementById('overlay').style.display='none';score=0;combo=0;level=0;renderLevel()}
}

renderLevel();
</script>
</body>
</html>

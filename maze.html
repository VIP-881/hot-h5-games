<body>
<h1>🧲 磁铁迷宫</h1>
<div class="stats"><span>⭐ <b id="level">1</b></span><span>⏱ <b id="timer">0</b>s</span><span>🏆 <b id="best">--</b>s</span></div>
<canvas id="c" width="340" height="400"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=340,H=400,M=6;
let ball={x:30,y:30,r:8},goal={x:0,y:0},holes=[],walls=[],level=1,startTime,timerInterval,elapsed=0,bestTime,gameover=false;
try{bestTime=parseInt(localStorage.getItem('maze_best'))||0;document.getElementById('best').textContent=bestTime?`${bestTime}s`:'--s'}catch(e){}

const LEVELS=[
  {start:[30,30],goal:[310,370],walls:[[100,0,10,200],[200,200,10,200]],holes:[[150,100],[250,300]]},
  {start:[30,370],goal:[310,30],walls:[[80,80,10,250],[160,0,10,180],[240,180,10,220]],holes:[[120,200],[280,100]]},
  {start:[30,30],goal:[310,370],walls:[[60,60,10,280],[130,60,10,100],[130,240,10,100],[200,60,10,100],[200,240,10,100],[270,60,10,280]],holes:[[95,200],[165,170],[235,170],[305,200]]},
  {start:[170,30],goal:[170,370],walls:[[40,60,260,10],[40,60,10,300],[290,60,10,200],[100,150,140,10],[40,250,10,110],[290,250,10,110],[100,340,140,10]],holes:[[80,120],[260,120],[80,300],[260,300]]},
];
function loadLevel(l){
  const lv=LEVELS[l-1];
  ball={x:lv.start[0],y:lv.start[1],r:8};
  goal={x:lv.goal[0],y:lv.goal[1]};
  walls=lv.walls.map(w=>({x:w[0],y:w[1],w:w[2],h:w[3]}));
  holes=lv.holes.map(h=>({x:h[0],y:h[1],r:10}));
  document.getElementById('level').textContent=l;
  elapsed=0;document.getElementById('timer').textContent='0';
  clearInterval(timerInterval);startTime=null;
}
function update(){
  if(gameover)return;
  if(!startTime){startTime=Date.now();timerInterval=setInterval(()=>{elapsed=Math.floor((Date.now()-startTime)/1000);document.getElementById('timer').textContent=elapsed},200)}
  for(const w of walls){if(ball.x+ball.r>w.x&&ball.x-ball.r<w.x+w.w&&ball.y+ball.r>w.y&&ball.y-ball.r<w.y+w.h){gameover=true;clearInterval(timerInterval);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff4757';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('碰到墙壁!',W/2,H/2-10);ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('点击重新开始',W/2,H/2+20);return}}
  for(const h of holes){const dx=ball.x-h.x,dy=ball.y-h.y;if(Math.sqrt(dx*dx+dy*dy)<ball.r+h.r){gameover=true;clearInterval(timerInterval);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff4757';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('掉进陷阱!',W/2,H/2-10);ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('点击重新开始',W/2,H/2+20);return}}
  const dx=ball.x-goal.x,dy=ball.y-goal.y;if(Math.sqrt(dx*dx+dy*dy)<ball.r+14){clearInterval(timerInterval);if(!bestTime||elapsed<bestTime){bestTime=elapsed;document.getElementById('best').textContent=`${bestTime}s`;try{localStorage.setItem('maze_best',bestTime)}catch(e){}}if(level<4){level++;loadLevel(level);gameover=false;startTime=null}else{gameover=true;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2ed573';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('🎉 全部通关!',W/2,H/2-15);ctx.font='14px sans-serif';ctx.fillText(`${elapsed}s  点击重新开始`,W/2,H/2+20);return}}
  ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));ball.y=Math.max(ball.r,Math.min(H-ball.r,ball.y))
}
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  walls.forEach(w=>{const g=ctx.createLinearGradient(w.x,w.y,w.x+w.w,w.y+w.h);g.addColorStop(0,'#636e72');g.addColorStop(1,'#2d3436');ctx.fillStyle=g;ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle='#b2bec3';ctx.lineWidth=1;ctx.strokeRect(w.x,w.y,w.w,w.h)});
  holes.forEach(h=>{ctx.fillStyle='#000';ctx.shadowColor='#000';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
  ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(goal.x,goal.y,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('🏁',goal.x,goal.y+4);
  ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();ball.x+=(e.clientX-r.left-ball.x)*0.15;ball.y+=(e.clientY-r.top-ball.y)*0.15});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();ball.x+=(e.touches[0].clientX-r.left-ball.x)*0.15;ball.y+=(e.touches[0].clientY-r.top-ball.y)*0.15},{passive:false});
c.addEventListener('click',()=>{if(gameover)restart()});
function restart(){level=1;gameover=false;clearInterval(timerInterval);startTime=null;document.getElementById('level').textContent='1';loadLevel(1)}
function loop(){update();if(!gameover)draw();requestAnimationFrame(loop)}
loadLevel(1);loop();
</script>

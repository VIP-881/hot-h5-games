<nav><a href="index.html">← 大厅</a><span>🎲 猜数字 × 天气</span></nav>
<div class="container">
  <div class="weather-card">
    <div class="city" id="city">加载天气...</div>
    <div class="temp" id="temp">--°</div>
    <div class="condition" id="cond"></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="game-card">
    <h2>🎲 猜猜今天的神秘数字</h2>
    <div class="range" id="range">范围: 1 - 100</div>
    <div class="input-area">
      <input type="number" id="guess" min="1" max="100" placeholder="?" onkeydown="if(event.key==='Enter')guess()">
      <button onclick="guess()">猜！</button>
    </div>
    <div class="result" id="result"></div>
    <div class="history" id="history"></div>
    <div class="score-board">
      <div class="score-item win"><div class="val" id="wins">0</div><div class="lbl">🏆 胜利</div></div>
      <div class="score-item best"><div class="val" id="best">-</div><div class="lbl">🥇 最佳</div></div>
      <div class="score-item"><div class="val" id="attempts" style="color:#a78bfa">0</div><div class="lbl">🎯 本次</div></div>
    </div>
    <div class="btn-row">
      <button class="btn-new" onclick="newGame()">🔄 新游戏</button>
      <button class="btn-loc" onclick="loadWeather()">📍 刷新天气</button>
    </div>
  </div>

<script>
let secret=0, attempts=0, minR=1, maxR=100, guesses=[];
let wins=parseInt(localStorage.getItem('guessWins')||'0'),best=parseInt(localStorage.getItem('guessBest')||'0');
document.getElementById('wins').textContent=wins;
document.getElementById('best').textContent=best||'-';

async function loadWeather(){
  document.getElementById('city').textContent='加载中...';
  try{
    const r=await fetch('https://wttr.in/Shanghai?format=j1');
    const d=await r.json();
    const c=d.current_condition[0];
    const t=parseInt(c.temp_C);
    const h=parseInt(c.humidity);
    const cond=c.weatherDesc[0].value;
    document.getElementById('city').textContent='📍 上海';
    document.getElementById('temp').textContent=t+'°C';
    document.getElementById('cond').textContent=cond+' · 湿度 '+h+'%';
    // Weather defines the range
    minR=Math.max(1,t-10);
    maxR=Math.min(100,t+20);
    document.getElementById('range').textContent='范围: '+minR+' - '+maxR;
    document.getElementById('hint').innerHTML='🌡 气温='+t+'°C → 范围 ['+minR+','+maxR+']<br>💧 湿度='+h+'% → '+(h>70?'数字偏大':h<40?'数字偏小':'正常');
    // Seed the number based on weather
    secret=Math.floor((t*7+h*3+c.winddirDegree/30)%(maxR-minR+1))+minR;
    secret=Math.max(1,Math.min(100,secret));
  }catch(e){
    document.getElementById('city').textContent='⚠️ 天气加载失败';
    document.getElementById('temp').textContent='--°';
    document.getElementById('hint').textContent='使用默认范围';
    newGame();
  }
}

function newGame(){
  if(secret===0){minR=1;maxR=100;secret=Math.floor(Math.random()*100)+1;document.getElementById('range').textContent='范围: 1 - 100'}
  attempts=0;guesses=[];
  document.getElementById('history').innerHTML='';
  document.getElementById('result').textContent='';
  document.getElementById('attempts').textContent='0';
  document.getElementById('guess').value='';
  document.getElementById('guess').focus();
}

function guess(){
  const v=parseInt(document.getElementById('guess').value);
  if(isNaN(v)||v<1||v>100){document.getElementById('result').textContent='⚠️ 请输入 1-100 的数字';return}
  if(secret===0)newGame();
  attempts++;guesses.push(v);
  document.getElementById('attempts').textContent=attempts;
  const h=document.getElementById('history');
  if(v===secret){
    h.innerHTML+='<span class="hit">'+v+' ✅</span>';
    document.getElementById('result').textContent='🎉 恭喜！答案就是 '+secret+'！用了 '+attempts+' 次';
    wins++;
    if(!best||attempts<best)best=attempts;
    localStorage.setItem('guessWins',wins);localStorage.setItem('guessBest',best);
    document.getElementById('wins').textContent=wins;document.getElementById('best').textContent=best;
    secret=0;
  }else if(v<secret){
    h.innerHTML+='<span class="low">'+v+' ↑</span>';
    document.getElementById('result').textContent='📈 太小了，再大点！';
  }else{
    h.innerHTML+='<span class="high">'+v+' ↓</span>';
    document.getElementById('result').textContent='📉 太大了，再小点！';
  }
  document.getElementById('guess').value='';
  document.getElementById('guess').focus();
  if(secret===0)setTimeout(newGame,2000);
}

loadWeather();
</script>

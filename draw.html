<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🖌️ 创意涂色 - 热门H5游戏</title>
<meta name="description" content="在线像素涂色游戏，自由创作，支持多种颜色和笔刷大小">
<meta property="og:title" content="🖌️ 创意涂色 - 热门H5游戏">
<meta property="og:description" content="在线像素涂色画板，释放你的创意">
<meta property="og:type" content="website">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"创意涂色","description":"像素涂色创作工具","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none}
h1{font-size:1.6em;margin:4px 0 6px}
.toolbar{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap;justify-content:center}
.color-btn{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);cursor:pointer;transition:all 0.2s}
.color-btn:hover{transform:scale(1.15)}
.color-btn.active{border-color:#fff;box-shadow:0 0 12px currentColor}
.size-btn{padding:4px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;font-size:0.85em;transition:all 0.2s}
.size-btn.active{background:rgba(100,150,255,0.3);border-color:#6af}
canvas{display:block;border-radius:10px;max-width:96vw;touch-action:none;border:2px solid rgba(255,255,255,0.1);background:#fff}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{padding:8px 18px;border-radius:20px;font-size:0.9em;cursor:pointer;border:1px solid rgba(255,255,255,0.3);transition:all 0.2s}
.btn-clear{background:rgba(255,71,87,0.2);color:#ff4757}
.btn-save{background:rgba(46,213,115,0.2);color:#2ed573}
.btn-fill{background:rgba(255,215,0,0.2);color:#ffd700}
.btn:hover{opacity:0.8}
</style>
</head>
<body>
<h1>🖌️ 创意涂色</h1>
<div class="toolbar" id="toolbar"></div>
<div style="display:flex;gap:6px;margin:4px 0">
  <button class="size-btn active" onclick="setSize(2)">小</button>
  <button class="size-btn" onclick="setSize(4)">中</button>
  <button class="size-btn" onclick="setSize(8)">大</button>
  <button class="size-btn" onclick="setSize(16)">超大</button>
</div>
<canvas id="c" width="360" height="360"></canvas>
<div class="actions">
  <button class="btn btn-clear" onclick="clearCanvas()">🗑️ 清空</button>
  <button class="btn btn-fill" onclick="fillCanvas()">🪣 填充</button>
  <button class="btn btn-save" onclick="saveCanvas()">💾 保存</button>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const colors=['#000','#fff','#ff4757','#ffa502','#ffdd59','#2ed573','#1e90ff','#a55eea','#ff6b81','#e17055','#00cec9','#ffc0cb','#8B4513','#808080','#FFD700','#00FF00'];
let currentColor='#000',brushSize=2,drawing=false,lastX,lastY;

ctx.fillStyle='#fff';ctx.fillRect(0,0,360,360);

const tb=document.getElementById('toolbar');
colors.forEach(color=>{
  const btn=document.createElement('div');btn.className='color-btn';
  if(color==='#000')btn.classList.add('active');
  btn.style.background=color;
  btn.style.color=color;
  btn.addEventListener('click',()=>{currentColor=color;tb.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')});
  tb.appendChild(btn);
});
function setSize(s){brushSize=s;document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active')}
function draw(x,y){
  ctx.fillStyle=currentColor;ctx.beginPath();ctx.arc(x,y,brushSize/2,0,Math.PI*2);ctx.fill();
  if(lastX!==undefined&&lastY!==undefined){ctx.strokeStyle=currentColor;ctx.lineWidth=brushSize;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke()}
  lastX=x;lastY=y;
}
c.addEventListener('mousedown',e=>{drawing=true;const r=c.getBoundingClientRect();lastX=e.clientX-r.left;lastY=e.clientY-r.top;draw(lastX,lastY)});
c.addEventListener('mousemove',e=>{if(!drawing)return;const r=c.getBoundingClientRect();draw(e.clientX-r.left,e.clientY-r.top)});
c.addEventListener('mouseup',()=>{drawing=false;lastX=undefined;lastY=undefined});
c.addEventListener('mouseleave',()=>{drawing=false});
c.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const r=c.getBoundingClientRect();lastX=e.touches[0].clientX-r.left;lastY=e.touches[0].clientY-r.top;draw(lastX,lastY)});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const r=c.getBoundingClientRect();draw(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top)});
c.addEventListener('touchend',()=>{drawing=false;lastX=undefined;lastY=undefined});
function clearCanvas(){ctx.fillStyle='#fff';ctx.fillRect(0,0,360,360)}
function fillCanvas(){ctx.fillStyle=currentColor;ctx.fillRect(0,0,360,360)}
function saveCanvas(){const link=document.createElement('a');link.download='my-art.png';link.href=c.toDataURL();link.click()}
</script>
</body>
</html>

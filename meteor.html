<body>
<h1>🌙 击碎陨石</h1>
<div class="stats"><span>💥 <b id="score">0</b></span><span>🌍 <b id="shield">100</b>%</span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="380" height="500"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=380,H=500;
let ship={x:W/2,y:H-50,angle:0},bullets=[],rocks=[],particles=[],score=0,shield=100,best=0,frame=0,gameover=false;
try{best=parseInt(localStorage.getItem('meteor_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function spawnRock(){
  const size=12+Math.random()*25;rocks.push({
    x:Math.random()*W,y:-size*2,size,speed:1+Math.random()*3,rot:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.05,
    vx:(Math.random()-0.5)*2,pts:Math.floor(50/size*10),vertices:Array.from({length:6+Math.floor(Math.random()*4)},(_,i)=>({r:size*0.7+Math.random()*size*0.3,a:i*Math.PI*2/(6+i)}))
  });
}
function fire(){bullets.push({x:ship.x,y:ship.y,vx:0,vy:-10,r:3,life:40})}
function update(){if(gameover)return;frame++;
  if(frame%Math.max(15,40-score*0.2)===0)spawnRock();
  for(let i=bullets.length-1;i>=0;i--){bullets[i].y+=bullets[i].vy;if(bullets[i].y<0||bullets[i].life--<=0)bullets.splice(i,1)}
  for(let i=rocks.length-1;i>=0;i--){
    rocks[i].y+=rocks[i].speed;rocks[i].x+=rocks[i].vx;rocks[i].rot+=rocks[i].rotSpeed;
    if(rocks[i].y>H+rocks[i].size){shield-=5;document.getElementById('shield').textContent=`${Math.max(0,shield)}%`;rocks.splice(i,1);if(shield<=0)endGame();continue}
    for(let j=bullets.length-1;j>=0;j--){
      const dx=bullets[j].x-rocks[i].x,dy=bullets[j].y-rocks[i].y;
      if(Math.sqrt(dx*dx+dy*dy)<rocks[i].size+bullets[j].r){
        rocks[i].size-=8;bullets.splice(j,1);
        if(rocks[i].size<8){score+=rocks[i].pts;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('meteor_best',best)}catch(e)}for(let p=0;p<8;p++)particles.push({x:rocks[i].x,y:rocks[i].y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:15});rocks.splice(i,1)}else{rocks[i].vertices.forEach(v=>v.r=rocks[i].size*0.7+Math.random()*rocks[i].size*0.3)}break}
    }
  }
  for(let i=particles.length-1;i>=0;i--){particles[i].life--;particles[i].x+=particles[i].vx;particles[i].y+=particles[i].vy;if(particles[i].life<=0)particles.splice(i,1)}
}
function endGame(){gameover=true;ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('💥 地球被摧毁!',W/2,H/2-15);ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重来`,W/2,H/2+20)}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const b=Math.sin(frame*0.01+i)*0.5+0.5;ctx.fillStyle=`rgba(255,255,255,${b})`;ctx.fillRect(Math.random()*W,Math.random()*H,1.5,1.5)}
  rocks.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.fillStyle='#8B4513';ctx.beginPath();r.vertices.forEach((v,i)=>{const px=Math.cos(v.a)*v.r,py=Math.sin(v.a)*v.r;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py)});ctx.closePath();ctx.fill();ctx.strokeStyle='#A0522D';ctx.lineWidth=1;ctx.stroke();ctx.restore()});
  bullets.forEach(b=>{ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
  particles.forEach(p=>{ctx.fillStyle=`rgba(255,165,0,${p.life/15})`;ctx.beginPath();ctx.arc(p.x,p.y,2+Math.random()*2,0,Math.PI*2);ctx.fill()});
  // Ship
  ctx.fillStyle='#3498db';ctx.beginPath();ctx.moveTo(ship.x,ship.y-20);ctx.lineTo(ship.x-14,ship.y+10);ctx.lineTo(ship.x+14,ship.y+10);ctx.closePath();ctx.fill();ctx.fillStyle='#2980b9';ctx.fillRect(ship.x-4,ship.y-8,8,18);ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(ship.x,ship.y+6,3,0,Math.PI*2);ctx.fill();
  // Earth
  ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.arc(W-30,H-30,60,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(W-20,H-40,20,0,Math.PI*2);ctx.fill();
}
c.addEventListener('mousemove',e=>{ship.x=Math.max(15,Math.min(W-15,e.clientX-c.getBoundingClientRect().left))});
c.addEventListener('touchmove',e=>{e.preventDefault();ship.x=Math.max(15,Math.min(W-15,e.touches[0].clientX-c.getBoundingClientRect().left))},{passive:false});
c.addEventListener('click',()=>{if(gameover){restart();return}fire()});
setInterval(()=>{if(!gameover)fire()},200);
function restart(){score=0;shield=100;rocks=[];bullets=[];particles=[];frame=0;gameover=false;ship.x=W/2;document.getElementById('score').textContent='0';document.getElementById('shield').textContent='100%'}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>

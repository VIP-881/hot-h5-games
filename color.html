<h1>🧪 颜色合成</h1>

  <div class="slider-group"><label style="color:#2ecc71">绿</label><input type="range" id="g" min="0" max="255" value="0" oninput="preview()"></div>
  <div class="slider-group"><label style="color:#3498db">蓝</label><input type="range" id="b" min="0" max="255" value="0" oninput="preview()"></div>
</div>
<div class="score-row">🎯 匹配度: <b id="match">0</b>%</div>
<button class="btn" onclick="submit()">✅ 提交</button><button class="btn" onclick="newColor()">🔄 换色</button>
<script>
let tr=0,tg=0,tb=0,score=0,best=0;
try{best=parseInt(localStorage.getItem('color_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function newColor(){tr=Math.floor(Math.random()*256);tg=Math.floor(Math.random()*256);tb=Math.floor(Math.random()*256);document.getElementById('target').style.background=`rgb(${tr},${tg},${tb})`;document.getElementById('r').value=0;document.getElementById('g').value=0;document.getElementById('b').value=0;preview();document.getElementById('match').textContent='0'}
function preview(){const r=+document.getElementById('r').value,g=+document.getElementById('g').value,b=+document.getElementById('b').value;document.getElementById('mix').style.background=`rgb(${r},${g},${b})`;const d=Math.sqrt((r-tr)**2+(g-tg)**2+(b-tb)**2)/Math.sqrt(195075);const m=Math.round((1-d)*100);document.getElementById('match').textContent=m}
function submit(){const m=parseInt(document.getElementById('match').textContent);if(m>=90){score+=m;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('color_best',best)}catch(e)};setTimeout(newColor,500)}else{alert(`匹配度: ${m}% · 需要≥90%`)}}
newColor();
</script>

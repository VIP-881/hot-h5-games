<body>
<h1>⛳ 迷你高尔夫</h1>
<div class="stats"><span>🎯 <b id="strokes">0</b></span><span>🕳️ <b id="hole">1</b>/5</span><span>🏆 <b id="best">--</b></span></div>
<canvas id="c" width="380" height="500"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=380,H=500;
let ball={x:50,y:420,r:10,vx:0,vy:0},hole={x:0,y:0,r:16},obstacles=[],strokes=0,hNum=1,totalStrokes=0,best,aiming=false,power=0,aimAngle=0,pStart=0,shot=false,waiting=false;
try{best=parseInt(localStorage.getItem('golf_best'))||0;document.getElementById('best').textContent=best?`${best}杆`:'--'}catch(e){}

const HOLE_CONFIGS=[
  {hole:[300,80],obstacles:[]},
  {hole:[320,100],obstacles:[{x:180,y:250,w:200,h:15}]},
  {hole:[80,60],obstacles:[{x:120,y:180,w:140,h:15},{x:260,y:320,w:100,h:15}]},
  {hole:[340,80],obstacles:[{x:60,y:150,w:100,h:100},{x:200,y:280,w:120,h:100},{x:80,y:380,w:160,h:15}]},
  {hole:[190,60],obstacles:[{x:50,y:130,w:80,h:80},{x:250,y:130,w:80,h:80},{x:50,y:320,w:80,h:80},{x:250,y:320,w:80,h:80},{x:140,y:220,w:100,h:15}]},
];
function loadHole(){const cfg=HOLE_CONFIGS[hNum-1];hole.x=cfg.hole[0];hole.y=cfg.hole[1];obstacles=cfg.obstacles.map(o=>({...o}));ball={x:50,y:420,r:10,vx:0,vy:0};strokes=0;shot=false;waiting=false;document.getElementById('strokes').textContent='0';document.getElementById('hole').textContent=`${hNum}/5`}
function shoot(power,angle){
  if(shot||waiting)return;
  ball.vx=Math.cos(angle)*power*0.12;ball.vy=Math.sin(angle)*power*0.12;
  strokes++;totalStrokes++;document.getElementById('strokes').textContent=strokes;
  shot=true;
}
function update(){
  if(!shot||waiting)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  ball.vx*=0.97;ball.vy*=0.97;
  if(ball.x-ball.r<8||ball.x+ball.r>W-8){ball.vx*=-0.5;ball.x=Math.max(ball.r+8,Math.min(W-ball.r-8,ball.x))}
  if(ball.y-ball.r<8||ball.y+ball.r>H-8){ball.vy*=-0.5;ball.y=Math.max(ball.r+8,Math.min(H-ball.r-8,ball.y))}
  for(const o of obstacles){
    if(ball.x+ball.r>o.x&&ball.x-ball.r<o.x+o.w&&ball.y+ball.r>o.y&&ball.y-ball.r<o.y+o.h){
      const ox=ball.x-Math.max(o.x,Math.min(ball.x,o.x+o.w));
      const oy=ball.y-Math.max(o.y,Math.min(ball.y,o.y+o.h));
      if(Math.abs(ox)>Math.abs(oy))ball.vx*=-0.6;
      else ball.vy*=-0.6;
      ball.x-=ox*1.1;ball.y-=oy*1.1;
    }
  }
  const dx=ball.x-hole.x,dy=ball.y-hole.y,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<ball.r+hole.r*0.7){waiting=true;ball.x=hole.x;ball.y=hole.y;setTimeout(()=>{if(hNum<5){hNum++;loadHole()}else{endGame()}},800)}
  if(Math.abs(ball.vx)<0.05&&Math.abs(ball.vy)<0.05&&!waiting){shot=false}
}
function endGame(){
  if(!best||totalStrokes<best){best=totalStrokes;document.getElementById('best').textContent=`${best}杆`;try{localStorage.setItem('golf_best',best)}catch(e){}}
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.font='bold 26px sans-serif';ctx.textAlign='center';
  ctx.fillText('🏆 全部完成!',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillText(`总杆数: ${totalStrokes}  点击重新开始`,W/2,H/2+20);
  shot=true;waiting=true;
}
function draw(){
  ctx.fillStyle='#4a8c2a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3a6b1e';ctx.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=30)for(let y=0;y<H;y+=30){ctx.fillStyle=(Math.floor(x/30)+Math.floor(y/30))%2?'#4a8c2a':'#3d7a1e';ctx.fillRect(x,y,30,30)}
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.strokeRect(6,6,W-12,H-12);
  obstacles.forEach(o=>{ctx.fillStyle='#654321';ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,4);ctx.fill();ctx.fillStyle='#8B6914';ctx.fillRect(o.x+2,o.y+2,o.w-4,o.h-4)});
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r+4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r+6,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=3;
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.stroke();
  if(aiming&&!shot&&!waiting){
    const lx=ball.x+Math.cos(aimAngle)*power*0.4,ly=ball.y+Math.sin(aimAngle)*power*0.4;
    ctx.strokeStyle=`rgba(255,255,255,${power/100})`;ctx.lineWidth=2;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(lx,ly);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(lx,ly,4,0,Math.PI*2);ctx.fill();
  }
}
c.addEventListener('mousedown',e=>{
  if(waiting||shot)return;
  const r=c.getBoundingClientRect();aiming=true;pStart=Date.now();
  aimAngle=Math.atan2((e.clientY-r.top)-ball.y,(e.clientX-r.left)-ball.x);
});
c.addEventListener('mousemove',e=>{
  if(!aiming)return;const r=c.getBoundingClientRect();
  aimAngle=Math.atan2((e.clientY-r.top)-ball.y,(e.clientX-r.left)-ball.x);
  power=Math.min(100,(Date.now()-pStart)*0.2);
});
c.addEventListener('mouseup',()=>{if(aiming){aiming=false;power=Math.min(100,(Date.now()-pStart)*0.2);shoot(power+20,aimAngle)}});
c.addEventListener('touchstart',e=>{e.preventDefault();if(waiting||shot)return;const r=c.getBoundingClientRect();aiming=true;pStart=Date.now();aimAngle=Math.atan2((e.touches[0].clientY-r.top)-ball.y,(e.touches[0].clientX-r.left)-ball.x)});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!aiming)return;const r=c.getBoundingClientRect();aimAngle=Math.atan2((e.touches[0].clientY-r.top)-ball.y,(e.touches[0].clientX-r.left)-ball.x);power=Math.min(100,(Date.now()-pStart)*0.2)});
c.addEventListener('touchend',()=>{if(aiming){aiming=false;power=Math.min(100,(Date.now()-pStart)*0.2);shoot(power+20,aimAngle)}});
c.addEventListener('click',()=>{if(waiting&&hNum>5)restart()});
function restart(){hNum=1;totalStrokes=0;loadHole()}
function loop(){update();draw();requestAnimationFrame(loop)}
loadHole();loop();
</script>
</body>

<button class="btn undo" onclick="undo()">↩ 撤销</button>

<script>
const COLORS = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316'];
let tubes=[], selected=null, moves=0, history=[], colors=2;

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function newGame(){
  colors=colors||2;
  let n=colors+1; // +1 extra empty tubes
  tubes=Array.from({length:n+1},(_,i)=>{
    if(i<n) return Array.from({length:3},(_,k)=>Math.floor(k/3*colors/3)+(i%colors));
    return [];
  });
  // Fill each color tube with 3 of same color, shuffle
  tubes = tubes.map((t,i) => i<colors ? Array(3).fill(i) : (i<colors+1 ? [] : []));
  // Actually: easier approach - create layers
  let all = [];
  for(let c=0;c<colors;c++) for(let i=0;i<3;i++) all.push(c);
  all = shuffle(all);
  tubes = [];
  for(let i=0;i<colors;i++) tubes.push([all[i*3],all[i*3+1],all[i*3+2]]);
  // Add 2 empty tubes
  tubes.push([]); tubes.push([]);
  selected=null; moves=0; history=[];
  document.getElementById('moves').textContent='0';
  document.getElementById('msg').textContent='';
  render();
}

function render(){
  let b=document.getElementById('board');
  b.innerHTML=tubes.map((t,i)=>{
    let layers='';
    for(let j=2;j>=0;j--){
      let c=j<t.length?COLORS[t[j]]:'transparent';
      layers+=`<div class="layer" style="background:${c}"></div>`;
    }
    let cls='tube';
    if(selected===i) cls+=' selected';
    if(isTubeDone(t)) cls+=' won';
    return `<div class="${cls}" onclick="tap(${i})">${layers}</div>`;
  }).join('');
}

function isTubeDone(t){return t.length===3&&t[0]===t[1]&&t[1]===t[2]}

function tap(i){
  if(document.getElementById('msg').textContent) return;
  if(selected===null){
    if(tubes[i].length===0) return;
    selected=i;
  } else if(selected===i){
    selected=null;
  } else {
    let from=tubes[selected], to=tubes[i];
    if(to.length>=3) {selected=null; return;}
    if(to.length===0 || from[from.length-1]===to[to.length-1]){
      // Move top color from -> to (all same top)
      let color=from[from.length-1], count=0;
      while(from.length>0&&from[from.length-1]===color&&to.length+count<3) count++;
      // Save state for undo
      history.push({from:selected,to:i,count:count,colors:JSON.parse(JSON.stringify(tubes))});
      for(let k=0;k<count;k++) to.push(from.pop());
      moves++;
      document.getElementById('moves').textContent=moves;
    }
    selected=null;
  }
  render();
  checkWin();
}

function undo(){
  if(history.length===0) return;
  let h=history.pop();
  tubes=JSON.parse(JSON.stringify(h.colors));
  moves--;
  document.getElementById('moves').textContent=moves;
  selected=null;
  render();
}

function checkWin(){
  let won=tubes.filter(t=>t.length>0).every(t=>t.length===3&&t[0]===t[1]&&t[1]===t[2]);
  if(won&&tubes.filter(t=>t.length>0).length===colors){
    document.getElementById('msg').textContent='🎉 恭喜通关！';
    let b=localStorage.getItem('watersort_best_'+colors);
    if(!b||moves<parseInt(b)){
      localStorage.setItem('watersort_best_'+colors,moves);
      document.getElementById('best').textContent=moves;
    }
  }
}

function hint(){
  if(!selected) {
    // Suggest a move
    for(let i=0;i<tubes.length;i++){
      if(tubes[i].length===0||isTubeDone(tubes[i])) continue;
      for(let j=0;j<tubes.length;j++){
        if(i===j) continue;
        if(tubes[j].length<3&&(tubes[j].length===0||tubes[i][tubes[i].length-1]===tubes[j][tubes[j].length-1])){
          selected=i; render(); setTimeout(()=>{selected=null;render()},800);
          return;
        }
      }
    }
  }
}

function setLevel(l){
  colors=l;
  document.querySelectorAll('.lvl button').forEach(b=>b.classList.remove('cur'));
  event.target.classList.add('cur');
  let b=localStorage.getItem('watersort_best_'+colors);
  document.getElementById('best').textContent=b||'—';
  newGame();
}

setLevel(2);
</script>

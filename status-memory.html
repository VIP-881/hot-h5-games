<body>

<header><h1>🎛️ HTTP Status Code Memory</h1><p>翻转卡片 · 匹配状态码与含义 · 训练 REST API 肌肉记忆</p></header>
<div class="container">
  <div class="hud">
    <div class="hud-item"><div class="val" id="hMoves" style="color:#3b82f6">0</div><div class="lbl">🔄 步数</div></div>
    <div class="hud-item"><div class="val" id="hMatched" style="color:#4ade80">0/8</div><div class="lbl">✅ 匹配</div></div>
    <div class="hud-item"><div class="val" id="hTime" style="color:#fbbf24">0s</div><div class="lbl">⏱ 用时</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="controls">
    <button class="btn-new" onclick="initGame()">🔄 新游戏</button>
  </div>
</div>
<div class="result-overlay" id="overlay"><h2 id="oTitle"></h2><p id="oDesc" style="color:#888;margin:8px 0"></p><button id="oBtn">🔄 再来一局</button></div>
<footer>Powered by Maton.ai · HTTP 状态码训练 · 🦊 灵犀出品</footer>
<script>
const PAIRS=[
  {code:'200',cat:'2xx OK',meaning:'请求成功',cls:'code2xx'},
  {code:'201',cat:'2xx Created',meaning:'资源创建成功',cls:'code2xx'},
  {code:'301',cat:'3xx Redirect',meaning:'永久重定向',cls:'code3xx'},
  {code:'304',cat:'3xx Cached',meaning:'未修改，用缓存',cls:'code3xx'},
  {code:'400',cat:'4xx Bad Req',meaning:'请求参数错误',cls:'code4xx'},
  {code:'404',cat:'4xx Not Found',meaning:'资源不存在',cls:'code4xx'},
  {code:'500',cat:'5xx Server Err',meaning:'服务器内部错误',cls:'code5xx'},
  {code:'503',cat:'5xx Unavailable',meaning:'服务暂时不可用',cls:'code5xx'},
];
let cards=[],flipped=[],matched=[],moves=0,startTime=0,timer=null,locked=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function initGame(){
  clearInterval(timer);moves=0;startTime=Date.now();matched=[];flipped=[];locked=false;
  cards=shuffle(PAIRS.flatMap((p,i)=>[{id:i,type:'code',...p},{id:i,type:'meaning',display:p.meaning,cls:'meaning'}]));
  document.getElementById('hMoves').textContent='0';document.getElementById('hMatched').textContent='0/8';document.getElementById('hTime').textContent='0s';
  document.getElementById('overlay').style.display='none';
  timer=setInterval(()=>{document.getElementById('hTime').textContent=Math.floor((Date.now()-startTime)/1000)+'s'},500);
  renderGrid();
}

function renderGrid(){
  document.getElementById('grid').innerHTML=cards.map((c,i)=>'<div class="card'+(flipped.includes(i)||matched.includes(c.id)?' flipped':'')+(matched.includes(c.id)?' matched':'')+'" onclick="flip('+i+')"><div class="card-inner"><div class="card-face card-back">❓</div><div class="card-face card-front '+(c.type==='code'?c.cls:'meaning')+'">'+(c.type==='code'?'<span class="code-num">'+c.code+'</span><span class="code-cat">'+c.cat+'</span>':'<span>'+c.display+'</span>')+'</div></div></div>').join('');
}

function flip(i){
  if(locked||flipped.includes(i)||matched.includes(cards[i].id)) return;
  flipped.push(i);moves++;
  document.getElementById('hMoves').textContent=moves;
  renderGrid();
  if(flipped.length===2){
    locked=true;
    const[a,b]=flipped.map(j=>cards[j]);
    if(a.id===b.id&&a.type!==b.type){
      matched.push(a.id);
      flipped=[];
      document.getElementById('hMatched').textContent=matched.length+'/8';
      locked=false;
      renderGrid();
      if(matched.length===8) endGame();
    }else{
      setTimeout(()=>{flipped=[];locked=false;renderGrid()},800);
    }
  }
}

function endGame(){
  clearInterval(timer);
  const elapsed=Math.floor((Date.now()-startTime)/1000);
  const score=Math.max(0,1000-moves*10-elapsed*5);
  const o=document.getElementById('overlay');o.style.display='block';
  document.getElementById('oTitle').textContent='🎉 '+score+' 分';
  document.getElementById('oTitle').style.color='#fbbf24';
  document.getElementById('oDesc').textContent=moves+' 步 · '+elapsed+'s · 全部匹配！';
  document.getElementById('oBtn').onclick=initGame;
}

initGame();
</script>

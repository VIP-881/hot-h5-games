<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🎪 打靶场 - 热门H5游戏</title>
<meta name="description" content="打靶场射击游戏，移动准星瞄准射击移动靶子，限时挑战精准度得分免费在线">
<meta property="og:title" content="🎪 打靶场 - 热门H5游戏"><meta property="og:description" content="瞄准射击移动靶子限时挑战"><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"打靶场","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#2c3e50,#1a252f);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair}h1{font-size:1.6em;margin:4px 0}.stats{display:flex;gap:12px;margin:6px 0 8px}.stats span{background:rgba(255,255,255,0.12);padding:4px 12px;border-radius:20px;font-size:0.9em}canvas{display:block;border-radius:10px;max-width:96vw}</style>
</head>
<body>
<h1>🎪 打靶场</h1>
<div class="stats"><span>🎯 <b id="score">0</b></span><span>⏱ <b id="timer">30</b>s</span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="380" height="440"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=380,H=440;
let targets=[],crossX=W/2,crossY=H/2,score=0,timeLeft=30,best=0,timerInterval,started=false,gameover=false;
try{best=parseInt(localStorage.getItem('range_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function spawnTarget(){
  const fromLeft=Math.random()>.5;
  targets.push({x:fromLeft?-40:W+40,y:80+Math.random()*(H-160),r:14+Math.random()*16,vx:(fromLeft?1:-1)*(2+Math.random()*4),vy:(Math.random()-0.5)*3,pts:10+Math.floor(Math.random()*40),alive:true,hit:false,life:180});
}
function update(){
  if(!started||gameover)return;
  if(Math.random()<0.04)spawnTarget();
  targets.forEach(t=>{t.x+=t.vx;t.y+=t.vy;t.life--;if(t.life<=0||t.x<-60||t.x>W+60)t.alive=false});
  targets=targets.filter(t=>t.alive);
}
function draw(){
  ctx.fillStyle='#2c3e50';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8B4513';ctx.fillRect(0,H-30,W,30);
  ctx.fillStyle='rgba(255,255,255,0.15)';for(let y=0;y<H-30;y+=40){ctx.fillRect(0,y,W,1)}
  targets.forEach(t=>{
    if(!t.alive||t.hit)return;
    for(let i=2;i>=0;i--){ctx.strokeStyle=`rgba(255,0,0,${0.3-i*0.1})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(t.x,t.y,t.r+i*8,0,Math.PI*2);ctx.stroke()}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f00';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(t.pts,t.x,t.y+4);
  });
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(crossX-14,crossY);ctx.lineTo(crossX+14,crossY);ctx.stroke();ctx.beginPath();ctx.moveTo(crossX,crossY-14);ctx.lineTo(crossX,crossY+14);ctx.stroke();ctx.beginPath();ctx.arc(crossX,crossY,5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,30);ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText(`🎪 打靶场 ⏱ ${timeLeft}s`,W/2,20);
}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();crossX=e.clientX-r.left;crossY=e.clientY-r.top});
c.addEventListener('click',e=>{
  if(gameover){restart();return}if(!started){startGame();return}
  const r=c.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  for(const t of targets){if(!t.alive||t.hit)continue;if(Math.sqrt((x-t.x)**2+(y-t.y)**2)<t.r+8){t.hit=true;score+=t.pts;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('range_best',best)}catch(e){}}return}}
});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();crossX=e.touches[0].clientX-r.left;crossY=e.touches[0].clientY-r.top});
c.addEventListener('touchstart',e=>{e.preventDefault();if(gameover){restart();return}if(!started){startGame();return}const r=c.getBoundingClientRect();const x=e.touches[0].clientX-r.left,y=e.touches[0].clientY-r.top;for(const t of targets){if(!t.alive||t.hit)continue;if(Math.sqrt((x-t.x)**2+(y-t.y)**2)<t.r+8){t.hit=true;score+=t.pts;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('range_best',best)}catch(e){}}return}}});
function startGame(){started=true;timerInterval=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent=timeLeft;if(timeLeft<=0){clearInterval(timerInterval);gameover=true;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillText('时间到!',W/2,H/2-10);ctx.font='16px sans-serif';ctx.fillText(`得分: ${score}  点击重来`,W/2,H/2+20)}},1000)}
function restart(){score=0;timeLeft=30;targets=[];started=false;gameover=false;clearInterval(timerInterval);document.getElementById('score').textContent='0';document.getElementById('timer').textContent='30'}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏓 乒乓球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
h1{font-size:1.6em;margin-bottom:4px;color:#0f0}
.stats{display:flex;gap:16px;margin:6px 0 8px}
.stats span{background:rgba(0,255,0,0.12);padding:5px 14px;border-radius:20px;font-size:0.95em}
canvas{display:block;border-radius:6px;max-width:96vw;box-shadow:0 4px 24px rgba(0,255,0,0.1)}
canvas.win{border-color:#0f0;box-shadow:0 0 30px rgba(0,255,0,0.3)}
</style>
</head>
<body>
<h1>🏓 乒乓球</h1>
<div class="stats"><span>👤 <b id="pscore">0</b></span><span>🤖 <b id="ascore">0</b></span><span>⭐ <b id="sets">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="500"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=500,PW=8,PH=70,BR=7;
let ball={x:W/2,y:H/2,vx:4,vy:3},player={y:H/2-PH/2},ai={y:H/2-PH/2},ps=0,as=0,sets=0,best=0,serving=true,winPoint=7;
try{best=parseInt(localStorage.getItem('pong_best'))||0;document.getElementById('best').textContent=best}catch(e){}

function reset(){ball={x:W/2,y:H/2,vx:(Math.random()>.5?1:-1)*4,vy:(Math.random()*6-3)};serving=true;player.y=H/2-PH/2;ai.y=H/2-PH/2}
function update(){
  if(serving)return;
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.y-BR<0||ball.y+BR>H)ball.vy*=-1;
  if(ball.x-BR<PW+15&&ball.y>player.y&&ball.y<player.y+PH){
    ball.x=PW+15+BR;ball.vx*=1.05;
    const hit=(ball.y-player.y)/PH;
    ball.vy+= (hit-0.5)*5;
  }
  if(ball.x+BR>W-PW-15&&ball.y>ai.y&&ball.y<ai.y+PH){
    ball.x=W-PW-15-BR;ball.vx*=1.05;
    const hit=(ball.y-ai.y)/PH;
    ball.vy+= (hit-0.5)*5;
  }
  if(ball.x<0){as++;document.getElementById('ascore').textContent=as;checkSet()}
  if(ball.x>W){ps++;document.getElementById('pscore').textContent=ps;checkSet()}
  let targetY=ball.y-PH/2;
  if(ball.x<W/3)targetY=H/2-PH/2;
  ai.y+=(targetY-ai.y)*0.08;
  ai.y=Math.max(0,Math.min(H-PH,ai.y));
}
function checkSet(){
  if(ps>=winPoint){sets++;document.getElementById('sets').textContent=sets;ps=0;as=0;document.getElementById('pscore').textContent='0';document.getElementById('ascore').textContent='0';if(sets>best){best=sets;document.getElementById('best').textContent=best;try{localStorage.setItem('pong_best',best)}catch(e){}}winPoint=7}
  else if(as>=winPoint){endGame();return}
  reset()
}
function endGame(){
  if(sets>best){best=sets;document.getElementById('best').textContent=best;try{localStorage.setItem('pong_best',best)}catch(e){}}
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f00';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
  ctx.fillText('YOU LOSE',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText(`${sets} 连胜  点击重新开始`,W/2,H/2+20);
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#0f0';ctx.lineWidth=1;ctx.setLineDash([5,10]);
  ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#0f0';ctx.fillRect(10,player.y,PW,PH);
  ctx.fillStyle='#0f0';ctx.fillRect(W-10-PW,ai.y,PW,PH);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,Math.PI*2);ctx.fill();
  if(serving){ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('点击开始发球',W/2,H/2+30)}
}
c.addEventListener('mousemove',e=>{const y=e.clientY-c.getBoundingClientRect().top;player.y=Math.max(0,Math.min(H-PH,y-PH/2))});
c.addEventListener('touchmove',e=>{e.preventDefault();const y=e.touches[0].clientY-c.getBoundingClientRect().top;player.y=Math.max(0,Math.min(H-PH,y-PH/2))},{passive:false});
c.addEventListener('click',()=>{if(serving)serving=false;if(as>=winPoint)restartAll()});
function restartAll(){ps=0;as=0;sets=0;winPoint=7;document.getElementById('pscore').textContent='0';document.getElementById('ascore').textContent='0';document.getElementById('sets').textContent='0';reset()}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>

<header><h1>⚡ Netlify Build Battle</h1><p>竞速构建 · 更快更稳得分更高</p></header>
<div class="battle-area">
  <div class="pipeline">
    <h3>🔧 构建流水线</h3>
    <div class="stages" id="stages">
      <div class="stage" id="s0">📦<span class="label">Installing</span></div><div class="arrow">→</div>
      <div class="stage" id="s1">🔨<span class="label">Building</span></div><div class="arrow">→</div>
      <div class="stage" id="s2">✅<span class="label">Testing</span></div><div class="arrow">→</div>
      <div class="stage" id="s3">📐<span class="label">Lint</span></div><div class="arrow">→</div>
      <div class="stage" id="s4">🚀<span class="label">Deploy</span></div>
    </div>
  </div>
  <div class="timer" id="timer">0.00s</div>
  <div class="stats" id="statsBar"></div>
  <div class="controls">
    <button class="btn-build" onclick="startBuild()">⚡ 开始构建</button>
    <button class="btn-build" style="background:rgba(139,92,246,.15);color:#a78bfa" onclick="resetGame()">🔄 重置记录</button>
  </div>
  <div class="build-log" id="log"><div class="line">等待构建...</div></div>
</div>
<footer>Powered by Maton.ai · Netlify · 🦊 灵犀出品</footer>
<script>
let buildTimer=null,startTime=0,elapsed=0,currentStage=0,building=false;
let records=JSON.parse(localStorage.getItem('build_records')||'[]');
let bestTime=parseFloat(localStorage.getItem('build_best')||'0');

function updateStats(){
  document.getElementById('statsBar').innerHTML=`
    <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#fbbf24">${records.length}</div><div style="font-size:10px;color:#888">🏗️ 构建次数</div></div>
    <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#4ade80">${bestTime||'--'}</div><div style="font-size:10px;color:#888">⚡ 最佳时间</div></div>
    <div style="text-align:center"><div style="font-size:18px;font-weight:700;color:#06b6d4">${(records.reduce((s,r)=>s+r.score,0)||0)}</div><div style="font-size:10px;color:#888">🏆 总分</div></div>
  `;
}
updateStats();

function resetGame(){records=[];bestTime=0;localStorage.removeItem('build_records');localStorage.removeItem('build_best');updateStats()}

function addLine(msg,cls){const l=document.getElementById('log');l.innerHTML='<div class="line '+cls+'">'+msg+'</div>'+l.innerHTML;if(l.children.length>30)l.removeChild(l.lastChild)}

function startBuild(){
  if(building) return; building=true; currentStage=0; elapsed=0;
  document.querySelectorAll('.stage').forEach(s=>{s.className='stage'});
  document.getElementById('s0').classList.add('active');
  document.getElementById('timer').textContent='0.00s';
  document.getElementById('log').innerHTML='';
  addLine('⚡ 开始构建...','blue');

  startTime=performance.now();
  const stages=['Installing dependencies...','Building assets...','Running tests...','Linting code...','Deploying to CDN...'];
  const cls=['blue','yellow','green','yellow','blue'];
  let si=0;

  buildTimer=setInterval(()=>{
    elapsed=performance.now()-startTime;
    document.getElementById('timer').textContent=(elapsed/1000).toFixed(2)+'s';

    if(elapsed>=(si+1)*800+Math.random()*400&&si<5){
      const prev=document.getElementById('s'+(si-1));
      if(prev){prev.classList.remove('active');prev.classList.add(Math.random()>.1?'success':'success')}
      const s=document.getElementById('s'+si);
      if(s){s.classList.add('active');addLine((si+1)+'/5 '+stages[si],cls[si])}
      si++;

      if(si>5){
        clearInterval(buildTimer);building=false;
        const time=(elapsed/1000).toFixed(2);
        document.getElementById('s4').classList.remove('active');
        document.getElementById('s4').classList.add('success');
        document.getElementById('timer').style.background='linear-gradient(135deg,#4ade80,#22c55e)';
        document.getElementById('timer').style.webkitBackgroundClip='text';
        document.getElementById('timer').style.webkitTextFillColor='transparent';
        addLine('🚀 部署成功！构建时间: '+time+'s','green');
        const score=Math.max(0,Math.floor(500-time*20));
        addLine('🏆 得分: +'+score,'yellow');
        records.push({time:parseFloat(time),score,ts:Date.now()});
        if(!bestTime||parseFloat(time)<bestTime){bestTime=parseFloat(time);localStorage.setItem('build_best',bestTime)}
        records=records.slice(-20);
        localStorage.setItem('build_records',JSON.stringify(records));
        updateStats();
        setTimeout(()=>{document.getElementById('timer').style.background='';document.getElementById('timer').style.webkitBackgroundClip='';document.getElementById('timer').style.webkitTextFillColor='';document.querySelectorAll('.stage').forEach(s=>{s.className='stage';s.classList.add('success')})},2000);
      }
    }

    // Random failure
    if(Math.random()<.002&&elapsed>1000&&si<5){
      clearInterval(buildTimer);building=false;
      document.getElementById('s'+(si-1)).classList.add('fail');
      document.getElementById('timer').style.color='#ef4444';
      addLine('❌ 构建失败！检查错误日志','red');
      setTimeout(()=>document.getElementById('timer').style.color='',2000);
    }
  },100);
}
</script>

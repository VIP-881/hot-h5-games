<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🧩 俄罗斯方块 - 热门H5游戏</title>
<meta name="description" content="经典俄罗斯方块Tetris游戏，旋转下落方块消除整行得分，全球最受欢迎益智游戏免费在线玩">
<meta property="og:title" content="🧩 俄罗斯方块 - 热门H5游戏"><meta property="og:description" content="经典俄罗斯方块，旋转下落消除整行"><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"俄罗斯方块","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none}h1{font-size:1.8em;margin:4px 0}.stats{display:flex;gap:12px;margin:6px 0 8px}.stats span{background:rgba(255,255,255,0.1);padding:5px 14px;border-radius:20px;font-size:0.95em}canvas{display:block;border-radius:8px;max-width:96vw}</style>
</head>
<body>
<h1>🧩 俄罗斯方块</h1>
<div class="stats"><span>⭐ <b id="score">0</b></span><span>📊 <b id="lines">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="300" height="600"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),COLS=10,ROWS=20,S=30,W=COLS*S,H=ROWS*S;
const SHAPES=[{m:[[1,1,1,1]],c:'#00f0f0'},{m:[[1,1],[1,1]],c:'#f0f000'},{m:[[0,1,0],[1,1,1]],c:'#a000f0'},{m:[[1,0,0],[1,1,1]],c:'#0000f0'},{m:[[0,0,1],[1,1,1]],c:'#f0a000'},{m:[[0,1,1],[1,1,0]],c:'#00f000'},{m:[[1,1,0],[0,1,1]],c:'#f00000'}];
let board=Array(ROWS).fill().map(()=>Array(COLS).fill(0)),boardColor=Array(ROWS).fill().map(()=>Array(COLS).fill('')),current=null,next=null,score=0,lines=0,best=0,dropTimer=0,dropSpeed=800,gameover=false;
try{best=parseInt(localStorage.getItem('tetris_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function newPiece(){const s=SHAPES[Math.floor(Math.random()*SHAPES.length)];return{m:s.m.map(r=>[...r]),c:s.c,x:Math.floor((COLS-s.m[0].length)/2),y:0}}
function rotate(p){const m=p.m,h=m.length,w=m[0].length,nm=Array(w).fill().map(()=>Array(h).fill(0));for(let r=0;r<h;r++)for(let c=0;c<w;c++)nm[c][h-1-r]=m[r][c];return{...p,m:nm}}
function collides(p,dx,dy){for(let r=0;r<p.m.length;r++)for(let c=0;c<p.m[0].length;c++){if(!p.m[r][c])continue;const nx=p.x+c+dx,ny=p.y+r+dy;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&board[ny][nx])return true}return false}
function lockPiece(){for(let r=0;r<current.m.length;r++)for(let c=0;c<current.m[0].length;c++){if(!current.m[r][c])continue;const y=current.y+r,x=current.x+c;if(y<0){endGame();return}board[y][x]=1;boardColor[y][x]=current.c}
  let cleared=0;for(let r=ROWS-1;r>=0;r--){if(board[r].every(v=>v)){board.splice(r,1);boardColor.splice(r,1);board.unshift(Array(COLS).fill(0));boardColor.unshift(Array(COLS).fill(''));cleared++;r++}}
  if(cleared){const pts=[0,100,300,500,800];lines+=cleared;score+=pts[cleared];document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines;dropSpeed=Math.max(100,800-lines*10);if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('tetris_best',best)}catch(e){}}}
  current=next;next=newPiece();if(collides(current,0,0))endGame();}
function movePiece(dx,dy){if(!collides(current,dx,dy)){current.x+=dx;current.y+=dy;return true}return false}
function hardDrop(){while(movePiece(0,1));lockPiece()}
function endGame(){gameover=true;ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-15);ctx.font='16px sans-serif';ctx.fillText(`得分: ${score} · ${lines}行  点击重来`,W/2,H/2+20)}
function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.fillStyle=(r+c)%2?'#0d0d20':'#101025';ctx.fillRect(c*S,r*S,S-1,S-1)}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(board[r][c]){ctx.fillStyle=boardColor[r][c];ctx.fillRect(c*S+1,r*S+1,S-2,S-2);ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(c*S+2,r*S+2,S-4,4)}}
  if(current&&!gameover){for(let r=0;r<current.m.length;r++)for(let c=0;c<current.m[0].length;c++){if(current.m[r][c]){ctx.fillStyle=current.c;ctx.fillRect((current.x+c)*S+1,(current.y+r)*S+1,S-2,S-2)}}}
}
function update(t){
  if(gameover)return;
  dropTimer+=16;if(dropTimer>=dropSpeed){dropTimer=0;if(!movePiece(0,1))lockPiece()}
  draw();requestAnimationFrame(update);
}
document.addEventListener('keydown',e=>{if(gameover)return;const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowDown:[0,1],w:[-1,0],s:[0,1],d:[1,0],ArrowUp:'rotate',' ':'drop'};if(m[e.key]==='rotate'){const r=rotate(current);if(!collides(r,0,0))current=r}else if(m[e.key]==='drop'){hardDrop()}else if(Array.isArray(m[e.key])){e.preventDefault();movePiece(...m[e.key])}});
c.addEventListener('touchstart',e=>{e.preventDefault();if(gameover){restart();return}});
c.addEventListener('click',()=>{if(gameover)restart()});
// Mobile controls: tap sides to move, tap bottom to drop, top to rotate
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect(),x=e.touches[0].clientX-r.left,y=e.touches[0].clientY-r.top;if(gameover){restart();return};if(y<H*0.3)current=rotate(current);else if(y>H*0.7)hardDrop();else if(x<W/3)movePiece(-1,0);else if(x>W*2/3)movePiece(1,0);else movePiece(0,1)});
function restart(){board=Array(ROWS).fill().map(()=>Array(COLS).fill(0));boardColor=Array(ROWS).fill().map(()=>Array(COLS).fill(''));current=newPiece();next=newPiece();score=0;lines=0;dropSpeed=800;dropTimer=0;gameover=false;document.getElementById('score').textContent='0';document.getElementById('lines').textContent='0'}
current=newPiece();next=newPiece();requestAnimationFrame(update);
</script>
</body>
</html>

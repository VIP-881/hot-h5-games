<body>
<div class="header">
  <h1>📬 Gmail 收件箱俄罗斯方块</h1>
  <p>未读邮件 = 掉落方块 · 清除它们！｜ 数据来自你的 Gmail</p>
</div>
<div class="status" id="mailStatus"></div>
<div id="game-container">
  <div id="canvas-wrap"><canvas id="board" width="300" height="600"></canvas></div>
  <div id="info-panel">
    <div class="info-card score"><div class="label">📊 分数</div><div class="value" id="score">0</div></div>
    <div class="info-card lines"><div class="label">✉️ 消行</div><div class="value" id="lines">0</div><div class="sub" id="linesSub">已清理邮件</div></div>

    <div class="next-piece">

      <canvas id="next" width="120" height="100"></canvas>
    </div>

<script>
const API_KEY = 'v2.xOedfPfv9hou9ht8BXTbk7OKPlRUUvh5WuyJNC8Q3mLrU5dQVGL5rARouO2DNnC-IKG0UGeYm79Cfw1aIjsOw48Fram7uaVouZHiYKGTZzMBg4SuQLJLz4gY';
const COLS = 10, ROWS = 20, BLOCK = 30;
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCtx = document.getElementById('next').getContext('2d');

const TETROMINOS = {
  I: {shape:[[1,1,1,1]],color:'#06b6d4'},
  O: {shape:[[1,1],[1,1]],color:'#fbbf24'},
  T: {shape:[[0,1,0],[1,1,1]],color:'#a78bfa'},
  S: {shape:[[0,1,1],[1,1,0]],color:'#4ade80'},
  Z: {shape:[[1,1,0],[0,1,1]],color:'#ef4444'},
  J: {shape:[[1,0,0],[1,1,1]],color:'#3b82f6'},
  L: {shape:[[0,0,1],[1,1,1]],color:'#f97316'}
};
const PIECES = ['I','O','T','S','Z','J','L'];

let grid = [], current = null, nextPiece = null, score = 0, lines = 0, level = 1;
let gameRunning = false, paused = false, interval = null, unreadCount = 0;

function createGrid() { grid = Array.from({length:ROWS},()=>Array(COLS).fill(0)); }
function randomPiece() {
  const type = PIECES[Math.floor(Math.random()*PIECES.length)];
  const t = TETROMINOS[type];
  return {type, shape:t.shape, color:t.color, x:Math.floor((COLS-t.shape[0].length)/2), y:0};
}

function draw() {
  ctx.clearRect(0,0,board.width,board.height);
  // Grid bg
  ctx.fillStyle = '#12122a';
  ctx.fillRect(0,0,board.width,board.height);
  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  ctx.lineWidth = 0.5;
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*BLOCK);ctx.lineTo(COLS*BLOCK,r*BLOCK);ctx.stroke();}
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*BLOCK,0);ctx.lineTo(c*BLOCK,ROWS*BLOCK);ctx.stroke();}
  // Placed blocks
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r][c]){
        const alpha = 1 - (r/ROWS)*0.3;
        ctx.fillStyle = grid[r][c]+Math.floor(alpha*255).toString(16).padStart(2,'0');
        if(grid[r][c].length===7) ctx.fillStyle = grid[r][c];
        ctx.fillRect(c*BLOCK+1,r*BLOCK+1,BLOCK-2,BLOCK-2);
        ctx.fillStyle = 'rgba(255,255,255,.15)';
        ctx.fillRect(c*BLOCK+1,r*BLOCK+1,BLOCK-2,4);
      }
    }
  }
  // Current piece
  if(current){
    drawPiece(ctx,current,current.x*BLOCK,current.y*BLOCK);
    // Ghost
    let gy = current.y;
    while(!collision(current.shape,current.x,gy+1)) gy++;
    ctx.globalAlpha = 0.2;
    drawPiece(ctx,{...current,y:gy},current.x*BLOCK,gy*BLOCK);
    ctx.globalAlpha = 1;
  }
  // Game over overlay
  if(!gameRunning && current === null && grid.some(r=>r.some(c=>c!==0))){
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(0,0,board.width,board.height);
    ctx.fillStyle = '#f87171';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER',150,280);
    ctx.fillStyle = '#888';
    ctx.font = '14px sans-serif';
    ctx.fillText('收件箱爆炸了！',150,310);
  }
  // Start prompt
  if(!gameRunning && grid.every(r=>r.every(c=>c===0))){
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('按开始游戏',150,300);
    ctx.fillText('用消除对抗未读邮件',150,324);
  }
  drawNext();
  updateUI();
}

function drawPiece(context, piece, ox, oy) {
  context.fillStyle = piece.color;
  piece.shape.forEach((row,r) => {
    row.forEach((cell,c) => {
      if(cell){
        context.fillRect(ox+c*BLOCK+1,oy+r*BLOCK+1,BLOCK-2,BLOCK-2);
        context.fillStyle = 'rgba(255,255,255,.2)';
        context.fillRect(ox+c*BLOCK+1,oy+r*BLOCK+1,BLOCK-2,4);
        context.fillStyle = piece.color;
      }
    });
  });
}

function drawNext() {
  nextCtx.clearRect(0,0,120,100);
  nextCtx.fillStyle = '#1a1a2e';
  nextCtx.fillRect(0,0,120,100);
  if(!nextPiece) return;
  const w = nextPiece.shape[0].length * BLOCK;
  const h = nextPiece.shape.length * BLOCK;
  const ox = (120 - w) / 2, oy = (100 - h) / 2;
  nextCtx.fillStyle = nextPiece.color;
  nextPiece.shape.forEach((row,r)=>{
    row.forEach((cell,c)=>{
      if(cell){
        nextCtx.fillRect(ox+c*BLOCK+1,oy+r*BLOCK+1,BLOCK-2,BLOCK-2);
      }
    });
  });
}

function collision(shape, px, py) {
  return shape.some((row,r)=>row.some((cell,c)=>{
    if(!cell) return false;
    const nx=px+c, ny=py+r;
    return nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&grid[ny][nx]);
  }));
}

function placePiece() {
  current.shape.forEach((row,r)=>{
    row.forEach((cell,c)=>{
      if(cell) grid[current.y+r][current.x+c] = current.color;
    });
  });
  // Clear lines
  let cleared = 0;
  for(let r=ROWS-1;r>=0;r--){
    if(grid[r].every(c=>c!==0)){
      grid.splice(r,1);
      grid.unshift(Array(COLS).fill(0));
      cleared++;
      r++;
    }
  }
  if(cleared > 0){
    score += cleared * 100 * level;
    lines += cleared;
    level = Math.floor(lines / 5) + 1;
    addLog(`✅ 清除了 ${cleared} 行 — ${emailsCleared()}`, true);
  }
  current = nextPiece;
  nextPiece = randomPiece();
  if(collision(current.shape,current.x,current.y)){
    // Check if we can spawn higher
    current.y = -1;
    if(collision(current.shape,current.x,current.y)){
      gameOver();
      return;
    }
  }
}

function emailsCleared() {
  const estimated = lines * 42; // ~42 emails per line clear (symbolic)
  return `≈ ${estimated} 封邮件已清理`;
}

function addLog(msg, isClear) {
  const log = document.getElementById('mailLog');
  const div = document.createElement('div');
  div.className = 'item' + (isClear?' cleared':'');
  div.textContent = msg;
  log.prepend(div);
  if(log.children.length > 20) log.removeChild(log.lastChild);
}

function gameOver() {
  gameRunning = false;
  clearInterval(interval);
  addLog('💥 收件箱溢出！游戏结束');
  draw();
  // Archive some emails as penalty
  document.getElementById('mailStatus').innerHTML = '<span style="color:#f87171">💥 游戏结束 — 需要清理收件箱</span>';
}

function tick() {
  if(!gameRunning||paused) return;
  if(!collision(current.shape,current.x,current.y+1)){
    current.y++;
  } else {
    placePiece();
  }
  draw();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('lines').textContent = lines;
  document.getElementById('level').textContent = level;
  document.getElementById('linesSub').textContent = emailsCleared();
}

function startGame() {
  createGrid();
  current = randomPiece();
  nextPiece = randomPiece();
  score = 0; lines = 0; level = 1;
  gameRunning = true; paused = false;
  if(interval) clearInterval(interval);
  interval = setInterval(tick, Math.max(100, 800 - (level-1)*70));
  addLog('▶ 游戏开始！');
  syncGmail();
  draw();
}

function togglePause() {
  if(!gameRunning) return;
  paused = !paused;
  document.querySelector('.btn-pause').textContent = paused ? '▶ 继续' : '⏸ 暂停';
  if(!paused) draw();
}

function keyLeft() { if(current&&!collision(current.shape,current.x-1,current.y)){current.x--;draw();} }
function keyRight() { if(current&&!collision(current.shape,current.x+1,current.y)){current.x++;draw();} }
function keyDown() { if(current&&!collision(current.shape,current.x,current.y+1)){current.y++;draw();} else if(current){placePiece();draw();} }
function keyRotate() {
  if(!current) return;
  const rotated = current.shape[0].map((_,i)=>current.shape.map(r=>r[i]).reverse());
  if(!collision(rotated,current.x,current.y)){current.shape=rotated;draw();}
}
function keyDrop() {
  if(!current) return;
  while(!collision(current.shape,current.x,current.y+1)) current.y++;
  placePiece();
  draw();
}

document.addEventListener('keydown',e=>{
  if(!gameRunning||paused) return;
  const actions = {ArrowLeft:keyLeft,ArrowRight:keyRight,ArrowDown:keyDown,ArrowUp:keyRotate,' ':keyDrop};
  if(actions[e.key]){e.preventDefault();actions[e.key]();}
});

async function syncGmail() {
  const status = document.getElementById('mailStatus');
  status.innerHTML = '<span style="color:#a78bfa">⏳ 同步 Gmail...</span>';
  try {
    const resp = await fetch('https://gateway.maton.ai/google-mail/gmail/v1/users/me/messages?maxResults=5&q=is:unread', {
      headers: {'Authorization':'Bearer '+API_KEY}
    });
    const data = await resp.json();
    unreadCount = data.resultSizeEstimate || (data.messages?data.messages.length:0);
    document.getElementById('unread').textContent = unreadCount;
    status.innerHTML = unreadCount > 0
      ? `<span style="color:#ef4444">📬 ${unreadCount} 封未读邮件在收件箱</span>`
      : '<span style="color:#4ade80">✅ 收件箱已清空！</span>';
    if(unreadCount > 0 && gameRunning) {
      addLog(`📬 检测到 ${unreadCount} 封未读邮件`);
    }
  } catch(e) {
    status.innerHTML = '<span style="color:#f87171">❌ Gmail 同步失败</span>';
  }
}

// Init
createGrid();
draw();
syncGmail();
</script>

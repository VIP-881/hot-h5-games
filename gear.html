<body>
<h1>🌀 旋转齿轮</h1>
<div class="stats"><span>⚙️ <b id="level">1</b>/5</span><span>👆 <b id="moves">0</b></span><span>🏆 <b id="best">--</b></span></div>
<canvas id="c" width="360" height="360"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=360;
let gears=[],moves=0,level=1,win=false,best;
try{best=parseInt(localStorage.getItem('gear_best'))||0;document.getElementById('best').textContent=best?`${best}步`:'--'}catch(e){}

const LEVELS=[
  [{x:W/4,y:H/2,r:40},{x:W/2,y:H/2,r:40},{x:W*3/4,y:H/2,r:40}],
  [{x:W/2,y:H/4,r:35},{x:W/2,y:H/2,r:45},{x:W/4,y:H/4,r:30},{x:W*3/4,y:H/4,r:30},{x:W/4,y:H*3/4,r:30},{x:W*3/4,y:H*3/4,r:30}],
  [{x:W/3,y:H/3,r:30},{x:W*2/3,y:H/3,r:35},{x:W/2,y:H/2,r:40},{x:W/3,y:H*2/3,r:30},{x:W*2/3,y:H*2/3,r:35}],
  [{x:W/4,y:H/4,r:28},{x:W/2,y:H/4,r:32},{x:W*3/4,y:H/4,r:28},{x:W/4,y:H/2,r:35},{x:W*3/4,y:H/2,r:35},{x:W/4,y:H*3/4,r:28},{x:W/2,y:H*3/4,r:32},{x:W*3/4,y:H*3/4,r:28}],
  [{x:W/2,y:H/2,r:50},{x:W/5,y:H/5,r:25},{x:W*4/5,y:H/5,r:25},{x:W/5,y:H*4/5,r:25},{x:W*4/5,y:H*4/5,r:25}],
];
function loadLevel(l){
  gears=LEVELS[l-1].map(g=>({...g,rotation:0,clicked:false}));
  moves=0;win=false;document.getElementById('moves').textContent='0';document.getElementById('level').textContent=`${l}/5`;
  gears.forEach(g=>{g.rotation=Math.random()*Math.PI*2});
}
function update(){
  gears.forEach(g=>g.rotation+=0.01);
  if(!win){const allMoving=gears.every(g=>g.clicked||gears.some(g2=>g2.clicked&&Math.abs(Math.sqrt((g.x-g2.x)**2+(g.y-g2.y)**2)-(g.r+g2.r))<8));if(allMoving&&gears.some(g=>g.clicked)){win=true;if(level<5){level++;loadLevel(level)}else{if(!best||moves<best){best=moves;document.getElementById('best').textContent=`${best}步`;try{localStorage.setItem('gear_best',best)}catch(e)}setTimeout(()=>alert('🏆 全部通关!'),100)}}}
}
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  gears.forEach((g,i)=>{
    const connected=gears.some(g2=>g2.clicked&&Math.abs(Math.sqrt((g.x-g2.x)**2+(g.y-g2.y)**2)-(g.r+g2.r))<8);
    const spinning=g.clicked||connected;
    ctx.save();ctx.translate(g.x,g.y);if(spinning)ctx.rotate(g.rotation);
    const teeth=8;ctx.fillStyle=spinning?'#3498db':g.clicked?'#2ecc71':'#555';
    ctx.beginPath();for(let t=0;t<teeth*2;t++){const a=t*Math.PI/teeth-Math.PI/2,r=t%2?g.r:g.r*0.8;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,g.r*0.2,0,Math.PI*2);ctx.fill();
    ctx.restore();
    if(!g.clicked&&!spinning)ctx.fillStyle='rgba(255,255,255,0.5)',ctx.font='14px sans-serif',ctx.textAlign='center',ctx.fillText('点击',g.x,g.y);
  });
}
c.addEventListener('click',e=>{
  const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  for(const g of gears){const dx=x-g.x,dy=y-g.y;if(Math.sqrt(dx*dx+dy*dy)<g.r&&!g.clicked){g.clicked=true;moves++;document.getElementById('moves').textContent=moves;break}}
});
function restart(){level=1;loadLevel(1)}
function loop(){update();draw();requestAnimationFrame(loop)}loadLevel(1);loop();
</script>
</body>

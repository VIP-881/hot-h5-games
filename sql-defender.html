<header><h1>🛡️ SQL Defender</h1><p>拦截 SQL 注入攻击 · 保护数据库安全</p></header>
<div class="container">
  <div class="hud">
    <div class="hud-item"><div class="val" id="hScore" style="color:#fbbf24">0</div><div class="lbl">⭐ 分数</div></div>
    <div class="hud-item"><div class="val" id="hBlocked" style="color:#4ade80">0</div><div class="lbl">🛡️ 拦截</div></div>
    <div class="hud-item"><div class="val" id="hBreaches" style="color:#f87171">0/5</div><div class="lbl">⚠️ 入侵</div></div>
    <div class="hud-item"><div class="val" id="hShields" style="color:#a78bfa">3</div><div class="lbl">🔰 护盾</div></div>
  </div>
  <div class="db-visual">
    <div class="db-server" id="dbServer">🗄️</div>
    <div style="font-size:11px;color:#888;margin-top:4px">MySQL DB · 生产环境</div>
  </div>
  <div class="defense-barrier">
    <button class="barrier-btn" id="shield0" onclick="useShield(0)" title="参数化查询">🔐</button>
    <button class="barrier-btn" id="shield1" onclick="useShield(1)" title="输入转义">🧹</button>
    <button class="barrier-btn" id="shield2" onclick="useShield(2)" title="WAF规则">🛡️</button>
  </div>
  <div class="query-stream" id="queryStream"><div style="color:#444;font-size:11px;padding:8px">查询流等待中...</div></div>
</div>
<div class="result-overlay" id="overlay"><h2 id="oTitle"></h2><p id="oDesc" style="color:#888;margin:8px 0"></p><button id="oBtn">🔄 重新部署防线</button></div>
<footer>SQL Defense Training · 🦊 灵犀出品</footer>
<script>
const QUERIES=[
  {q:"SELECT * FROM users WHERE id = 1",attack:false,note:'正常查询'},
  {q:"SELECT * FROM users WHERE id = 1 OR 1=1",attack:true,note:'OR 注入 — 返回所有用户',shield:'参数化查询'},
  {q:"SELECT name, email FROM users WHERE id = 42",attack:false,note:'正常查询 — 只读字段'},
  {q:"SELECT * FROM users WHERE name = 'admin' --'",attack:true,note:'注释注入 — 绕过密码验证',shield:'输入转义'},
  {q:"INSERT INTO logs (msg) VALUES ('user login')",attack:false,note:'正常日志写入'},
  {q:"SELECT * FROM users; DROP TABLE users; --",attack:true,note:'语句堆叠 — 删表攻击',shield:'WAF规则'},
  {q:"UPDATE users SET status = 'active' WHERE id = 5",attack:false,note:'正常更新'},
  {q:"SELECT * FROM users WHERE email = '' UNION SELECT * FROM passwords --",attack:true,note:'UNION注入 — 窃取密码表',shield:'参数化查询'},
  {q:"SELECT COUNT(*) FROM users",attack:false,note:'正常统计'},
  {q:"admin' OR '1'='1",attack:true,note:'认证绕过 — 经典注入',shield:'输入转义'},
  {q:"SELECT * FROM products WHERE price < 100",attack:false,note:'正常查询'},
  {q:"1; EXEC xp_cmdshell('dir')",attack:true,note:'命令执行注入',shield:'WAF规则'},
  {q:"SELECT * FROM orders WHERE user_id = ?",attack:false,note:'参数化查询 — 安全！'},
  {q:"' UNION SELECT username,password FROM admin_users --",attack:true,note:'联合查询 — 窃取管理员凭据',shield:'WAF规则'},
  {q:"SELECT * FROM articles ORDER BY created_at DESC LIMIT 10",attack:false,note:'正常分页'},
  {q:"1'; UPDATE users SET admin=1 WHERE id=1 --",attack:true,note:'权限提升注入',shield:'输入转义'},
];
let score=0,blocked=0,breaches=0,maxBreaches=5,shields=[true,true,true],qIdx=0,gameOn=true,streamTimer=null;

function addQLine(q,cls){
  const s=document.getElementById('queryStream');
  s.innerHTML='<div class="qline '+cls+'"><span style="color:#888">'+(q.attack?'⚠️':'✅')+'</span> '+q.q.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>'+s.innerHTML;
  if(s.children.length>15) s.removeChild(s.lastChild);
}

function sendQuery(){
  if(!gameOn||qIdx>=QUERIES.length){endGame(true);return}
  const q=QUERIES[qIdx];qIdx++;
  if(!q.attack){addQLine(q,'incoming');score+=10;updateHUD();setTimeout(sendQuery,800+Math.random()*400);return}
  // Attack! Has 1.5s to block
  addQLine(q,'incoming');
  if(shields.some(s=>s)){setTimeout(()=>{if(q.attack&&shields.some(s=>s)){breaches++;document.getElementById('dbServer').classList.add('breached');setTimeout(()=>document.getElementById('dbServer').classList.remove('breached'),500);addQLine(q,'passed');updateHUD();if(breaches>=maxBreaches)endGame(false)}},1500)}else{breaches++;addQLine(q,'passed');updateHUD()}
  updateHUD();
  setTimeout(sendQuery,1200+Math.random()*600);
}

function useShield(i){
  if(!shields[i]||!gameOn) return;
  shields[i]=false;blocked++;score+=30;
  document.getElementById('shield'+i).disabled=true;
  document.getElementById('shield'+i).classList.add('used');
  document.getElementById('hShields').textContent=shields.filter(Boolean).length;
  const q=QUERIES[Math.max(0,qIdx-1)]; // block the current attack
  addQLine(q,'blocked');
  // Recharge shield
  setTimeout(()=>{shields[i]=true;document.getElementById('shield'+i).disabled=false;document.getElementById('shield'+i).classList.remove('used');document.getElementById('hShields').textContent=shields.filter(Boolean).length},4000);
  updateHUD();
}

function updateHUD(){
  document.getElementById('hScore').textContent=score;
  document.getElementById('hBlocked').textContent=blocked;
  document.getElementById('hBreaches').textContent=breaches+'/'+maxBreaches;
  if(breaches>=3)document.getElementById('hBreaches').style.color='#ef4444';
}

function endGame(win){
  gameOn=false;
  const o=document.getElementById('overlay');o.style.display='block';
  document.getElementById('oTitle').textContent=win?'🛡️ 防御成功！':'💥 数据库被攻破！';
  document.getElementById('oTitle').style.color=win?'#4ade80':'#f87171';
  document.getElementById('oDesc').textContent='拦截 '+blocked+' · 入侵 '+breaches+' · 得分 '+score;
  document.getElementById('oBtn').onclick=()=>{o.style.display='none';score=0;blocked=0;breaches=0;shields=[true,true,true];qIdx=0;gameOn=true;document.getElementById('queryStream').innerHTML='<div style="color:#444;font-size:11px;padding:8px">查询流等待中...</div>';updateHUD();sendQuery()}
}

sendQuery();
</script>

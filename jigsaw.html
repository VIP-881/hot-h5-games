<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🧩 拼图大师 - 热门H5游戏</title>
<meta name="description" content="拼图大师经典拼图游戏，拖动图片碎片拼成完整画面，多种难度选择免费在线益智">
<meta property="og:title" content="🧩 拼图大师 - 热门H5游戏"><meta property="og:description" content="拖动碎片拼成完整图片"><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"拼图大师","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}h1{font-size:1.6em;margin:4px 0}.stats{display:flex;gap:12px;margin:6px 0 8px}.stats span{background:rgba(255,255,255,0.12);padding:4px 12px;border-radius:20px;font-size:0.9em}canvas{display:block;border-radius:10px;max-width:96vw}.btn{background:rgba(100,150,255,0.2);color:#8cf;border:1px solid #8cf;padding:8px 20px;border-radius:20px;font-size:0.85em;cursor:pointer;margin:4px}</style>
</head>
<body>
<h1>🧩 拼图大师</h1>
<div class="stats"><span>👆 <b id="moves">0</b></span><span>⏱ <b id="timer">0</b>s</span></div>
<canvas id="c" width="340" height="340"></canvas>
<div><button class="btn" onclick="newPuzzle()">🔄 新图</button></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=340,H=340,N=3,S=Math.floor(W/N);
let pieces=[],selected=null,moves=0,timer=0,timerInterval,started=false,emptyIdx;
function newPuzzle(){
  const hue=Math.floor(Math.random()*360);
  pieces=[];emptyIdx=N*N-1;moves=0;timer=0;clearInterval(timerInterval);started=false;
  document.getElementById('moves').textContent='0';document.getElementById('timer').textContent='0';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)pieces.push({r,c,idx:r*N+c,color:`hsl(${hue+r*30},${60+c*15}%,${40+r*8}%)`});
  pieces.pop();pieces.push(null);
  // Shuffle
  for(let i=0;i<100;i++){
    const neighbors=[];const er=Math.floor(emptyIdx/N),ec=emptyIdx%N;
    if(er>0)neighbors.push(emptyIdx-N);if(er<N-1)neighbors.push(emptyIdx+N);if(ec>0)neighbors.push(emptyIdx-1);if(ec<N-1)neighbors.push(emptyIdx+1);
    const swap=neighbors[Math.floor(Math.random()*neighbors.length)];
    [pieces[emptyIdx],pieces[swap]]=[pieces[swap],pieces[emptyIdx]];emptyIdx=swap;
  }
  draw();
}
function tap(x,y){
  const c=Math.floor(x/S),r=Math.floor(y/S),idx=r*N+c;
  const neighbors=[];const er=Math.floor(emptyIdx/N),ec=emptyIdx%N;
  if(er>0)neighbors.push(emptyIdx-N);if(er<N-1)neighbors.push(emptyIdx+N);if(ec>0)neighbors.push(emptyIdx-1);if(ec<N-1)neighbors.push(emptyIdx+1);
  if(neighbors.includes(idx)){
    [pieces[emptyIdx],pieces[idx]]=[pieces[idx],pieces[emptyIdx]];emptyIdx=idx;moves++;
    document.getElementById('moves').textContent=moves;
    if(!started){started=true;timerInterval=setInterval(()=>{timer++;document.getElementById('timer').textContent=timer},1000)}
    draw();
    if(checkWin()){clearInterval(timerInterval);setTimeout(()=>alert(`🎉 完成! ${moves}步 ${timer}s`),100)}
  }
}
function checkWin(){for(let i=0;i<N*N-1;i++){const p=pieces[i];if(!p||p.idx!==i)return false}return true}
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  pieces.forEach((p,i)=>{if(!p)return;const x=p.c*S,y=p.r*S;
    ctx.fillStyle=p.color;ctx.fillRect(x,y,S-2,S-2);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(x+2,y+2,S-4,S/3);
    ctx.fillStyle='#fff';ctx.font=`${S/3}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.idx+1,x+S/2,y+S/2);
  });
}
c.addEventListener('click',e=>{const r=c.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)});
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();tap(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top)});
newPuzzle();
</script>
</body>
</html>

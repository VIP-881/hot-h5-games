<title>🎮 扫雷 - 灵犀游戏大厅 | 免费H5在线小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:1.6em;margin:4px 0}
.stats{display:flex;gap:16px;margin:4px 0 10px}
.stats span{background:rgba(255,255,255,0.12);padding:5px 14px;border-radius:20px;font-size:0.95em}
.grid{display:grid;grid-template-columns:repeat(9,38px);grid-template-rows:repeat(9,38px);gap:2px}
.cell{width:38px;height:38px;background:rgba(255,255,255,0.08);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:0.9em;transition:background 0.1s}
.cell.revealed{background:rgba(255,255,255,0.03)}
.cell.flagged{background:rgba(255,100,100,0.15)}
.cell.n1{color:#1e90ff}.cell.n2{color:#2ed573}.cell.n3{color:#ff4757}.cell.n4{color:#a55eea}.cell.n5{color:#ff6348}.cell.n6{color:#eccc68}.cell.n7{color:#ffa502}.cell.n8{color:#dfe6e9}
.btn{background:rgba(100,200,255,0.2);color:#6cf;border:1px solid #6cf;padding:8px 24px;border-radius:20px;font-size:0.9em;cursor:pointer;margin-top:10px;transition:all 0.2s}
.btn:hover{background:rgba(100,200,255,0.3)}
</style>
<link rel="canonical" href="https://VIP-881.github.io/hot-h5-games/mines.html">
</head>
<body>
<h1>💣 扫雷</h1>
<div class="stats"><span>🚩 <b id="flags">10</b></span><span>⏱ <b id="timer">0</b>s</span><span>🏆 <b id="best">--</b>s</span></div>
<div class="grid" id="grid"></div>
<button class="btn" onclick="restart()">🔄 新游戏</button>
<script>
const ROWS=9,COLS=9,MINES=10;
let board=[],revealed=[],flagged=[],startTime,timerInterval,elapsed=0,gameover=false,started=false,best;
try{best=parseInt(localStorage.getItem('mines_best'))||0;document.getElementById('best').textContent=best?`${best}s`:'--s'}catch(e){}

function init(){
  board=Array(ROWS).fill().map(()=>Array(COLS).fill(0));
  revealed=Array(ROWS).fill().map(()=>Array(COLS).fill(false));
  flagged=Array(ROWS).fill().map(()=>Array(COLS).fill(false));
  let placed=0;
  while(placed<MINES){const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);if(board[r][c]!==-1){board[r][c]=-1;placed++}}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]!==-1){
    let count=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1)count++;
    }
    board[r][c]=count;
  }
  gameover=false;started=false;elapsed=0;
  document.getElementById('flags').textContent=MINES;document.getElementById('timer').textContent='0';
  clearInterval(timerInterval);
  render();
}
function reveal(r,c){
  if(gameover||revealed[r][c]||flagged[r][c])return;
  if(!started){started=true;startTime=Date.now();timerInterval=setInterval(()=>{elapsed=Math.floor((Date.now()-startTime)/1000);document.getElementById('timer').textContent=elapsed},200)}
  revealed[r][c]=true;
  if(board[r][c]===-1){gameover=true;clearInterval(timerInterval);revealAll();render();alert('💣 踩雷了!');return}
  if(board[r][c]===0){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)reveal(nr,nc);
    }
  }
  checkWin();
}
function checkWin(){
  let allClear=true;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]!==-1&&!revealed[r][c]){allClear=false;break}
  if(allClear){
    gameover=true;clearInterval(timerInterval);
    if(!best||elapsed<best){best=elapsed;document.getElementById('best').textContent=`${best}s`;try{localStorage.setItem('mines_best',best)}catch(e){}}
    setTimeout(()=>alert(`🎉 扫雷成功! ${elapsed}s`),100);
  }
}
function revealAll(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]===-1)revealed[r][c]=true}
function toggleFlag(r,c){
  if(gameover||revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];
  const f=flagged.flat().filter(Boolean).length;
  document.getElementById('flags').textContent=MINES-f;
  render();
}
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const el=document.createElement('div');el.className='cell';
    if(revealed[r][c]){
      el.classList.add('revealed');
      if(board[r][c]===-1)el.textContent='💣';
      else if(board[r][c]>0){el.textContent=board[r][c];el.classList.add(`n${board[r][c]}`)}
    }else if(flagged[r][c]){el.textContent='🚩';el.classList.add('flagged')}
    el.addEventListener('click',()=>reveal(r,c));
    el.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c)});
    el.addEventListener('touchstart',e=>{e.preventDefault();let timer=setTimeout(()=>{toggleFlag(r,c);clearTimeout(timer)},500)});
    el.addEventListener('touchend',e=>{clearTimeout(timer)});
    g.appendChild(el);
  }
}
function restart(){init()}
init();
</script>
</body>
</html>

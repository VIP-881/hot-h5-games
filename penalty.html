<title>🎮 Penalty - 灵犀游戏大厅 | 免费H5在线小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#2d5016,#1a3a0a);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
h1{font-size:1.6em;margin-bottom:4px}
.stats{display:flex;gap:16px;margin:6px 0}
.stats span{background:rgba(255,255,255,0.15);padding:5px 14px;border-radius:20px;font-size:0.95em}
canvas{display:block;border-radius:10px;max-width:96vw;box-shadow:0 6px 30px rgba(0,0,0,0.3)}
.hint{color:#aaa;font-size:0.85em;margin-top:4px}
.btn{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:8px 24px;border-radius:20px;font-size:0.9em;cursor:pointer;margin-top:8px}
.btn:hover{background:rgba(255,255,255,0.25)}
</style>
<link rel="canonical" href="https://VIP-881.github.io/hot-h5-games/penalty.html">
<meta property="og:image" content="https://vip-881.github.io/hot-h5-games/og-image.png">
<meta name="twitter:image" content="https://vip-881.github.io/hot-h5-games/og-image.png">
</head>
<body>
<h1>⚽ 点球大战</h1>
<div class="stats"><span>👤 <b id="pscore">0</b></span><span>🤖 <b id="ascore">0</b></span><span>🎯 <b id="round">1</b>/5</span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="440"></canvas>
<div class="hint" id="hint">👆 点击球门位置射门</div>
<button class="btn" onclick="restart()">🔄 重新比赛</button>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=360,H=440;
let goal={x:80,y:60,w:200,h:140},ball={x:W/2,y:H-60,r:14},shot=false,shotX,shotY,showResult=false,result='',resultTimer=0,ps=0,as=0,round=1,best=0,phase='shoot',keeperX=W/2,keeperAnim=0;
try{best=parseInt(localStorage.getItem('penalty_best'))||0;document.getElementById('best').textContent=best}catch(e){}

function resetShot(){shot=false;showResult=false;result='';ball.x=W/2;ball.y=H-60;keeperX=W/2+30}
function shootGoal(tx,ty){
  if(shot||phase!=='shoot')return;
  shotX=tx;shotY=ty;shot=true;
  setTimeout(()=>{showResult=true;
    const inGoal=tx>goal.x+15&&tx<goal.x+goal.w-15&&ty>goal.y+10&&ty<goal.y+goal.h-10;
    keeperX=W/2+(Math.random()*160-80);
    const keeperDist=Math.abs(tx-keeperX);
    if(inGoal&&keeperDist>35){result='goal';ps++;document.getElementById('pscore').textContent=ps}
    else if(inGoal&&keeperDist<=35){result='save'}
    else{result='miss'}
    document.getElementById('hint').textContent=result==='goal'?'⚽ 进了!' : result==='save'?'🧤 被扑出!' : '💨 打偏了!';
    setTimeout(()=>aiTurn(),1500);
  },300);
}
function aiTurn(){
  phase='ai';keeperX=W/2;showResult=false;shot=false;ball.x=W/2;ball.y=goal.y+goal.h/2;
  keeperAnim=Math.random()*160-80;
  setTimeout(()=>{
    const aiX=goal.x+40+Math.random()*(goal.w-80);
    const aiY=goal.y+30+Math.random()*(goal.h-60);
    const kx=W/2+keeperAnim;
    const kDist=Math.abs(aiX-kx);
    if(kDist>35){as++;document.getElementById('ascore').textContent=as}
    document.getElementById('hint').textContent=kDist>35?'🤖 AI 进球了!' : '🦊 你扑出了!';
    setTimeout(()=>{round++;document.getElementById('round').textContent=Math.min(round,5);if(round>5)endGame();else{phase='shoot';resetShot();document.getElementById('hint').textContent='👆 点击球门位置射门'}},1200);
  },800);
}
function endGame(){
  phase='end';
  const won=ps>as;
  if(won&&ps>best){best=ps;document.getElementById('best').textContent=best;try{localStorage.setItem('penalty_best',best)}catch(e){}}
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.textAlign='center';
  ctx.fillText(won?'🏆 你赢了!':ps===as?'🤝 平局!':'😢 你输了',W/2,H/2-15);
  ctx.font='16px sans-serif';ctx.fillText(`${ps} : ${as}`,W/2,H/2+20);
}
function draw(){
  ctx.fillStyle='#3a6b2a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(goal.x,goal.y,goal.w,goal.h);
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(goal.x,goal.y,goal.w,goal.h);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(goal.x,goal.y+goal.h/2);ctx.lineTo(goal.x+goal.w,goal.y+goal.h/2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(goal.x+goal.w/2-1,goal.y,2,goal.h);
  ctx.setLineDash([4,6]);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(W/2,goal.y-20,50,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  if(phase==='shoot'){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.stroke();
    if(shot&&showResult){
      ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(shotX,shotY,12,0,Math.PI*2);ctx.fill();
    }
  }
  if(phase==='ai'){
    ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#0ff';ctx.beginPath();ctx.roundRect(keeperX-15,goal.y+goal.h/2-18,30,36,6);ctx.fill();
  ctx.fillStyle='#00f';ctx.fillRect(keeperX-12,goal.y+goal.h/2-14,24,28);
  ctx.fillStyle='#fff';ctx.fillRect(keeperX-3,goal.y+goal.h/2-10,6,4);
}
c.addEventListener('click',e=>{
  if(phase==='end'){restart();return}
  if(phase!=='shoot')return;
  const rect=c.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  shootGoal(x,y);
});
function restart(){ps=0;as=0;round=1;phase='shoot';resetShot();document.getElementById('pscore').textContent='0';document.getElementById('ascore').textContent='0';document.getElementById('round').textContent='1';document.getElementById('hint').textContent='👆 点击球门位置射门'}
function loop(){update?draw():null;draw();requestAnimationFrame(loop)}
function update(){}
loop();
</script>
</body>

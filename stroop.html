<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🎨 辨色大师 - 热门H5游戏</title>
<meta name="description" content="辨色大师H5小游戏，斯楚普效应挑战，快速判断字的颜色而非字义，考验大脑反应力，免费在线脑力游戏">
<meta property="og:title" content="🎨 辨色大师 - 热门H5游戏">
<meta property="og:description" content="斯楚普效应挑战，辨认字色而非字义">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"辨色大师","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#16213e,#0f3460);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none}
h1{font-size:1.8em;margin:4px 0}
.stats{display:flex;gap:12px;margin:6px 0 10px}
.stats span{background:rgba(255,255,255,0.12);padding:5px 14px;border-radius:20px;font-size:0.95em}
.word{font-size:5em;font-weight:bold;margin:20px 0;text-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:pointer;text-align:center;transition:all 0.1s}
.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;width:95vw}
.btn-c{padding:14px;border-radius:10px;font-size:1.1em;font-weight:bold;cursor:pointer;border:none;color:#fff;transition:all 0.15s}
.btn-c:active{transform:scale(0.95)}
.timer-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin:10px 0;width:320px;max-width:90vw;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#2ed573,#ffa502,#ff4757);border-radius:3px;transition:width 0.05s linear}
</style>
</head>
<body>
<h1>🎨 辨色大师</h1>
<div class="stats"><span>✅ <b id="score">0</b></span><span>🔥 <b id="streak">0</b></span><span>🏆 <b id="best">0</b></span></div>
<div class="word" id="word">红色</div>
<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
<div class="buttons">
  <button class="btn-c" style="background:#e74c3c" onclick="guess('red')">红</button>
  <button class="btn-c" style="background:#3498db" onclick="guess('blue')">蓝</button>
  <button class="btn-c" style="background:#2ecc71" onclick="guess('green')">绿</button>
  <button class="btn-c" style="background:#f39c12" onclick="guess('orange')">橙</button>
  <button class="btn-c" style="background:#9b59b6" onclick="guess('purple')">紫</button>
  <button class="btn-c" style="background:#1abc9c" onclick="guess('teal')">青</button>
</div>
<script>
const colors={red:'#e74c3c',blue:'#3498db',green:'#2ecc71',orange:'#f39c12',purple:'#9b59b6',teal:'#1abc9c'};
const words={red:'红色',blue:'蓝色',green:'绿色',orange:'橙色',purple:'紫色',teal:'青色'};
let currentColor='',score=0,streak=0,best=0,timeLeft=100,timerInterval,active=true;
try{best=parseInt(localStorage.getItem('stroop_best'))||0;document.getElementById('best').textContent=best}catch(e){}

function newRound(){
  const colorKeys=Object.keys(colors);
  currentColor=colorKeys[Math.floor(Math.random()*colorKeys.length)];
  let wordColor;
  do{wordColor=colorKeys[Math.floor(Math.random()*colorKeys.length)]}while(wordColor===currentColor&&Math.random()<0.6);
  document.getElementById('word').textContent=words[wordColor];
  document.getElementById('word').style.color=colors[currentColor];
  timeLeft=100;document.getElementById('timerFill').style.width='100%';active=true;
  document.querySelectorAll('.btn-c').forEach(b=>b.disabled=false);
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{timeLeft--;document.getElementById('timerFill').style.width=`${timeLeft}%`;if(timeLeft<=0){timeUp();clearInterval(timerInterval)}},40);
}
function guess(color){
  if(!active)return;clearInterval(timerInterval);active=false;
  document.querySelectorAll('.btn-c').forEach(b=>b.disabled=true);
  if(color===currentColor){score++;streak++;document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('stroop_best',best)}catch(e){}}}
  else{streak=0;document.getElementById('streak').textContent='0';document.getElementById('word').textContent='❌'}
  setTimeout(newRound,400);
}
function timeUp(){active=false;streak=0;document.getElementById('streak').textContent='0';document.querySelectorAll('.btn-c').forEach(b=>b.disabled=true);document.getElementById('word').textContent='⏰';setTimeout(newRound,600)}
newRound();
</script>
</body>
</html>

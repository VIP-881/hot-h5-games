<body>
<nav><a href="index.html">← 大厅</a><span>🎯 GitHub 大富翁</span></nav>
<header><h1>🎯 GitHub 提交大富翁</h1><p>每次 commit = 掷骰 · 合入 PR = 买地 · Review = 过路费</p></header>
<div class="dashboard">
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div style="text-align:center;margin:12px 0">
      <button class="btn btn-dice" id="diceBtn" onclick="rollDice()">🎲 掷骰子！</button>
      <div class="dice-result" id="diceResult"></div>
    </div>
  </div>
  <div class="side-panel">
    <div class="panel-card">
      <h3>👤 玩家</h3>
      <div class="stat-row"><span class="label">GitHub</span><span class="val" id="ghUser">...</span></div>
      <div class="stat-row"><span class="label">💰 金币</span><span class="val coin" id="coins">0</span></div>
      <div class="stat-row"><span class="label">🏠 地产</span><span class="val" id="properties">0</span></div>
      <div class="stat-row"><span class="label">⬆️ 总 Commits</span><span class="val commit" id="totalCommits">0</span></div>
      <div class="stat-row"><span class="label">🔀 总 PRs</span><span class="val pr" id="totalPRs">0</span></div>
    </div>
    <div class="panel-card">
      <h3>📜 事件日志</h3>
      <div class="log" id="log"><div class="entry" style="color:#666">点击掷骰子开始...</div></div>
    </div>
    <button class="btn btn-refresh" onclick="init()">🔄 同步 GitHub 数据</button>
  </div>
</div>

<script>
const AK='v2.xOedfPfv9hou9ht8BXTbk7OKPlRUUvh5WuyJNC8Q3mLrU5dQVGL5rARouO2DNnC-IKG0UGeYm79Cfw1aIjsOw48Fram7uaVouZHiYKGTZzMBg4SuQLJLz4gY';
let player={coins:100,position:0,properties:[],commits:0,prs:0,reviews:0};
let repos=[], boardCells=[], animating=false;

const CELL_COLORS=['#8b5cf6','#06b6d4','#f59e0b','#ef4444','#22c55e','#ec4899','#a78bfa','#fb923c'];
const CORNER_EMOJIS=['🚀','💎','🛑','🏆'];

async function gh(url){
  const r=await fetch('https://gateway.maton.ai'+url,{headers:{'Authorization':'Bearer '+AK}});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

async function init(){
  try{
    document.getElementById('log').innerHTML='<div class="entry" style="color:#a78bfa">⏳ 同步 GitHub...</div>';
    const user=await gh('/github/user');
    document.getElementById('ghUser').textContent=user.login;
    const allRepos=await gh('/github/user/repos?per_page=20&sort=updated');
    repos=allRepos.slice(0,16);
    // Get events for commit/pr counts
    try{
      const events=await gh('/github/users/'+user.login+'/events?per_page=100');
      const pushes=events.filter(e=>e.type==='PushEvent');
      const prs=events.filter(e=>e.type==='PullRequestEvent'&&e.payload.action==='closed');
      player.commits=pushes.reduce((s,e)=>s+(e.payload.size||0),0);
      player.prs=prs.length;
      player.reviews=events.filter(e=>e.type==='PullRequestReviewEvent').length;
      document.getElementById('totalCommits').textContent=player.commits;
      document.getElementById('totalPRs').textContent=player.prs;
    }catch(e){}
    buildBoard();
    updateUI();
    addLog('✅ 同步完成！'+repos.length+' 个仓库就位');
  }catch(e){
    addLog('❌ 同步失败: '+e.message);
    // Fallback with placeholder repos
    repos=Array.from({length:16},(_,i)=>({name:'repo-'+i,language:['JS','TS','Py','Go','Rust','RB','Java','C'][i%8]}));
    buildBoard();
    updateUI();
  }
}

function buildBoard(){
  // Build 5x5 path: top row left to right, right col down, bottom row right to left, left col up
  const positions=[];
  for(let i=0;i<5;i++) positions.push({r:0,c:i}); // top
  for(let i=1;i<5;i++) positions.push({r:i,c:4}); // right
  for(let i=3;i>=0;i--) positions.push({r:4,c:i}); // bottom
  for(let i=3;i>=1;i--) positions.push({r:i,c:0}); // left
  const grid=Array.from({length:5},()=>Array(5).fill(null));
  positions.forEach((p,i)=>{
    const isCorner=i===0||i===4||i===8||i===12;
    const repoIdx=isCorner?-1:(i<=4?i-1:i<=8?i-1:i<=12?Math.min(i-2,i-10):i-3);
    grid[p.r][p.c]={...p,index:i,isCorner,repoIdx};
  });
  boardCells=positions.map(p=>grid[p.r][p.c]);

  let html='';
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      const cell=grid[r][c];
      if(!cell){html+='<div></div>';continue;}
      const classes=['cell'];
      if(cell.isCorner) classes.push('corner');
      else classes.push('property');
      if(player.properties.includes(cell.index)) classes.push('owned');
      if(player.position===cell.index) classes.push('player');
      const style=cell.isCorner?'':('border-left:3px solid '+CELL_COLORS[(cell.repoIdx||0)%8]);
      let content='';
      if(cell.isCorner){
        const emojis=['🚀开始','💎宝箱','🛑暂停','🏆大奖'];
        content='<span class="cell-emoji">'+emojis[cell.index/4]+'</span>';
      }else{
        const repo=repos[cell.repoIdx]||{name:'空地',language:''};
        content='<span class="cell-emoji">'+(repo.language==='JavaScript'?'📒':repo.language==='TypeScript'?'📘':repo.language==='Python'?'🐍':repo.language==='Go'?'🐹':repo.language==='Rust'?'🦀':'📦')+'</span><span class="cell-name">'+(repo.name||'').substring(0,10)+'</span><span class="cell-price">💰'+(cell.repoIdx+1)*50+'</span>';
      }
      html+='<div class="'+classes.join(' ')+'" style="'+style+'" onclick="'+(cell.isCorner?'':'buyProperty('+cell.index+')')+'">'+content+'</div>';
    }
  }
  document.getElementById('board').innerHTML=html;
}

function rollDice(){
  if(animating) return;
  animating=true;
  const dice=Math.floor(Math.random()*6)+1;
  document.getElementById('diceBtn').disabled=true;
  document.getElementById('diceResult').innerHTML='<div class="dice-anim">'+['⚀','⚁','⚂','⚃','⚄','⚅'][dice-1]+'</div>';
  addLog('🎲 掷出 '+dice+' 点');
  setTimeout(()=>{
    player.position=(player.position+dice)%16;
    player.coins+=10; // salary
    const cell=boardCells[player.position];
    if(!cell.isCorner&&player.properties.includes(cell.index)){
      player.coins+=20; // rent
      addLog('💰 经过自己的地产，收租 +20');
    }
    if(cell.index===4){player.coins+=50;addLog('💎 经过宝箱！+50 金币')}
    if(cell.index===12){player.coins+=100;addLog('🏆 大奖！+100 金币')}
    buildBoard();
    updateUI();
    document.getElementById('diceBtn').disabled=false;
    document.getElementById('diceResult').innerHTML='<span style="color:#fbbf24">'+['⚀','⚁','⚂','⚃','⚄','⚅'][dice-1]+' '+dice+' 步</span>';
    animating=false;
  },700);
}

function buyProperty(idx){
  if(player.properties.includes(idx)){addLog('🏠 你已经拥有这块地了');return}
  const price=(boardCells[idx].repoIdx+1)*50;
  if(player.coins<price){addLog('❌ 金币不足！需要 '+price+' 💰');return}
  player.coins-=price;
  player.properties.push(idx);
  buildBoard();
  updateUI();
  const repo=repos[boardCells[idx].repoIdx]||{name:'未知'};
  addLog('🏠 购买了 '+repo.name+'！-'+price+' 💰');
}

function addLog(msg){
  const l=document.getElementById('log');
  const cls=msg.includes('🎲')?'roll':msg.includes('🏠')?'buy':msg.includes('❌')?'':'commit';
  l.innerHTML='<div class="entry '+cls+'">'+msg+'</div>'+l.innerHTML;
  if(l.children.length>30)l.removeChild(l.lastChild);
}

function updateUI(){
  document.getElementById('coins').textContent=player.coins;
  document.getElementById('properties').textContent=player.properties.length;
  document.getElementById('totalCommits').textContent=player.commits;
  document.getElementById('totalPRs').textContent=player.prs;
}

init();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏹 弹弓消消乐 - 热门H5游戏</title>
<meta name="description" content="弹弓消消乐物理消除游戏，拖拽弹弓发射小球消除上方方块，瞄准反弹精准物理免费在线">
<meta property="og:title" content="🏹 弹弓消消乐 - 热门H5游戏"><meta property="og:description" content="拖拽弹弓发射消除上方方块"><meta property="og:type" content="website"><meta name="twitter:card" content="summary">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"弹弓消消乐","playMode":"SinglePlayer","applicationCategory":"Game","operatingSystem":"Web"}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#1a1a2e,#0d1b2e);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}h1{font-size:1.6em;margin:4px 0}.stats{display:flex;gap:12px;margin:6px 0 8px}.stats span{background:rgba(255,255,255,0.12);padding:4px 12px;border-radius:20px;font-size:0.9em}canvas{display:block;border-radius:10px;max-width:96vw}</style>
</head>
<body>
<h1>🏹 弹弓消消乐</h1>
<div class="stats"><span>🎱 <b id="balls">10</b></span><span>⭐ <b id="score">0</b></span><span>🏆 <b id="best">0</b></span></div>
<canvas id="c" width="360" height="520"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=360,H=520,G=0.25;
let bricks=[],balls=[],aimBall=10,score=0,best=0,angle=-Math.PI/2,power=0,dragging=false,dx=0,dy=0;
try{best=parseInt(localStorage.getItem('sling2_best'))||0;document.getElementById('best').textContent=best}catch(e){}
function genBricks(){
  bricks=[];const cols=7,rows=5,bw=42,bh=18,gap=4,ox=(W-cols*(bw+gap))/2;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:ox+c*(bw+gap),y:40+r*(bh+gap),w:bw,h:bh,hp:1+Math.floor(Math.random()*r),color:`hsl(${r*40},70%,${50+r*5}%)`,pts:(r+1)*5});
}
function fire(p,a){if(aimBall<=0||balls.length>0)return;aimBall--;document.getElementById('balls').textContent=aimBall;balls.push({x:W/2,y:H-50,vx:Math.cos(a)*p*0.2,vy:Math.sin(a)*p*0.2,r:7,hits:0})}
function update(){
  for(let i=balls.length-1;i>=0;i--){balls[i].x+=balls[i].vx;balls[i].y+=balls[i].vy;balls[i].vy+=G;
    if(balls[i].x-balls[i].r<0||balls[i].x+balls[i].r>W)balls[i].vx*=-0.7;
    if(balls[i].y>H+30){balls.splice(i,1);if(aimBall<=0&&bricks.every(b=>b.hp<=0)&&balls.length===0){aimBall=10;document.getElementById('balls').textContent='10';genBricks()}continue}
    for(const bk of bricks){if(bk.hp<=0)continue;if(balls[i].x+balls[i].r>bk.x&&balls[i].x-balls[i].r<bk.x+bk.w&&balls[i].y+balls[i].r>bk.y&&balls[i].y-balls[i].r<bk.y+bk.h){bk.hp--;balls[i].hits++;score+=bk.pts;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;try{localStorage.setItem('sling2_best',best)}catch(e)};balls[i].vy*=-0.8;balls[i].vx*=1.05;if(balls[i].hits>3)balls.splice(i,1);break}}}}
}
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  bricks.forEach(bk=>{if(bk.hp<=0)return;ctx.fillStyle=bk.color;ctx.fillRect(bk.x,bk.y,bk.w,bk.h);ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(bk.x+2,bk.y+2,bk.w-4,3)});
  balls.forEach(b=>{ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()});
  if(!dragging){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.setLineDash([3,4]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,H-50);ctx.lineTo(W/2+Math.cos(angle)*40,H-50+Math.sin(angle)*40);ctx.stroke();ctx.setLineDash([])}
  else{const ax=Math.atan2(dy,dx);const dist=Math.min(100,Math.sqrt(dx*dx+dy*dy));ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,H-50);ctx.lineTo(W/2+Math.cos(ax)*dist,H-50+Math.sin(ax)*dist);ctx.stroke()}
}
c.addEventListener('mousedown',e=>{const r=c.getBoundingClientRect();dragging=true;dx=e.clientX-r.left-W/2;dy=e.clientY-r.top-(H-50)});
c.addEventListener('mousemove',e=>{if(!dragging)return;const r=c.getBoundingClientRect();dx=e.clientX-r.left-W/2;dy=e.clientY-r.top-(H-50)});
c.addEventListener('mouseup',()=>{if(dragging){dragging=false;const dist=Math.min(100,Math.sqrt(dx*dx+dy*dy));fire(dist,Math.atan2(dy,dx))}});
c.addEventListener('touchstart',e=>{e.preventDefault();const r=c.getBoundingClientRect();dragging=true;dx=e.touches[0].clientX-r.left-W/2;dy=e.touches[0].clientY-r.top-(H-50)});
c.addEventListener('touchmove',e=>{e.preventDefault();if(!dragging)return;const r=c.getBoundingClientRect();dx=e.touches[0].clientX-r.left-W/2;dy=e.touches[0].clientY-r.top-(H-50)});
c.addEventListener('touchend',()=>{if(dragging){dragging=false;const dist=Math.min(100,Math.sqrt(dx*dx+dy*dy));fire(dist,Math.atan2(dy,dx))}});
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();angle=Math.atan2((e.clientY-r.top)-(H-50),e.clientX-r.left-W/2)});
function restart(){score=0;aimBall=10;balls=[];document.getElementById('score').textContent='0';document.getElementById('balls').textContent='10';genBricks()}
function loop(){update();draw();requestAnimationFrame(loop)}genBricks();loop();
</script>
</body>
</html>

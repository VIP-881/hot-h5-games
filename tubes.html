<h1>🧪 试管排序</h1>
<div class="stats"><span>🧪 <b id="moves">0</b></span><span>🏆 <b id="best">--</b></span></div>
<div class="tubes" id="tubes"></div>
<button class="btn" onclick="restart()">🔄 重新开始</button>
<script>
const N=6,SLOTS=4,COLORS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6'];
let tubes=[],selected=null,moves=0,best;
try{best=parseInt(localStorage.getItem('tube_best'))||0;document.getElementById('best').textContent=best?`${best}步`:'--'}catch(e){}
function init(){
  const colorPool=[];
  for(let c=0;c<COLORS.length;c++)for(let i=0;i<SLOTS;i++)colorPool.push(c);
  for(let i=colorPool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[colorPool[i],colorPool[j]]=[colorPool[j],colorPool[i]]}
  tubes=Array(N+1).fill().map(()=>[]);
  tubes[N]=[]; // empty tube
  for(let t=0;t<N;t++)for(let s=0;s<SLOTS;s++)tubes[t].push(colorPool[t*SLOTS+s]);
  shuffle(tubes.slice(0,N)); // ensure tubes are shuffled
  selected=null;moves=0;document.getElementById('moves').textContent='0';
  if(isComplete())init(); // re-randomize if accidentally sorted
  render();
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}
function tap(idx){
  if(selected===null){if(tubes[idx].length>0)selected=idx}
  else if(selected===idx)selected=null;
  else{
    const src=tubes[selected],dst=tubes[idx];
    if(dst.length>=SLOTS)return;
    const topColor=src[src.length-1];
    if(dst.length===0||dst[dst.length-1]===topColor){
      let count=1;while(count<src.length&&src[src.length-1-count]===topColor)count++;
      const canMove=Math.min(count,SLOTS-dst.length);
      for(let i=0;i<canMove;i++)dst.push(src.pop());
      moves++;document.getElementById('moves').textContent=moves;
      if(isComplete()){if(!best||moves<best){best=moves;document.getElementById('best').textContent=`${best}步`;try{localStorage.setItem('tube_best',best)}catch(e)}setTimeout(()=>alert(`🎉 完成! ${moves}步`),100)}
    }
    selected=null;
  }
  render();
}
function isComplete(){return tubes.every(t=>{if(t.length===0)return true;return t.length===SLOTS&&t.every(c=>c===t[0])})}
function render(){
  document.getElementById('tubes').innerHTML=tubes.map((t,i)=>`<div class="tube${selected===i?' selected':''}" onclick="tap(${i})">${t.map(c=>`<div class="layer" style="background:${COLORS[c]}"></div>`).join('')}</div>`).join('');
}
function restart(){init()}init();
</script>
